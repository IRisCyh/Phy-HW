<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wednesday Homework</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f6f8;
        --panel: #ffffff;
        --panel-soft: #f8fafc;
        --text: #17202a;
        --muted: #617085;
        --line: #d8e0e8;
        --accent: #256f9d;
        --accent-dark: #184f74;
        --success: #147a4a;
        --warning: #9a5b00;
        --shadow: 0 12px 32px rgba(24, 42, 63, 0.12);
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
      }
      .shell {
        margin: 0 auto;
        max-width: 1040px;
        min-height: 100vh;
        padding: 24px;
      }
      .topbar, .card, .answer-panel, .final-panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }
      .topbar {
        align-items: center;
        display: flex;
        gap: 20px;
        justify-content: space-between;
        margin-bottom: 16px;
        padding: 18px 22px;
      }
      h1, h2, h3 { margin: 0; }
      h1 { font-size: 26px; line-height: 1.15; }
      h2 { font-size: 22px; line-height: 1.2; }
      h3 { color: var(--accent-dark); font-size: 15px; margin-bottom: 8px; }
      p { line-height: 1.55; }
      .stats {
        display: grid;
        gap: 8px;
        grid-template-columns: repeat(3, minmax(86px, 1fr));
      }
      .question-stats {
        grid-template-columns: repeat(3, minmax(86px, 1fr));
      }
      .stats div {
        background: var(--panel-soft);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 9px 11px;
        text-align: right;
      }
      .stats strong { display: block; font-size: 20px; }
      .stats span, .muted { color: var(--muted); font-size: 13px; }
      .card, .answer-panel, .final-panel { padding: 18px; }
      .start-card {
        display: grid;
        gap: 14px;
        margin-top: 24px;
      }
      label { display: grid; gap: 7px; }
      label span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
      }
      select, textarea, button {
        border-radius: 6px;
        font-family: inherit;
        font-size: 15px;
      }
      select, textarea {
        background: #fff;
        border: 1px solid var(--line);
        color: var(--text);
        width: 100%;
      }
      select { min-height: 42px; padding: 0 10px; }
      textarea {
        line-height: 1.5;
        min-height: 150px;
        padding: 12px;
        resize: vertical;
      }
      button {
        background: var(--accent);
        border: 1px solid var(--accent);
        color: #fff;
        cursor: pointer;
        font-weight: 700;
        min-height: 44px;
        padding: 0 16px;
      }
      button:hover { background: var(--accent-dark); }
      button.secondary {
        background: #fff;
        border-color: var(--line);
        color: var(--accent-dark);
      }
      .big-submit {
        display: block;
        font-size: 22px;
        min-height: 74px;
        width: 100%;
      }
      .question-header {
        align-items: start;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 16px;
        justify-content: space-between;
        margin-bottom: 16px;
        padding-bottom: 14px;
      }
      .question-meta {
        color: var(--muted);
        font-size: 13px;
        margin-top: 6px;
      }
      .question-body {
        font-size: 15px;
        line-height: 1.6;
        overflow-wrap: anywhere;
      }
      .answer-panel {
        display: grid;
        gap: 14px;
        margin-top: 16px;
      }
      .choice-list, .assess-list {
        display: grid;
        gap: 10px;
      }
      .choice-list.compact {
        display: flex;
        flex-wrap: wrap;
      }
      .choice, .assess-item {
        align-items: start;
        background: var(--panel-soft);
        border: 1px solid var(--line);
        border-radius: 8px;
        display: grid;
        gap: 10px;
        grid-template-columns: 22px 1fr;
        padding: 10px 12px;
      }
      .choice-letter {
        align-items: center;
        grid-template-columns: 22px auto;
        min-width: 74px;
      }
      .choice-letter span {
        font-size: 18px;
        font-weight: 700;
      }
      .part-card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        display: grid;
        gap: 12px;
        margin-top: 14px;
        padding: 14px;
      }
      .part-card + .part-card {
        margin-top: 18px;
      }
      .part-header {
        align-items: center;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 12px;
        justify-content: space-between;
        padding-bottom: 10px;
      }
      .part-header strong {
        color: var(--accent-dark);
      }
      .part-body {
        display: grid;
        gap: 12px;
      }
      .inline-answer,
      .short-answer {
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--text);
        font: inherit;
      }
      .inline-answer {
        display: block;
        line-height: 1.45;
        margin: 8px 0;
        min-height: 76px;
        padding: 10px;
        resize: vertical;
        width: 100%;
      }
      .short-answer {
        display: inline-block;
        min-height: 34px;
        min-width: 150px;
        padding: 4px 8px;
      }
      .tick-choice-input {
        display: block;
        height: 18px;
        margin: 0 auto;
        width: 18px;
      }
      .mark-scheme {
        background: #fffdf5;
        border: 1px solid #e9dca8;
        border-radius: 8px;
        padding: 14px;
      }
      .answer-collapse {
        background: #fffdf5;
        border: 1px solid #e9dca8;
        border-radius: 8px;
        overflow: hidden;
      }
      .answer-collapse-toggle {
        align-items: center;
        background: transparent;
        border: 0;
        border-radius: 0;
        color: var(--accent-dark);
        cursor: pointer;
        display: flex;
        font-weight: 700;
        min-height: 0;
        justify-content: space-between;
        padding: 12px 14px;
        text-align: left;
        width: 100%;
      }
      .answer-collapse-toggle:hover {
        background: #fff8df;
      }
      .answer-collapse-toggle::after {
        content: "Hide";
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
      }
      .answer-collapse-toggle[data-collapsed="true"]::after {
        content: "Show";
      }
      .answer-collapse-body {
        border-top: 1px solid #e9dca8;
        display: grid;
        gap: 14px;
        padding: 14px;
      }
      .answer-collapse-body .mark-scheme {
        border: 0;
        padding: 0;
      }
      .inline-mark-point {
        align-items: center;
        display: inline-flex;
        gap: 6px;
        margin-right: 6px;
        vertical-align: baseline;
      }
      .inline-mark-point input {
        height: 15px;
        margin: 0;
        width: 15px;
      }
      .inline-mark-point-fallback {
        display: grid;
        gap: 6px;
        margin-top: 12px;
        padding: 0;
      }
      .assessment-score {
        color: var(--success);
        font-weight: 700;
      }
      .nav-row {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
      }
      .rtf-image { height: auto; max-width: 100%; object-fit: contain; }
      .rtf-image-block { display: block; margin: 8px auto; }
      .rtf-image-inline { display: inline-block; margin: 0 4px; max-height: 1.6em; vertical-align: middle; }
      .rtf-table-wrap { margin: 10px 0; max-width: 100%; overflow-x: auto; }
      .rtf-table { border-collapse: collapse; font-size: 13px; line-height: 1.35; max-width: 100%; width: 100%; }
      .rtf-table th, .rtf-table td {
        border: 1px solid var(--line);
        color: var(--text);
        padding: 6px 8px;
        text-align: center;
        vertical-align: middle;
      }
      .status { color: var(--muted); margin: 0; }
      .status.success { color: var(--success); }
      .status.warning { color: var(--warning); }
      @media (max-width: 760px) {
        .shell { padding: 12px; }
        .topbar, .question-header { display: grid; }
        .stats { grid-template-columns: 1fr; }
        .nav-row { display: grid; }
      }
    </style>

      "questionHtml": "Cosmic rays are high-energy particles that come from space. Most of these particles are protons. There are other particles in cosmic rays, including atomic nuclei.\u003cbr\u003e\nThe table below gives the data for one particular nucleus \u003cstrong\u003eX\u003c/strong\u003e.\u003cbr\u003e\n \u003cbr\u003e\n\n\u003cdiv class=\"rtf-table-wrap\"\u003e\u003ctable class=\"rtf-table has-header-row\"\u003e\u003ctbody\u003e\u003ctr\u003e\u003cth\u003eMass / kg\u003c/th\u003e\u003cth\u003e8.02 × 10\u003csup\u003e−26\n\u003c/sup\u003e\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eSpecific charge / C kg\u003csup\u003e−1\n\u003c/sup\u003e\u003c/td\u003e\u003ctd\u003e4.39 × 10\u003csup\u003e7\n\u003c/sup\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eKinetic energy / MeV\u003c/td\u003e\u003ctd\u003e215\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\n(a)  Determine the number of neutrons in nucleus \u003cstrong\u003eX\u003c/strong\u003e.\u003cbr\u003e\n \u003cbr\u003e\nnumber of neutrons = _______________\u003cbr\u003e\n\u003cstrong\u003e(3)\u003cbr\u003e\n\u003c/strong\u003e(b)  Calculate the speed of \u003cstrong\u003eX\u003c/strong\u003e.\u003cbr\u003e\nIgnore relativistic effects.\u003cbr\u003e\n \u003cbr\u003e\nspeed = _______________ m s\u003csup\u003e−1\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/sup\u003e\u003cstrong\u003e(3)\u003cbr\u003e\n\u003c/strong\u003eA pion (\u003cem\u003eπ\u003c/em\u003e\u003csup\u003e+\u003c/sup\u003e) and a kaon (K\u003csup\u003e+\u003c/sup\u003e) are produced when cosmic rays interact with the upper atmosphere.\u003cbr\u003e\n(c)  The \u003cem\u003eπ\u003c/em\u003e\u003csup\u003e+\u003c/sup\u003e decays to produce a positron and an electron neutrino.\u003cbr\u003e\nShow how the conservation laws apply to this decay.\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n\u003cstrong\u003e(2)\u003cbr\u003e\n\u003c/strong\u003e(d)  The K\u003csup\u003e+\u003c/sup\u003e decays to produce an anti-muon and a muon neutrino.\u003cbr\u003e\nExplain how strangeness applies in this decay.\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n\u003cstrong\u003e(2)\u003cbr\u003e\n\u003c/strong\u003e(e)  Write an equation for a K\u003csup\u003e+\u003c/sup\u003e decay that involves only hadrons.\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n\u003cstrong\u003e(2)\u003cbr\u003e\n(Total 12 marks)\u003cbr\u003e\u003c/strong\u003e",
      "markSchemeHtml": "(a)     MP1 is for evidence of determining the charge on the nucleus. ✔\u003cbr\u003e\n\u003cem\u003eCharge = 4.39 × 10\u003csup\u003e7\u003c/sup\u003e × 8.02 × 10\u003csup\u003e–26\u003c/sup\u003e kg\u003cbr\u003e\n(= 3.52 × 10\u003csup\u003e–18\u003c/sup\u003e C)\u003cbr\u003e\n\u003c/em\u003eMP2 is for evidence of determining either the number of protons OR the number of nucleons. ✔\u003cbr\u003e\n\u003cem\u003eNumber of protons = charge/1.6 × 10\u003csup\u003e–19\u003c/sup\u003e (= 22) \u003cbr\u003e\nOR\u003cbr\u003e\nNumber of nucleons\u003cbr\u003e\n= 8.02 × 10\u003csup\u003e–26\u003c/sup\u003e / 1.67 × 10\u003csup\u003e–27\u003c/sup\u003e (= 48)\u003cbr\u003e\n\u003c/em\u003eMP3 is for determining number of neutrons. ✔\u003cbr\u003e\n\u003cem\u003eNumber of neutrons = 48 – 22 = 26\u003cbr\u003e\nNote use of 1.7 gives 27 neutrons and loses MP3\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e3\u003cbr\u003e\n\u003c/strong\u003e(b)     Evidence of conversion of MeV to J ✔\u003cbr\u003e\n\u003cem\u003eEnergy = 2.15 × 10\u003csup\u003e8\u003c/sup\u003e × 1.6 × 10\u003csup\u003e–19\u003c/sup\u003e (= 3.44 × 10\u003csup\u003e–11\u003c/sup\u003e J) - allow POT error in MP1\u003cbr\u003e\n\u003c/em\u003eSubstitution into KE equation ✔\u003cbr\u003e\n\u003cem\u003ev\u003csup\u003e2\u003c/sup\u003e = 2E/m = 8.58 × 10\u003csup\u003e14\u003cbr\u003e\n\u003c/sup\u003e\u003c/em\u003eCorrect final answer ✔ \u003cbr\u003e\n\u003cem\u003ev = 2.9(3) × 10\u003csup\u003e7\u003c/sup\u003e m s\u003csup\u003e–1\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/sup\u003e\u003c/em\u003e\u003cstrong\u003e3\u003cbr\u003e\n\u003c/strong\u003e(c)     \u003cem\u003eπ\u003c/em\u003e\u003csup\u003e+\u003c/sup\u003e → e\u003csup\u003e+\u003c/sup\u003e + \u003cem\u003ev\u003csub\u003ee\u003cbr\u003e\n\u003c/sub\u003e\u003c/em\u003eOR\u003cbr\u003e\ncharge: 1 = 1 + 0✔\u003cbr\u003e\nB: 0 = 0 + 0\u003cbr\u003e\nAND\u003cbr\u003e\nL: 0 = –1 + 1✔\u003cbr\u003e\n(S: 0 = 0 + 0)\u003cbr\u003e\n\u003cstrong\u003e2\u003cbr\u003e\n\u003c/strong\u003e(d)     (Κ\u003csup\u003e+\u003c/sup\u003e → μ\u003csup\u003e+\u003c/sup\u003e + ν\u003csub\u003eμ\u003c/sub\u003e)\u003cbr\u003e\nCorrect strangeness\u003cbr\u003e\n+1 = 0 + 0 ✔\u003cbr\u003e\nWeak interaction so strangeness can change (by 0, +1 or –1) ✔\u003cbr\u003e\n\u003cstrong\u003e2\u003cbr\u003e\n\u003c/strong\u003e(e)     Decay consistent with Q B L conservation✔\u003cbr\u003e\nEquation involving pions ✔\u003cbr\u003e\n\u003cem\u003ee.g.\u003cbr\u003e\nK\u003csup\u003e+\u003c/sup\u003e→ π\u003csup\u003e+\u003c/sup\u003e + π\u003csup\u003e+\u003c/sup\u003e + π\u003csup\u003e-\u003cbr\u003e\n\u003c/sup\u003eK\u003csup\u003e+\u003c/sup\u003e→ π\u003csup\u003e+\u003c/sup\u003e + π\u003csup\u003e0\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/sup\u003e\u003c/em\u003e\u003cstrong\u003e2\u003cbr\u003e\n[12]\u003cbr\u003e\u003c/strong\u003e",

\u003cbr\u003e\n\u003cstrong\u003e(3)\u003cbr\u003e\n\u003c/strong\u003e(b)     Identify the state of an electron in the energy level labelled 0.\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n\u003cstrong\u003e(1)\u003cbr\u003e\n\u003c/strong\u003e(c)     Identify the state of an electron that is in the energy level labelled –13.6 eV.\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n\u003cstrong\u003e(1)\u003cbr\u003e\n\u003c/strong\u003e(d)     Explain why the energy levels are negative.\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n\u003cstrong\u003e(1)\u003cbr\u003e\n\u003c/strong\u003e(e)     Discuss how the discharge tube is made to emit electromagnetic radiation of specific frequencies.\u003cbr\u003e\nIn your answer you should:\u003cbr\u003e\n•        explain why there must be a high potential difference across the tube\u003cbr\u003e\n•        discuss how the energy level diagram in \u003cstrong\u003eFigure 2\u003c/strong\u003e predicts the spectrum shown in \u003cstrong\u003eFigure 1\u003cbr\u003e\n\u003c/strong\u003e•        show how one of the wavelengths of light is related to two of the energy levels in the energy level diagram.\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n\u003cstrong\u003e(6)\u003cbr\u003e\n(Total 12 marks)\u003cbr\u003e\u003c/strong\u003e",
      "markSchemeHtml": "(a)     \u003cem\u003eλ\u003c/em\u003e = 656 nm ✔ \u003cbr\u003e\n\u003cem\u003ePower of 10 error allow 2\u003cbr\u003e\n\u003c/em\u003eUse of \u003cem\u003eE\u003c/em\u003e=\u003cem\u003ehc/λ\u003c/em\u003e ✔ = 3.0 × 10\u003csup\u003e–19\u003c/sup\u003e (J)\u003cbr\u003e\n\u003cem\u003eAllow ecf for wrong choice of wavelength\u003cbr\u003e\nE\u003c/em\u003e/ 1.6 × 10\u003csup\u003e–19\u003cbr\u003e\n\u003c/sup\u003e= 1.9 (1.88) (allow 1sf if correct)\u003cbr\u003e\n\u003cem\u003eTreat as skill mark – allow conversion for any value of E\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e3\u003cbr\u003e\n\u003c/strong\u003e(b)     They are (just) free ✔\u003cbr\u003e\n\u003cem\u003eAllow released from atom\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e1\u003cbr\u003e\n\u003c/strong\u003e(c)     This is the ground state ✔\u003cbr\u003e\nor\u003cbr\u003e\nThis is the lowest level an electron can occupy\u003cbr\u003e\n\u003cem\u003eAllow lowest energy state\u003cbr\u003e\nCondone level for state\u003cbr\u003e\nAllow description of ground state\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e1\u003cbr\u003e\n\u003c/strong\u003e(d)     To become free / to remove an electron (reach zero energy) energy has to be supplied ✔\u003cbr\u003e\nor\u003cbr\u003e\nEnergy decreases from 0 as electrons move to lower energy levels/relate to energy needed to move from that state to 0\u003cbr\u003e\n\u003cem\u003eOr\u003cbr\u003e\nElectrons release energy as they move lower\u003cbr\u003e\nOr\u003cbr\u003e\nZero is the maximum energy\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e1\u003cbr\u003e\n\u003c/strong\u003e(e)     \u003cstrong\u003eThe mark scheme gives some guidance as to what statements are expected to be seen in a 1 or 2 mark (L1), 3 or 4 mark (L2) and 5 or 6 mark (L3) answer. Guidance provided in section 3.10 of the ‘Mark Scheme Instructions’ document should be used to assist in marking this question\u003cbr\u003e\n\u003c/strong\u003e \u003cbr\u003e\n\n\u003cdiv class=\"rtf-table-wrap\"\u003e\u003ctable class=\"rtf-table\"\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003c/td\u003e\u003ctd\u003eMark\u003c/td\u003e\u003ctd\u003eCriteria\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003c/td\u003e\u003ctd\u003e6\u003c/td\u003e\u003ctd\u003eAll three aspects analysed. 6 marks can be awarded even if there is an error and/or parts of one aspect missing.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003c/td\u003e\u003ctd\u003e5\u003c/td\u003e\u003ctd\u003eA fair attempt to analyse all 3 aspects. If there are a couple of errors or missing parts then 5 marks should be awarded.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003c/td\u003e\u003ctd\u003e4\u003c/td\u003e\u003ctd\u003eTwo aspects successfully discussed, or one discussed and two others covered partially. Whilst there will be gaps, there should only be an occasional error.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003c/td\u003e\u003ctd\u003e3\u003c/td\u003e\u003ctd\u003eTwo aspects discussed, or one discussed and two others covered partially. There are likely to be several errors and omissions in the discussion.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003c/td\u003e\u003ctd\u003e2\u003c/td\u003e\u003ctd\u003eOnly one aspect discussed successfully, or makes a partial attempt at 2 or all 3.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003c/td\u003e\u003ctd\u003e1\u003c/td\u003e\u003ctd\u003eNone of the three aspects covered without significant error.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003c/td\u003e\u003ctd\u003e0\u003c/td\u003e\u003ctd\u003eNo relevant analysis.\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\n\u003cem\u003eThe following statements are likely to be present.\u003cbr\u003e\n\u003cstrong\u003eA Reason for high potential difference\u003cbr\u003e\n\u003c/strong\u003epd accelerates electrons/produces high speed / high energy electrons in the tube L1\u003cbr\u003e\nelectrons have to have sufficient energy to excite the atoms/raise electrons into higher levels L3\u003cbr\u003e\n\u003cstrong\u003eB Relation between spectrum and energy level diagram\u003cbr\u003e\n\u003c/strong\u003eVisible spectrum results from excited electrons moving into the lower level at -3.4 eV L3\u003cbr\u003e\nEach transition results in a photon of light L2\u003cbr\u003e\nEnergy of photon is the difference in the energies of the two levels L2\u003cbr\u003e\nFrequency of light in the spectrum given by ∆E = hf L1\u003cbr\u003e\n\u003cstrong\u003eC Relevant calculation clearly communicated\u003cbr\u003e\n\u003c/strong\u003eGives an example: eg the lowest frequency is due to a transition from the -1.5 eV level to the -3.4 level L1\u003cbr\u003e\nUses an energy difference to deduce one of the wavelengths: eg energy difference in J = 3 × 10\u003csup\u003e–19\u003c/sup\u003e L2\u003cbr\u003e\nλ = hc/E = 660 nm L2\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e6\u003cbr\u003e\n[12]\u003cbr\u003e\u003c/strong\u003e",

          "markSchemeHtml": "(d)     To become free / to remove an electron (reach zero energy) energy has to be supplied ✔\u003cbr\u003e\nor\u003cbr\u003e\nEnergy decreases from 0 as electrons move to lower energy levels/relate to energy needed to move from that state to 0\u003cbr\u003e\n\u003cem\u003eOr\u003cbr\u003e\nElectrons release energy as they move lower\u003cbr\u003e\nOr\u003cbr\u003e\nZero is the maximum energy\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e1\u003cbr\u003e\n\u003c/strong\u003e",

        {
          "id": "p-e",
          "label": "(e)",
          "marks": 6,
          "questionHtml": "(e)     Discuss how the discharge tube is made to emit electromagnetic radiation of specific frequencies.\u003cbr\u003e\nIn your answer you should:\u003cbr\u003e\n•        explain why there must be a high potential difference across the tube\u003cbr\u003e\n•        discuss how the energy level diagram in \u003cstrong\u003eFigure 2\u003c/strong\u003e predicts the spectrum shown in \u003cstrong\u003eFigure 1\u003cbr\u003e\n\u003c/strong\u003e•        show how one of the wavelengths of light is related to two of the energy levels in the energy level diagram.\u003cbr\u003e\n\u003cspan class=\"answer-slot\" data-answer-index=\"0\" data-kind=\"long\" data-width=\"72\"\u003e\u003c/span\u003e\u003cstrong\u003e(6)\u003cbr\u003e",
          "markSchemeHtml": "(e)     \u003cstrong\u003eThe mark scheme gives some guidance as to what statements are expected to be seen in a 1 or 2 mark (L1), 3 or 4 mark (L2) and 5 or 6 mark (L3) answer. Guidance provided in section 3.10 of the ‘Mark Scheme Instructions’ document should be used to assist in marking this question\u003cbr\u003e\n\u003c/strong\u003e \u003cbr\u003e\n\n\u003cdiv class=\"rtf-table-wrap\"\u003e\u003ctable class=\"rtf-table\"\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003c/td\u003e\u003ctd\u003eMark\u003c/td\u003e\u003ctd\u003eCriteria\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003c/td\u003e\u003ctd\u003e6\u003c/td\u003e\u003ctd\u003eAll three aspects analysed. 6 marks can be awarded even if there is an error and/or parts of one aspect missing.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003c/td\u003e\u003ctd\u003e5\u003c/td\u003e\u003ctd\u003eA fair attempt to analyse all 3 aspects. If there are a couple of errors or missing parts then 5 marks should be awarded.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003c/td\u003e\u003ctd\u003e4\u003c/td\u003e\u003ctd\u003eTwo aspects successfully discussed, or one discussed and two others covered partially. Whilst there will be gaps, there should only be an occasional error.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003c/td\u003e\u003ctd\u003e3\u003c/td\u003e\u003ctd\u003eTwo aspects discussed, or one discussed and two others covered partially. There are likely to be several errors and omissions in the discussion.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003c/td\u003e\u003ctd\u003e2\u003c/td\u003e\u003ctd\u003eOnly one aspect discussed successfully, or makes a partial attempt at 2 or all 3.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003c/td\u003e\u003ctd\u003e1\u003c/td\u003e\u003ctd\u003eNone of the three aspects covered without significant error.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u0 ular path\u003cbr\u003e\nor string initially stretches producing an elastic force\u003cbr\u003e\n\u003cstrong\u003eB1\u003cbr\u003e\n(2)\u003cbr\u003e\n\u003c/strong\u003e(ii)     \u003cem\u003eT\u003c/em\u003e – \u003cem\u003emg\u003c/em\u003e = \u003cem\u003emv\u003csup\u003e2\u003c/sup\u003e\u003c/em\u003e / \u003cem\u003er\u003c/em\u003e \u003cstrong\u003eor\u003c/strong\u003e \u003cem\u003eF\u003c/em\u003e = \u003cem\u003emv\u003c/em\u003e\u003csup\u003e2\u003c/sup\u003e / \u003cem\u003er\u003c/em\u003e (or numerical equivalent)\u003cbr\u003e\n\u003cstrong\u003eor\u003c/strong\u003e \u003cem\u003eF\u003c/em\u003e = \u003cem\u003ema\u003c/em\u003e \u003cstrong\u003eand\u003c/strong\u003e \u003cem\u003ea\u003c/em\u003e = \u003cem\u003ev\u003csup\u003e2\u003c/sup\u003e / r\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003eC1\u003cbr\u003e\n\u003c/strong\u003ecentripetal / resultant accelerating force = 6.6 N\u003cbr\u003e\ne.c.f. from (i) (0.0375 × (a)(i)\u003csup\u003e2\u003c/sup\u003e )\u003cbr\u003e\n\u003cstrong\u003eC1\u003cbr\u003e\n\u003c/strong\u003etension = their centripetal force + 4.4 N (11 N)\u003cbr\u003e\n\u003cstrong\u003eA1\u003cbr\u003e\n(3)\u003cbr\u003e\n\u003c/strong\u003e(c)     (i)      \u003cem\u003e m\u003c/em\u003e(13.3)\u003csup\u003e2\u003c/sup\u003e = \u003cem\u003e½ mv\u003csup\u003e2\u003c/sup\u003e\u003c/em\u003e + \u003cem\u003emg\u003c/em\u003e × 4.5\u003cbr\u003e\n\u003cstrong\u003eor\u003c/strong\u003e velocity is same as when falling 4.5 m so \u003cem\u003e½ mv\u003csup\u003e2\u003c/sup\u003e\u003c/em\u003e = \u003cem\u003emg\u003c/em\u003e × 4.5 \u003cbr\u003e\n\u003cstrong\u003eor\u003c/strong\u003e KE at bottom = KE at half way + PE\u003cbr\u003e\nallow \u003cem\u003e½ mv\u003csup\u003e2\u003c/sup\u003e\u003c/em\u003e = \u003cem\u003emg\u003c/em\u003e × 4.5\u003cbr\u003e\n\u003cstrong\u003eB1\u003cbr\u003e\n\u003c/strong\u003e9.4 m s\u003csup\u003e–1\u003c/sup\u003e (no marks if 9.4 m s\u00       }

      function ensurePartAnswer(answer, part) {
        if (!answer.partAnswers[part.id]) {
          answer.partAnswers[part.id] = Array.from({ length: countAnswerSlots(part) }, () => "");
        }
        return answer.partAnswers[part.id];
      }

      function questionComplete(question, answer) {
        if (question.answerMode === "multiple-choice") return answer.submitted;
        return (question.parts || []).every((part) => answer.partSubmitted[part.id]);
      }

      function hydratePartHtml(part, values, disabled) {
        const source = String(part.questionHtml || "");
        const disabledAttr = disabled ? "disabled" : "";
        if (!source.includes('class="answer-slot"')) {
          return `${source}<textarea class="inline-answer" data-answer-input-part="${escapeHtml(part.id)}" data-answer-input-index="0" ${disabledAttr}>${escapeHtml(values[0] || "")}</textarea>`;
        }
        return source.replace(
          /<span class="answer-slot" data-answer-index="(\d+)" data-kind="([^"]+)" data-width="([^"]+)"><\/span>/g,
          (_match, index, kind, width) => {
            const value = escapeHtml(values[Number(index)] || "");
            if (kind === "choice") {
              const checked = values[Number(index)] === String(width) ? "checked" : "";
              return `<input type="radio" class="tick-choice-input" name="answer-${escapeHtml(part.id)}-${index}" data-answer-input-part="${escapeHtml(part.id)}" data-answer-input-index="${index}" value="${escapeHtml(width)}" ${checked} ${disabledAttr}>`;
            }
            if (kind === "short") {
              return `<input class="short-answer" data-answer-input-part="${escapeHtml(part.id)}" data-answer-input-index="${index}" style="width:${Number(width) + 5}ch" value="${value}" ${disabledAttr}>`;
            }
            return `<textarea class="inline-answer" data-answer-input-part="${escapeHtml(part.id)}" data-answer-input-index="${index}" ${disabledAttr}>${value}</textarea>`;
          }
        );
      }

      function renderStart() {
        app.innerHTML = `
          <section class="card start-card">
            <h2>Start assignment</h2>
            <label>
              <span>Student name</span>
              <select id="studentName">
                <option value="">Choose your name</option>
                ${ASSIGNMENT.studentNames.map((name) => `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`).join("")}
              </select>
            </label>
            <button id="startButton" type="button">Start answering</button>
          </section>
        `;
        document.getElementById("startButton").addEventListener("click", () => {
          const name = document.getElementById("studentName").value;
          if (!name) return;
          state.studentName = name;
          state.startedAt = new Date().toISOString();
          studentLine.textContent = `${name} · started ${new Date(state.startedAt).toLocaleString()}`;
          renderQuestion();
        });
      }

      function answerInput(question, answer) {
        if (question.answerMode === "multiple-choice" && question.options.length) {
          return `
            <div class="choice-list compact">
              ${question.options.map((option) => `
                <label class="choice choice-letter">
                  <input type="radio" name="studentAnswer" value="${escapeHtml(option.label)}" ${answer.studentAnswer === option.label ? "checked" : ""} ${answer.submitted ? "disabled" : ""}>
                  <span>${escapeHtml(option.label)}</span>
                </label>
              `).join("")}
            </div>
          `;
        }
        return "";
      }

      function assessmentMarkup(question, answer) {
        if (!answer.submitted) return "";
        if (question.answerMode === "multiple-choice") {
          const isCorrect = answer.studentAnswer && answer.studentAnswer === question.correctOption;
          return `
            <section class="answer-collapse">
              <button class="answer-collapse-toggle" type="button" data-collapse-toggle data-label="answer">Answer</button>
              <div class="answer-collapse-body">
                <section class="mark-scheme">
                  <h3>Answer</h3>
                  <p class="assessment-score">${isCorrect ? "Correct" : "Not correct"}: ${escapeHtml(answer.studentAnswer || "No answer")} · Correct answer: ${escapeHtml(question.correctOption || "See mark scheme")} · Score: ${answer.awardedMarks} / ${question.marks}</p>
                  <div class="question-body">${question.markSchemeHtml}</div>
                </section>
              </div>
            </section>
          `;
        }
        return "";
      }

      function partAssessmentMarkup(part, answer) {
        if (!answer.partSubmitted[part.id]) return "";
        return `
          <section class="answer-collapse">
            <button class="answer-collapse-toggle" type="button" data-collapse-toggle data-label="answer ${escapeHtml(part.label)}">Answer ${escapeHtml(part.label)}</button>
            <div class="answer-collapse-body">
              <section class="mark-scheme">
                <h3>Mark scheme ${escapeHtml(part.label)}</h3>
                <p class="muted">Tick the boxes in the mark scheme. The score is capped at this part's marks.</p>
                <div class="question-body">${markSchemeWithInlineAssess(part, answer)}</div>
                <p class="assessment-score" id="assessmentScore-${escapeHtml(part.id)}">Score: ${answer.partScores[part.id] || 0} / ${part.marks || "?"}</p>
              </section>
            </div>
          </section>
        `;
      }

      function markSchemeWithInlineAssess(part, answer) {
        const items = part.selfAssessItems || [];
        let itemIndex = 0;
        const makeCheckbox = (item) => `
          <label class="inline-mark-point">
            <input type="checkbox" data-assess-part="${escapeHtml(part.id)}" data-assess-id="${escapeHtml(item.id)}" ${answer.checkedItems[item.id] ? "checked" : ""}>
          </label>`;
        const html = String(part.markSchemeHtml || "");
        const withTicks = html.replace(/(✓|✔|&#10003;|&#x2713;|&#10004;|&#x2714;)/g, (tick) => {
          const item = items[itemIndex] || {
            id: `${part.id}-inline-${itemIndex + 1}`,
            label: "Marking point",
            value: 1
          };
          itemIndex += 1;
          return tick + makeCheckbox(item);
        });
        if (itemIndex > 0) return withTicks;

        return `
          ${html}
          <div class="inline-mark-point-fallback">
            ${items.map((item) => `
              <label>
                <input type="checkbox" data-assess-part="${escapeHtml(part.id)}" data-assess-id="${escapeHtml(item.id)}" ${answer.checkedItems[item.id] ? "checked" : ""}>
                ${escapeHtml(item.label)} <em>(+${Number(item.value || 1)})</em>
              </label>
            `).join("")}
          </div>
        `;
      }

      function structuredQuestionMarkup(question, answer) {
        return `
          ${question.introHtml ? `<div class="question-body">${question.introHtml}</div>` : ""}
          ${(question.parts || []).map((part) => {
            const values = ensurePartAnswer(answer, part);
            const submitted = Boolean(answer.partSubmitted[part.id]);
            return `
              <section class="part-card">
                <div class="part-header">
                  <strong>${escapeHtml(part.label)}</strong>
                  <span class="muted">${part.marks || "?"} mark${Number(part.marks) === 1 ? "" : "s"}</span>
                </div>
                <div class="part-body">
                  <div class="question-body">${hydratePartHtml(part, values, submitted)}</div>
                  <button type="button" data-submit-part="${escapeHtml(part.id)}" ${submitted ? "hidden" : ""}>Submit ${escapeHtml(part.label)}</button>
                  ${partAssessmentMarkup(part, answer)}
                </div>
              </section>
            `;
          }).join("")}
        `;
      }

      function collectPartAnswer(part, answer) {
        const inputs = [...document.querySelectorAll(`[data-answer-input-part="${part.id}"]`)];
        const values = [];
        inputs
          .sort((a, b) => Number(a.dataset.answerInputIndex) - Number(b.dataset.answerInputIndex))
          .forEach((input) => {
            const index = Number(input.dataset.answerInputIndex);
            if (input.type === "radio") {
              if (input.checked) values[index] = input.value.trim();
              else if (values[index] === undefined) values[index] = "";
              return;
            }
            values[index] = input.value.trim();
          });
        answer.partAnswers[part.id] = values;
      }

      function updateQuestionAwardedMarks(question, answer) {
        if (question.answerMode === "multiple-choice") {
          answer.awardedMarks = answer.studentAnswer === question.correctOption ? Number(question.marks || 0) : 0;
          refreshGlobalScore();
          return;
        }
        answer.awardedMarks = (question.parts || []).reduce((sum, part) => sum + Number(answer.partScores[part.id] || 0), 0);
        refreshGlobalScore();
      }

      function renderQuestion() {
        const question = currentQuestion();
        const answer = ensureAnswer(question);
        app.innerHTML = `
          <article class="card">
            <div class="question-header">
              <div>
                <h2>${state.currentIndex + 1}. ${escapeHtml(question.questionId)}</h2>
                <div class="question-meta">${escapeHtml(question.datasetLabel)} · ${escapeHtml(question.series)} · ${escapeHtml(question.questionType)}</div>
              </div>
              <div class="stats question-stats">
                <div><strong>${question.marks}</strong><span>Marks</span></div>
                <div><strong>${question.timeMinutes}</strong><span>Minutes</span></div>
                <div><strong id="questionTotalScore">${currentAwardedMarks()}/${ASSIGNMENT.totalMarks}</strong><span>Total marks</span></div>
              </div>
            </div>
            ${question.answerMode === "structured" ? structuredQuestionMarkup(question, answer) : `<div class="question-body">${question.questionHtml}</div>`}
          </article>
          <section class="answer-panel">
            ${question.answerMode === "multiple-choice" ? `<h3>Your answer</h3>${answerInput(question, answer)}<button id="submitQuestion" type="button" ${answer.submitted ? "hidden" : ""}>Submit</button>` : `<h3>Your progress</h3><p class="muted">Submit each part to reveal its mark scheme, then self assess that part.</p>`}
            ${assessmentMarkup(question, answer)}
            <div class="nav-row">
              <button class="secondary" id="previousQuestion" type="button" ${state.currentIndex === 0 ? "disabled" : ""}>Previous</button>
              <button id="nextQuestion" type="button" ${questionComplete(question, answer) ? "" : "disabled"}>${state.currentIndex === ASSIGNMENT.questions.length - 1 ? "Finish assignment" : "Next question"}</button>
            </div>
          </section>
        `;

        const submitButton = document.getElementById("submitQuestion");
        if (submitButton) {
          submitButton.addEventListener("click", () => {
            if (question.answerMode === "multiple-choice") {
              const checked = document.querySelector("input[name='studentAnswer']:checked");
              answer.studentAnswer = checked ? checked.value : "";
              updateQuestionAwardedMarks(question, answer);
            }
            answer.submitted = true;
            renderQuestion();
          });
        }

        document.querySelectorAll("[data-submit-part]").forEach((button) => {
          button.addEventListener("click", () => {
            const part = (question.parts || []).find((item) => item.id === button.dataset.submitPart);
            if (!part) return;
            collectPartAnswer(part, answer);
            answer.partSubmitted[part.id] = true;
            updateQuestionAwardedMarks(question, answer);
            renderQuestion();
          });
        });

        document.querySelectorAll("[data-assess-id]").forEach((checkbox) => {
          checkbox.addEventListener("change", () => {
            answer.checkedItems[checkbox.dataset.assessId] = checkbox.checked;
            updateScore(question, answer, checkbox.dataset.assessPart);
          });
        });

        document.querySelectorAll("[data-collapse-toggle]").forEach((button) => {
          button.addEventListener("click", () => {
            const body = button.nextElementSibling;
            if (!body) return;
            body.hidden = !body.hidden;
            button.dataset.collapsed = body.hidden ? "true" : "false";
            const label = button.dataset.label || "answer";
            button.textContent = label.charAt(0).toUpperCase() + label.slice(1);
          });
        });

        document.getElementById("previousQuestion").addEventListener("click", () => {
          if (state.currentIndex > 0) {
            state.currentIndex -= 1;
            renderQuestion();
          }
        });

        document.getElementById("nextQuestion").addEventListener("click", () => {
          if (!questionComplete(question, answer)) return;
          if (state.currentIndex === ASSIGNMENT.questions.length - 1) renderFinal();
          else {
            state.currentIndex += 1;
            renderQuestion();
          }
        });
      }

      function updateScore(question, answer, partId) {
        const part = (question.parts || []).find((item) => item.id === partId);
        if (!part) return;
        const score = part.selfAssessItems.reduce((sum, item) => {
          return sum + (answer.checkedItems[item.id] ? Number(item.value || 1) : 0);
        }, 0);
        answer.partScores[part.id] = Math.min(Number(part.marks || question.marks || 0), score);
        updateQuestionAwardedMarks(question, answer);
        const scoreElement = document.getElementById(`assessmentScore-${part.id}`);
        if (scoreElement) scoreElement.textContent = `Score: ${answer.partScores[part.id]} / ${part.marks || "?"}`;
      }

      function buildPayload() {
        const questions = ASSIGNMENT.questions.map((question) => {
          const answer = ensureAnswer(question);
          const parts = (question.parts || []).map((part) => ({
            id: part.id,
            label: part.label,
            marks: part.marks,
            studentAnswer: answer.partAnswers[part.id] || [],
            submitted: Boolean(answer.partSubmitted[part.id]),
            selfAssessItems: part.selfAssessItems.map((item) => ({
              id: item.id,
              label: item.label,
              value: item.value,
              checked: Boolean(answer.checkedItems[item.id])
            })),
            awardedMarks: Number(answer.partScores[part.id] || 0)
          }));
          return {
            questionId: question.questionId,
            marks: question.marks,
            timeMinutes: question.timeMinutes,
            answerMode: question.answerMode,
            studentAnswer: answer.studentAnswer,
            correctOption: question.correctOption || "",
            parts,
            awardedMarks: Number(answer.awardedMarks || 0)
          };
        });
        const awardedMarks = questions.reduce((sum, question) => sum + Number(question.awardedMarks || 0), 0);
        const submittedAt = new Date().toISOString();
        return {
          submissionId: `${ASSIGNMENT.assignmentId}-${state.studentName}-${Date.now().toString(36)}`,
          assignmentId: ASSIGNMENT.assignmentId,
          assignmentTitle: ASSIGNMENT.assignmentTitle,
          studentName: state.studentName,
          startedAt: state.startedAt,
          submittedAt,
          durationSeconds: Math.round((new Date(submittedAt).getTime() - new Date(state.startedAt).getTime()) / 1000),
          totalMarks: ASSIGNMENT.totalMarks,
          awardedMarks,
          questions
        };
      }

      function renderFinal() {
        const payload = buildPayload();
        app.innerHTML = `
          <section class="final-panel">
            <h2>Assignment complete</h2>
            <p>Your recorded score is <strong>${payload.awardedMarks} / ${payload.totalMarks}</strong>.</p>
            <button class="big-submit" id="submitToTeacher" type="button">Submit to teacher</button>
            <p class="status" id="submitStatus"></p>
          </section>
        `;
        document.getElementById("submitToTeacher").addEventListener("click", () => submitToTeacher(buildPayload()));
      }

      function submitToTeacher(payload) {
        const status = document.getElementById("submitStatus");
        if (!ASSIGNMENT.appsScriptUrl) {
          downloadJson(payload);
          status.textContent = "No Apps Script URL was configured. Submission JSON downloaded instead.";
          status.className = "status warning";
          return;
        }

        const form = document.createElement("form");
        form.method = "POST";
        form.action = ASSIGNMENT.appsScriptUrl;
        form.target = "submitFrame";
        form.hidden = true;

        const input = document.createElement("textarea");
        input.name = "payload";
        input.value = JSON.stringify(payload);
        form.append(input);
        document.body.append(form);

        const frame = document.getElementById("submitFrame");
        frame.addEventListener("load", () => {
          status.textContent = "Submitted. Your teacher will see the JSON file in Drive and the score row in Google Sheets.";
          status.className = "status success";
          form.remove();
        }, { once: true });

        status.textContent = "Submitting...";
        form.submit();
      }

      function downloadJson(payload) {
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `${ASSIGNMENT.assignmentId}-${state.studentName || "student"}-submission.json`;
        document.body.append(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      }

      renderStart();
    </script>
  </body>
</html>

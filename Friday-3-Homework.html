<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Friday 3 Homework</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f6f8;
        --panel: #ffffff;
        --panel-soft: #f8fafc;
        --text: #17202a;
        --muted: #617085;
        --line: #d8e0e8;
        --accent: #256f9d;
        --accent-dark: #184f74;
        --success: #147a4a;
        --warning: #9a5b00;
        --shadow: 0 12px 32px rgba(24, 42, 63, 0.12);
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
      }
      .shell {
        margin: 0 auto;
        max-width: 1040px;
        min-height: 100vh;
        padding: 24px;
      }
      .topbar, .card, .answer-panel, .final-panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }
      .topbar {
        align-items: center;
        display: flex;
        gap: 20px;
        justify-content: space-between;
        margin-bottom: 16px;
        padding: 18px 22px;
      }
      h1, h2, h3 { margin: 0; }
      h1 { font-size: 26px; line-height: 1.15; }
      h2 { font-size: 22px; line-height: 1.2; }
      h3 { color: var(--accent-dark); font-size: 15px; margin-bottom: 8px; }
      p { line-height: 1.55; }
      .stats {
        display: grid;
        gap: 8px;
        grid-template-columns: repeat(3, minmax(86px, 1fr));
      }
      .question-stats {
        grid-template-columns: repeat(3, minmax(86px, 1fr));
      }
      .stats div {
        background: var(--panel-soft);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 9px 11px;
        text-align: right;
      }
      .stats strong { display: block; font-size: 20px; }
      .stats span, .muted { color: var(--muted); font-size: 13px; }
      .card, .answer-panel, .final-panel { padding: 18px; }
      .start-card {
        display: grid;
        gap: 14px;
        margin-top: 24px;
      }
      label { display: grid; gap: 7px; }
      label span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
      }
      select, textarea, button {
        border-radius: 6px;
        font-family: inherit;
        font-size: 15px;
      }
      select, textarea {
        background: #fff;
        border: 1px solid var(--line);
        color: var(--text);
        width: 100%;
      }
      select { min-height: 42px; padding: 0 10px; }
      textarea {
        line-height: 1.5;
        min-height: 150px;
        padding: 12px;
        resize: vertical;
      }
      button {
        background: var(--accent);
        border: 1px solid var(--accent);
        color: #fff;
        cursor: pointer;
        font-weight: 700;
        min-height: 44px;
        padding: 0 16px;
      }
      button:hover { background: var(--accent-dark); }
      button.secondary {
        background: #fff;
        border-color: var(--line);
        color: var(--accent-dark);
      }
      .big-submit {
        display: block;
        font-size: 22px;
        min-height: 74px;
        width: 100%;
      }
      .question-header {
        align-items: start;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 16px;
        justify-content: space-between;
        margin-bottom: 16px;
        padding-bottom: 14px;
      }
      .question-meta {
        color: var(--muted);
        font-size: 13px;
        margin-top: 6px;
      }
      .question-body {
        font-size: 15px;
        line-height: 1.6;
        overflow-wrap: anywhere;
      }
      .answer-panel {
        display: grid;
        gap: 14px;
        margin-top: 16px;
      }
      .choice-list, .assess-list {
        display: grid;
        gap: 10px;
      }
      .choice-list.compact {
        display: flex;
        flex-wrap: wrap;
      }
      .choice, .assess-item {
        align-items: start;
        background: var(--panel-soft);
        border: 1px solid var(--line);
        border-radius: 8px;
        display: grid;
        gap: 10px;
        grid-template-columns: 22px 1fr;
        padding: 10px 12px;
      }
      .choice-letter {
        align-items: center;
        grid-template-columns: 22px auto;
        min-width: 74px;
      }
      .choice-letter span {
        font-size: 18px;
        font-weight: 700;
      }
      .part-card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        display: grid;
        gap: 12px;
        margin-top: 14px;
        padding: 14px;
      }
      .part-card + .part-card {
        margin-top: 18px;
      }
      .part-header {
        align-items: center;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 12px;
        justify-content: space-between;
        padding-bottom: 10px;
      }
      .part-header strong {
        color: var(--accent-dark);
      }
      .part-body {
        display: grid;
        gap: 12px;
      }
      .inline-answer,
      .short-answer {
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--text);
        font: inherit;
      }
      .inline-answer {
        display: block;
        line-height: 1.45;
        margin: 8px 0;
        min-height: 76px;
        padding: 10px;
        resize: vertical;
        width: 100%;
      }
      .short-answer {
        display: inline-block;
        min-height: 34px;
        min-width: 150px;
        padding: 4px 8px;
      }
      .tick-choice-input {
        display: block;
        height: 18px;
        margin: 0 auto;
        width: 18px;
      }
      .mark-scheme {
        background: #fffdf5;
        border: 1px solid #e9dca8;
        border-radius: 8px;
        padding: 14px;
      }
      .answer-collapse {
        background: #fffdf5;
        border: 1px solid #e9dca8;
        border-radius: 8px;
        overflow: hidden;
      }
      .answer-collapse-toggle {
        align-items: center;
        background: transparent;
        border: 0;
        border-radius: 0;
        color: var(--accent-dark);
        cursor: pointer;
        display: flex;
        font-weight: 700;
        min-height: 0;
        justify-content: space-between;
        padding: 12px 14px;
        text-align: left;
        width: 100%;
      }
      .answer-collapse-toggle:hover {
        background: #fff8df;
      }
      .answer-collapse-toggle::after {
        content: "Hide";
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
      }
      .answer-collapse-toggle[data-collapsed="true"]::after {
        content: "Show";
      }
      .answer-collapse-body {
        border-top: 1px solid #e9dca8;
        display: grid;
        gap: 14px;
        padding: 14px;
      }
      .answer-collapse-body .mark-scheme {
        border: 0;
        padding: 0;
      }
      .inline-mark-point {
        align-items: center;
        display: inline-flex;
        gap: 6px;
        margin-right: 6px;
        vertical-align: baseline;
      }
      .inline-mark-point input {
        height: 15px;
        margin: 0;
        width: 15px;
      }
      .inline-mark-point-fallback {
        display: grid;
        gap: 6px;
        margin-top: 12px;
        padding: 0;
      }
      .assessment-score {
        color: var(--success);
        font-weight: 700;
      }
      .nav-row {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
      }
      .rtf-image { height: auto; max-width: 100%; object-fit: contain; }
      .rtf-image-block { display: block; margin: 8px auto; }
      .rtf-image-inline { display: inline-block; margin: 0 4px; max-height: 1.6em; vertical-align: middle; }
      .rtf-table-wrap { margin: 10px 0; max-width: 100%; overflow-x: auto; }
      .rtf-table { border-collapse: collapse; font-size: 13px; line-height: 1.35; max-width: 100%; width: 100%; }
      .rtf-table th, .rtf-table td {
        border: 1px solid var(--line);
        color: var(--text);
        padding: 6px 8px;
        text-align: center;
        vertical-align: middle;
      }
      .status { color: var(--muted); margin: 0; }
      .status.success { color: var(--success); }
      .status.warning { color: var(--warning); }
      @media (max-width: 760px) {
        .shell { padding: 12px; }
        .topbar, .question-header { display: grid; }
        .stats { grid-template-columns: 1fr; }
        .nav-row { display: grid; }
      }
    </style>
  </head>

p and is reflected at \u003cstrong\u003eA\u003c/strong\u003e.\u003cbr\u003e\nThe reflected light from \u003cstrong\u003eA\u003c/strong\u003e combines at \u003cstrong\u003eO\u003c/strong\u003e with the reflected light from \u003cstrong\u003eO\u003c/strong\u003e.\u003cbr\u003e\nAt \u003cstrong\u003eO\u003c/strong\u003e, there is a phase difference between the reflected light from \u003cstrong\u003eA\u003c/strong\u003e and the reflected light from \u003cstrong\u003eO\u003c/strong\u003e.\u003cbr\u003e\nThis phase difference is caused by:\u003cbr\u003e\n•   the path difference due to the air gap\u003cbr\u003e\n•   the reflection at \u003cstrong\u003eA\u003c/strong\u003e.\u003cbr\u003e\nAt \u003cstrong\u003eA\u003c/strong\u003e the phase of the light that is reflected is changed by 180°.\u003cbr\u003e\nAt \u003cstrong\u003eO\u003c/strong\u003e there is no change to the phase of the light that is reflected or that is transmitted.\u003cbr\u003e\nThe thickness \u003cstrong\u003eOA\u003c/strong\u003e of the air gap is \u003cem\u003ed\u003c/em\u003e.\u003cbr\u003e\n(a)  Deduce the relationship between \u003cem\u003ed\u003c/em\u003e and the wavelength λ of light that produces a bright fringe.\u003cbr\u003e\n \u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n\u003cstrong\u003e(3)\u003cbr\u003e\nFigure 4\u003c/strong\u003e shows a small part of the fringe pattern as viewed from above.\u003cbr\u003e\n\u003cstrong\u003eFigure 4\u003cbr\u003e\n\u003cimg class=\"rtf-image rtf-image-block\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAYABgAAD/4RCoRXhpZgAATU0AKgAAAAgABwESAAMAAAABAAEAAAEaAAUAAAABAAAAYgEbAAUAAAABAAAAagEoAAMAAAABAAIAAAExAAIAAAAeAAAAcgEyAAIAAAAUAAAAkIdpAAQAAAABAAAApAAAAMQAYAAAAAEAAABgAAAAAQAAQWRvYmUgUGhvdG9zaG9wIENTNiAoV2luZG93cykAMjAyNDoxMDoxOSAxMjo1NjozNgA ong\u003e. The remainder of the light is transmitted through the air gap and is reflected at \u003cstrong\u003eA\u003c/strong\u003e.\u003cbr\u003e\nThe reflected light from \u003cstrong\u003eA\u003c/strong\u003e combines at \u003cstrong\u003eO\u003c/strong\u003e with the reflected light from \u003cstrong\u003eO\u003c/strong\u003e.\u003cbr\u003e\nAt \u003cstrong\u003eO\u003c/strong\u003e, there is a phase difference between the reflected light from \u003cstrong\u003eA\u003c/strong\u003e and the reflected light from \u003cstrong\u003eO\u003c/strong\u003e.\u003cbr\u003e\nThis phase difference is caused by:\u003cbr\u003e\n•   the path difference due to the air gap\u003cbr\u003e\n•   the reflection at \u003cstrong\u003eA\u003c/strong\u003e.\u003cbr\u003e\nAt \u003cstrong\u003eA\u003c/strong\u003e the phase of the light that is reflected is changed by 180°.\u003cbr\u003e\nAt \u003cstrong\u003eO\u003c/strong\u003e there is no change to the phase of the light that is reflected or that is transmitted.\u003cbr\u003e\nThe thickness \u003cstrong\u003eOA\u003c/strong\u003e of the air gap is \u003cem\u003ed\u003c/em\u003e.\u003cbr\u003e","parts":[{"id":"p-a","label":"(a)","marks":3,"questionHtml":"(a)  Deduce the relationship between \u003cem\u003ed\u003c/em\u003e and the wavelength λ of light that produces a bright fringe.\u003cbr\u003e\n \u003cbr\u003e\n\u003cspan class=\"answer-slot\" data-answer-index=\"0\" data-kind=\"long\" data-width=\"72\"\u003e\u003c/span\u003e\u003cstrong\u003e(3)\u003cbr\u003e\u003c/strong\u003e","markSchemeHtml":"(a)     Max 2 from: \u003csub\u003e1\u003c/sub\u003e✔\u003csub\u003e2\u003c/sub\u003e✔\u003cbr\u003e\nlinks constructive interference as cause of bright fringe \u003csub\u003ea\u003c/sub\u003e✔\u003cbr\u003e\ncorrect reference to zero phase difference or 'in phase' \u003csub\u003eb\u003c/sub\u003e✔\u003cbr\u003e\npath difference = 2\u003cem\u003ed\u003c/em\u003e \u003cstrong\u003eOR\u003c/strong\u003e (\u003cem\u003en\u003c/em\u003e + 0.5)λ s e to higher energy levels (than n = 2)\u003cbr\u003e\n• Photons have sufficient energy to promote electrons to high enough levels\u003cbr\u003e\n\u003cstrong\u003eArea C - De-excitation process:\u003cbr\u003e\n\u003c/strong\u003e• De-excitation or relaxation mentioned (as subsequent step)\u003cbr\u003e\n• Photons are emitted by atoms in coating\u003cbr\u003e\n• Atoms de-excite/lose energy\u003cbr\u003e\n• Atomic electrons move to lower energy levels\u003cbr\u003e\n• Electrons move to ground state via other energy levels\u003cbr\u003e\n• Emitted radiation consists of (a range of) lower photon energies/frequencies or longer wavelengths\u003cbr\u003e\n\u003cstrong\u003e6\u003cbr\u003e\n[11]\u003cbr\u003e\u003c/strong\u003e","answerMode":"structured","options":[],"correctOption":"","introHtml":"","parts":[{"id":"p-a","label":"(a)","marks":2,"questionHtml":"(a)  A light emitting diode (LED) emits blue light with a wavelength of 440 nm. The rate of photon emission is 3.0 × 10\u003csup\u003e16\u003c/sup\u003e s\u003csup\u003e−1\u003c/sup\u003e.\u003cbr\u003e\nShow that the power output of the LED is approximately 0.014 W.\u003cbr\u003e\n\u003cspan class=\"answer-slot\" data-answer-index=\"0\" data-kind=\"long\" data-width=\"72\"\u003e\u003c/span\u003e\u003cstrong\u003e(2)\u003cbr\u003e\n\u003c/strong\u003e","markSchemeHtml":"(a)     substitution into \u003cem\u003eE\u003c/em\u003e = \u003cem\u003ehc\u003c/em\u003e/\u003cem\u003eλ\u003c/em\u003e ✔\u003cbr\u003e\nmultiplies \u003cem\u003eE\u003c/em\u003e by 3.0 × 10\u003csup\u003e16\u003c/sup\u003e to give 0.0136 (W)✔\u003cbr\u003e\n\u003cem\u003eCondone POT error on MP1\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e2\u003cbr\u003e\n\u003c/strong\u003e","selfAssessItems":[{"id":"p-a-sa-1","part":"(a)","label":"substitution into E = hc/λ","value":1},{"id":"p-a-sa-2","part":"(a)","label":"multiplies E by 3.0 × 1016 to give 0.0136 (W)","value":1}]},{"id":"p-b","label":"(b)","marks":3,"ques redicted particle.\u003cbr\u003e\nInformation about these three particles is in the Data and Formulae Booklet.\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n\u003cstrong\u003e(4)\u003cbr\u003e\n(Total 9 marks)\u003cbr\u003e\u003c/strong\u003e","markSchemeHtml":"(a)     Award each mark independently\u003cbr\u003e\nLepton number not conserved therefore not possible ✔\u003cbr\u003e\nLepton numbers for particles correct ✔\u003cbr\u003e\n\u003cem\u003eAny incorrect quantum number equation (for Q, B or S) loses MP2.\u003cbr\u003e\n\u003c/em\u003eEg          0 = 1 −1 −1 (for lepton number)\u003cbr\u003e\nOR          0 = 0 −1 +0 (for muon lepton number)\u003cbr\u003e\n\u003cem\u003eAlternative for MP2\u003cbr\u003e\nreference to missing muon neutrino in order to balance/conserve (muon) lepton number.\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e2\u003cbr\u003e\n\u003c/strong\u003e(b)     up anti-up\u003cbr\u003e\nAND\u003cbr\u003e\ndown anti-down ✔\u003cbr\u003e\n\u003cem\u003eEither order\u003cbr\u003e\nCredit symbols\u003cbr\u003e\nBut do not condone any use of capital letter\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e1\u003cbr\u003e\n\u003c/strong\u003e(c)     Identification of quarks in either neutral kaon correct, ie kaon d s̅\u003cbr\u003e\nOR anti-kaon d̅ s ✔\u003cbr\u003e\nIdentification of quarks in other kaon correct, with statement that they are not the same. ✔\u003cbr\u003e\n\u003cem\u003eAlternative:\u003cbr\u003e\nKaon has strangeness +1 ✔\u003cbr\u003e\nAnti-kaon has strangeness –1 and is therefore not the same. ✔\u003cbr\u003e\n\u003cstrong\u003eAllow max 1 if\u003cbr\u003e\n\u003c/strong\u003e•     quark configurations wrong way round.\u003cbr\u003e\n•     value of strangeness is wrong way round\u003cbr\u003e\n•     statement that strangeness is different without reference to value.\u003cbr\u003e\n•     strangeness and quarks given but one of them is incorrect.\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e2\u003cbr\u003e\n\u003c/strong\u003e(d)     Award each mark independently\u003cbr\u003e\nLinks hadrons to strong nuclear force (snf)\u003cbr\u003e\nOR identifies snf as forcing holding nucleus together ✔\u003cbr\u003e\n\u003cem\u003eOR\u003cbr\u003e\n(only) pion and muon have correct rest energy with no mention of kaon.\u003cbr\u003e\n\u003c/em\u003eReason why it cannot be the kaon ✔\u003cbr\u003e\n\u003cem\u003eFor MP2: kaon rest energy is not between those of electron and half that of nucleon. (values quoted from data booklet)\u003cbr\u003e\n\u003c/em\u003eReason why it cannot be the muon ✔\u003cbr\u003e\n\u003cem\u003eFor MP3: muon is a lepton (and does not experience snf)\u003cbr\u003e\n\u003c/em\u003epion is the particle as it (has mass in range and) is a hadron (and therefore experiences snf) ✔\u003cbr\u003e\n\u003cem\u003eAn incorrect statement amount a particle negates the mark for that particle.\u003cbr\u003e\nRest energies/MeV:\u003cbr\u003e\nkaon    493.821 or 497.762\u003cbr\u003e\npion    139.576 or 134.972\u003cbr\u003e\nmuon    105.659\u003cbr\u003e\nnucleon 938.257 or 939.551\u003cbr\u003e\n\u003cs 3eAlternative:\u003cbr\u003e\nKaon has strangeness +1 ✔\u003cbr\u003e\nAnti-kaon has strangeness –1 and is therefore not the same. ✔\u003cbr\u003e\n\u003cstrong\u003eAllow max 1 if\u003cbr\u003e\n\u003c/strong\u003e•     quark configurations wrong way round.\u003cbr\u003e\n•     value of strangeness is wrong way round\u003cbr\u003e\n•     statement that strangeness is different without reference to value.\u003cbr\u003e\n•     strangeness and quarks given but one of them is incorrect.\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e2\u003cbr\u003e\n\u003c/strong\u003e","selfAssessItems":[{"id":"p-c-sa-1","part":"(c)","label":"OR anti-kaon d̅ s","value":1},{"id":"p-c-sa-2","part":"(c)","label":"Identification of quarks in other kaon correct, with statement that they are not the same.","value":1},{"id":"p-c-sa-3","part":"(c)","label":"Kaon has strangeness +1","value":1},{"id":"p-c-sa-4","part":"(c)","label":"Anti-kaon has strangeness –1 and is therefore not the same.","value":1},{"id":"p-c-sa-5","part":"(c)","label":"quark configurations wrong way round.","value":1},{"id":"p-c-sa-6","part":"(c)","label":"value of strangeness is wrong way round","value":1},{"id":"p-c-sa-7","part":"(c)","label":"statement that strangeness is different without reference to value.","value":1},{"id":"p-c-sa-8","part":"(c)","label":"strangeness and quarks given but one of them is incorrect.","value":1}]},{"id":"p-d","label":"(d)","marks":4,"questionHtml":"(d)     The nucleus is held together by a force. It was predicted that a particle exists that is responsible for this force. The particle itself must experience this force.\u003cbr\u003e\nThe particle would have a rest energy between that of an electron and half that of a nucleon.\u003cbr\u003e\nDiscuss whether a kaon, a muon and a pion \u003cstrong\u003eeach\u003c/strong\u003e have the properties of the predicted particle.\u003cbr\u003e\nInformation about these three particles is in the Data and Formulae Booklet.\u003cbr\u003e\n\u003cspan class=\"answer-slot\" data-answer-index=\"0\" data-kind=\"long\" data-width=\"72\"\u003e\u003c/span\u003e\u003cstrong\u003e(4)\u003cbr\u003e\u003c/strong\u003e","markSchemeHtml":"(d)     Award each mark independently\u003cbr\u003e\nLinks hadrons to strong nuclear force (snf)\u003cbr\u003e\nOR identifies snf as forcing holding nucleus together ✔\u003cbr\u003e\n\u003cem\u003eOR\u003cbr\u003e\n(only) pion and muon have correct rest energy with no mention of kaon.\u003cbr\u003e\n\u003c/em\u003eReason why it cannot be the kaon ✔\u003cbr\u003e\n\u003cem\u003eFor MP2: kaon rest energy is not between those of electron and half that of nucleon. (values quoted from data booklet)\u003cbr\u003e\n\u003c/em\u003eReason why it cannot be the muon ✔\u003cbr\u003e\n\u003cem\u003eFor MP3: muon is a lepton (and does not experience snf)\u003cbr\u003e\n\u003c/em\u003epion is the particle as it (has mass in range and) is a hadron (and therefore experiences snf) ✔\u003cbr\u003e\n\u003cem\u003eAn incorrect statement amount a particle negates the mark for that particle.\u003cbr\u003e\nRest energies/MeV:\u003cbr\u003e\nkaon    493.821 or 497.762\u003cbr\u003e\npion    139.576 or 134.972\u003cbr\u003e\nmuon    105.659\u003cbr\u003e\nnucleon 938.257 or 939.551\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e4\u003cbr\u003e\n[9]\u003cbr\u003e\u003c/strong\u003e","selfAssessItems":[{"id":"p-d-sa-1","part":"(d)","label":"OR identifies snf as forcing holding nucleus together","value":1},{"id":"p-d-sa-2","part":"(d)","label":"Reason why it cannot be the kaon","value":1},{"id":"p-d-sa-3","part":"(d)","label":"Reason why it cannot be the muon","value":1},{"id":"p-d-sa-4","part":"(d)","label":"pion is the particle as it (has mass in range and) is a hadron (and therefore experiences snf)","value":1}]}],"selfAssessItems":[{"id":"sa-1","part":"(a)","label":"Lepton number not conserved therefore not possible","value":1},{"id":"sa-2", e\n\u003cstrong\u003e(3)\u003cbr\u003e\n\u003c/strong\u003e(c)     The surface of a sample of caesium is exposed to photons emitted in each of the three transitions shown in the diagram.\u003cbr\u003e\nThe threshold frequency of caesium is 5.1 × 10\u003csup\u003e14\u003c/sup\u003e Hz\u003cbr\u003e\nDetermine whether any of these transitions would produce photons that would cause electrons to be emitted from the surface of caesium.\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n\u003cstrong\u003e(3)\u003cbr\u003e\n\u003c/strong\u003e(d)     Photons each with energy 12.1 eV are incident on the surface of the caesium sample.\u003cbr\u003e\nCalculate the maximum speed of electrons emitted from the caesium.\u003cbr\u003e\nmaximum speed = ____________________ m s\u003csup\u003e–1\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/sup\u003e\u003cstrong\u003e(3)\u003cbr\u003e\n(Total 10 marks)\u003cbr\u003e\u003c/strong\u003e","markSchemeHtml":"(a)     \u003cbr\u003e\n\n\u003cdiv class=\"rtf-table-wrap\"\u003e\u003ctable class=\"rtf-table\"\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eTransition\n\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003eUltraviolet\u003c/td\u003e\u003ctd\u003eVisible\u003c/td\u003e\u003ctd\u003eInfrared\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eA\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003ctd\u003e✔\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eB\n\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003ctd\u003e✔\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eC\n\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003e✔\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\n\u003cem\u003eall correct 1 mark\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e1\u003cbr\u003e\n\u003c/strong\u003e(b)     EITHER\u003cbr\u003e\nenergy needed for electron to move to higher level/orbital ✔\u003cbr\u003e\nOR\u003cbr\u003e\nfor a transition/excitation/change of levels an exact amount of energy is needed ✔\u003cbr\u003e\nall the photon’s energy absorbed( in 1 to 1 interaction) ✔\u003cbr\u003e\nelectron can transfer part of its energy (to cause a transition/excitation)/ continues moving/ lower kinetic energy/ lower speed ✔\u003cbr\u003e\n\u003cem\u003eAny implication of photoelectric effect max 1\u003cbr\u003e\nAccept one energy level to another\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e1\u003cbr\u003e\n1\u003cbr\u003e\n1\u003cbr\u003e\n\u003c/strong\u003e(c)     (use of \u003cem\u003eφ\u003c/em\u003e = \u003cem\u003ehf\u003c/em\u003e\u003csub\u003e0\u003c/sub\u003e)\u003cbr\u003e\n\u003cem\u003eφ\u003c/em\u003e = 6.63 × 10\u003csup\u003e–34\u003c/sup\u003e × 5.1 × 10\u003csup\u003e14\u003c/sup\u003e ✔ (= 3.38 × 10\u003csup\u003e–19\u003c/sup\u003e)\u003cbr\u003e\n\u003cem\u003eφ\u003c/em\u003e = 3.38 × 10\u003csup\u003e–19\u003c/sup\u003e/1.6 × 10\u003csup\u003e–19\u003c/sup\u003e = 2.1(1) (eV) ✔\u003cbr\u003e\nOR\u003cbr\u003e\n\u003cem\u003eφ\u003c/em\u003e = 6.63 × 10\u003csup\u003e–34\u003c/sup\u003e × 5.1 × 10\u003csup\u003e14\u003c/sup\u003e ✔(= 3.38 × 10\u003csup\u003e–19\u003c/sup\u003e )\u003cbr\u003e\nenergy in J 10.2 ×1.6 × 10\u003csup\u003e–19\u003c/sup\u003e = 1.63 × 10−18 ✔\u003cbr\u003e\nOR\u003cbr\u003e\nenergy levels in J = 10.2 ×1.6 × 10\u003csup\u003e–19\u003c/sup\u003e= 1.63 × 10\u003csup\u003e–18\u003c/sup\u003e ✔\u003cbr\u003e\nphotons frequencies giving this energy= 2.46 × 10\u003csup\u003e15\u003c/sup\u003e ✔\u003cbr\u003e\n\u003cem\u003eIf see 2.1 get these first two marks\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e1\u003cbr\u003e\n1\u003cbr\u003e\n\u003c/strong\u003e2 → 1 / C possible ✔\u003cbr\u003e\n\u003cem\u003eLast mark dependent on previous 2\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e1\u003cbr\u003e\n\u003c/strong\u003e(d)     (use of hf = \u003cem\u003eφ\u003c/em\u003e + \u003cem\u003eE\u003csub\u003ek\u003c/sub\u003e\u003c/em\u003e)\u003cbr\u003e\n12.1 × 1.6 × 10\u003csup\u003e–19\u003c/sup\u003e = 2.1 × 1.6 × 10\u003csup\u003e–19\u003c/sup\u003e + \u003cem\u003eE\u003csub\u003ek\u003c/sub\u003e\u003c/em\u003e ✔\u003cbr\u003e\n\u003cem\u003eE\u003csub\u003ek\u003c/sub\u003e\u003c/em\u003e = 1.6 × 10\u003csup\u003e–18\u003c/sup\u003e(J) ✔\u003cbr\u003e\nv = √(2 × 1.6 × 10\u003csup\u003e–18\u003c/sup\u003e/9.11 × 10\u003csup\u003e–31\u003c/sup\u003e) ✔(= 1.9 × 10\u003csup\u003e6\u003c/sup\u003e m s\u003csup\u003e–1\u003c/sup\u003e)\u003cbr\u003e\n\u003cem\u003ePhotoelectric equation must be used\u003cbr\u003e\nEcf for third mark their calculated kinetic energy having used photoelectric equation even if not converted eV to J or frequency to J\u003cbr\u003e\nCorrect answer gets (1.9 × 10\u003csup\u003e6\u003c/sup\u003e m s\u003csup\u003e–1\u003c/sup\u003e) full marks\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e1\u003cbr\u003e\n1\u003cbr\u003e\n1\u003cbr\u003e\n[10]\u003cbr\u003e\u003c/strong\u003e","answerMode":"structured","options":[],"correctOption":"","introHtml":"The diagram shows some of the energy levels for a hydrogen atom.\u003cbr\u003e\n\u003cimg class=\"rtf-image rtf-image-block\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAAAAAAAD/4QBiRXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAA5KGAAcAAAAWAAAARKACAAQAAAABAAABvaADAAQAAAABAAAA/gAAAABTAGMAcgBlAGUAbgBzAGgAbwB0AAAA/9sAQwABAQEBAQECAQECAwICAgMEAwMD 3e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eTransition\n\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003eUltraviolet\u003c/td\u003e\u003ctd\u003eVisible\u003c/td\u003e\u003ctd\u003eInfrared\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eA\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003ctd\u003e✔\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eB\n\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003ctd\u003e✔\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eC\n\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003e✔\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\n\u003cem\u003eall correct 1 mark\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e1\u003cbr\u003e\n\u003c/strong\u003e","selfAssessItems":[{"id":"p-a-sa-1","part":"(a)","label":"Transition","value":1}]},{"id":"p-b","label":"(b)","marks":3,"questionHtml":"(b)     Two ways to excite a hydrogen atom are by collision with a free electron or by the absorption of a photon.\u003cbr\u003e\nExplain why, for a particular transition, the photon must have an exact amount of energy whereas the free electron only needs a minimum amount of kinetic energy.\u003cbr\u003e\n\u003cspan class=\"answer-slot\" data-answer-index=\"0\" data-kind=\"long\" data-width=\"72\"\u003e\u003c/span\u003e\u003cstrong\u003e(3)\u003cbr\u003e\n\u003c/strong\u003e","markSchemeHtml":"(b)     EITHER\u003cbr\u003e\nenergy needed for electron to move to higher level/orbital ✔\u003cbr\u003e\nOR\u003cbr\u003e\nfor a transition/excitation/change of levels an exact amount of energy is needed ✔\u003cbr\u003e\nall the photon’s energy absorbed( in 1 to 1 interaction) ✔\u003cbr\u003e\nelectron can transfer part of its energy (to cause a transition/excitation)/ continues moving/ lower kinetic energy/ lower speed ✔\u003cbr\u003e\n\u003cem\u003eAny implication of photoelectric effect max 1\u003cbr\u003e\nAccept one energy level to another\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e1\u003cbr\u003e\n1\u003cbr\u003e\n1\u003cbr\u003e\n\u003c/strong\u003e","selfAssessItems":[{"id":"p-b-sa-1","part":"(b)","label":"energy needed for electron to move to higher level/orbital","value":1},{"id":"p-b-sa-2","part":"(b)","label":"for a transition/excitation/change of levels an exact amount of energy is needed","value":1},{"id":"p-b-sa-3","part":"(b)","label":"all the photon’s energy absorbed( in 1 to 1 interaction)","value":1},{"id":"p-b-sa-4","part":"(b)","label":"electron can transfer part of its energy (to cause a transition/excitation)/ continues moving/ lower kinetic energy/ lower speed","value":1}]},{"id":"p-c","label":"(c)","marks":3,"questionHtml":"(c)     The surface of a sample of caesium is exposed to photons emitted in each of the three transitions shown in the diagram.\u003cbr\u003e\nThe threshold frequency of caesium is 5.1 × 10\u003csup\u003e14\u003c/sup\u003e Hz\u003cbr\u003e\nDetermine whether any of these transitions would produce photons that would cause electrons to be emitted from the surface of caesium.\u003cbr\u003e\n\u003cspan class=\"answer-slot\" data-answer-index=\"0\" data-kind=\"long\" data-width=\"72\"\u003e\u003c/span\u003e\u003cstrong\u003e(3)\u003cbr\u003e\n\u003c/strong\u003e","markSchemeHtml":"(c)     (use of \u003cem\u003eφ\u003c/em\u003e = \u003cem\u003ehf\u003c/em\u003e\u003csub\u003e0\u003c/sub\u003e)\u003cbr\u003e\n\u003cem\u003eφ\u003c/em\u003e = 6.63 × 10\u003csup\u003e–34\u003c/sup\u003e × 5.1 × 10\u003csup\u003e14\u003c/sup\u003e ✔ (= 3.38 × 10\u003csup\u003e–19\u003c/sup\u003e)\u003cbr\u003e\n\u003cem\u003eφ\u003c/em\u003e = 3.38 × 10\u003csup\u003e–19\u003c/sup\u003e/1.6 × 10\u003csup\u003e–19\u003c/sup\u003e = 2.1(1) (eV) ✔\u003cbr\u003e\nOR\u003cbr\u003e\n\u003cem\u003eφ\u003c/em\u003e = 6.63 × 10\u003csup\u003e–34\u003c/sup\u003e × 5.1 × 10\u003csup\u003e14\u003c/sup\u003e ✔(= 3.38 × 10\u003csup\u003e–19\u003c/sup\u003e )\u003cbr\u003e\nenergy in J 10.2 ×1.6 × 10\u003csup\u003e–19\u003c/sup\u003e = 1.63 × 10−18 ✔\u003cbr\u003e\nOR\u003cbr\u003e\nenergy levels in J = 10.2 ×1.6 × 10\u003csup\u003e–19\u003c/sup\u003e= 1.63 × 10\u003csup\u003e–18\u003c/sup\u003e ✔\u003cbr\u003e\nphotons frequencies giving this energy= 2.46 × 10\u003csup\u003e15\u003c/sup\u003e ✔\u003cbr\u003e\n\u003cem\u003eIf see 2.1 get these first two marks\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e1\u003cbr\u003e\n1\u003cbr\u003e\n\u003c/strong\u003e2 → 1 / C possible ✔\u003cbr\u003e\n\u003cem\u003eLast mark dependent on previous 2\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e1\u003cbr\u003e\n\u003c/strong\u003e","selfAssessItems":[{"id":"p-c-sa-1","part":"(c)","label":"φ = 6.63 × 10–34 × 5.1 × 1014(= 3.38 × 10–19)","value":1},{"id":"p-c-sa-2","part":"(c)","label":"φ = 3.38 × 10–19/1.6 × 10–19 = 2.1(1) (eV)","value":1},{"id":"p-c-sa-3","part":"(c)","label":"φ = 6.63 × 10–34 × 5.1 × 1014(= 3.38 × 10–19 )","value":1},{"id":"p-c-sa-4","part":"(c)","label":"energy in J 10.2 ×1.6 × 10–19 = 1.63 × 10−18","value":1},{"id":"p-c-sa-5","part":"(c)","label":"energy levels in J = 10.2 ×1.6 × 10–19= 1.63 × 10–18","value":1},{"id":"p-c-sa-6","part":"(c)","label":"photons frequencies giving this energy= 2.46 × 1015","value":1},{"id":"p-c-sa-7","part":"(c)","label":"2 → 1 / C possible","value":1}]},{"id":"p-d","label":"(d)","marks":3,"questionHtml":"(d)     Photons each with energy 12.1 eV are incident on the surface of the caesium sample.\u003cbr\u003e\nCalculate the maximum speed of electrons emitted from the caesium.\u003cbr\u003e\nmaximum speed = \u003cspan class=\"answer-slot\" data-answer-index=\"0\" data-kind=\"long\" data-width=\"24\"\u003e\u003c/span\u003e m s\u003csup\u003e–1\u003cbr\u003e\ )","label":"electron can transfer part of its energy (to cause a transition/excitation)/ continues moving/ lower kinetic energy/ lower speed","value":1},{"id":"sa-6","part":"(c)","label":"φ = 6.63 × 10–34 × 5.1 × 1014(= 3.38 × 10–19)","value":1},{"id":"sa-7","part":"(c)","label":"φ = 3.38 × 10–19/1.6 × 10–19 = 2.1(1) (eV)","value":1},{"id":"sa-8","part":"(c)","label":"φ = 6.63 × 10–34 × 5.1 × 1014(= 3.38 × 10–19 )","value":1},{"id":"sa-9","part":"(c)","label":"energy in J 10.2 ×1.6 × 10–19 = 1.63 × 10−18","value":1},{"id":"sa-10","part":"(c)","label":"energy levels in J = 10.2 ×1.6 × 10–19= 1.63 × 10–18","value":1},{"id":"sa-11","part":"(c)","label":"photons frequencies giving this energy= 2.46 × 1015","value":1},{"id":"sa-12","part":"(c)","label":"2 → 1 / C possible","value":1},{"id":"sa-13","part":"(d)","label":"12.1 × 1.6 × 10–19 = 2.1 × 1.6 × 10–19 + Ek","value":1},{"id":"sa-14","part":"(d)","label":"Ek = 1.6 × 10–18(J)","value":1},{"id":"sa-15","part":"(d)","label":"v = √(2 × 1.6 × 10–18/9.11 × 10–31)(= 1.9 × 106 m s–1)","value":1}]}]};
      const state = {
        studentName: "",
        startedAt: "",
        currentIndex: 0,
        answers: {}
      };
      const app = document.getElementById("app");
      const studentLine = document.getElementById("studentLine");
      const globalScore = document.getElementById("globalScore");

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function currentQuestion() {
        return ASSIGNMENT.questions[state.currentIndex];
      }

      function currentAwardedMarks() {
        return ASSIGNMENT.questions.reduce((sum, question) => {
          return sum + Number(state.answers[question.questionId]?.awardedMarks || 0);
        }, 0);
      }

      function refreshGlobalScore() {
        if (globalScore) globalScore.textContent = `${currentAwardedMarks()}/${ASSIGNMENT.totalMarks}`;
        const questionTotalScore = document.getElementById("questionTotalScore");
        if (questionTotalScore) questionTotalScore.textContent = `${currentAwardedMarks()}/${ASSIGNMENT.totalMarks}`;
      }

      function ensureAnswer(question) {
        if (!state.answers[question.questionId]) {
          state.answers[question.questionId] = {
            studentAnswer: "",
            submitted: false,
            partAnswers: {},
            partSubmitted: {},
            partScores: {},
            checkedItems: {},
            awardedMarks: 0
          };
        }
        return state.answers[question.questionId];
      }

      function countAnswerSlots(part) {
        const indexes = [...String(part.questionHtml || "").matchAll(/data-answer-index="(\d+)"/g)].map((match) => Number(match[1]));
        return indexes.length ? Math.max(...indexes) + 1 : 1;
      }

      function ensurePartAnswer(answer, part) {
        if (!answer.partAnswers[part.id]) {
          answer.partAnswers[part.id] = Array.from({ length: countAnswerSlots(part) }, () => "");
        }
        return answer.partAnswers[part.id];
      }

      function questionComplete(question, answer) {
        if (question.answerMode === "multiple-choice") return answer.submitted;
        return (question.parts || []).every((part) => answer.partSubmitted[part.id]);
      }

      function hydratePartHtml(part, values, disabled) {
        const source = String(part.questionHtml || "");
        const disabledAttr = disabled ? "disabled" : "";
        if (!source.includes('class="answer-slot"')) {
          return `${source}<textarea class="inline-answer" data-answer-input-part="${escapeHtml(part.id)}" data-answer-input-index="0" ${disabledAttr}>${escapeHtml(values[0] || "")}</textarea>`;
        }
        return source.replace(
          /<span class="answer-slot" data-answer-index="(\d+)" data-kind="([^"]+)" data-width="([^"]+)"><\/span>/g,
          (_match, index, kind, width) => {
            const value = escapeHtml(values[Number(index)] || "");
            if (kind === "choice") {
              const checked = values[Number(index)] === String(width) ? "checked" : "";
              return `<input type="radio" class="tick-choice-input" name="answer-${escapeHtml(part.id)}-${index}" data-answer-input-part="${escapeHtml(part.id)}" data-answer-input-index="${index}" value="${escapeHtml(width)}" ${checked} ${disabledAttr}>`;
            }
            if (kind === "short") {
              return `<input class="short-answer" data-answer-input-part="${escapeHtml(part.id)}" data-answer-input-index="${index}" style="width:${Number(width) + 5}ch" value="${value}" ${disabledAttr}>`;
            }
            return `<textarea class="inline-answer" data-answer-input-part="${escapeHtml(part.id)}" data-answer-input-index="${index}" ${disabledAttr}>${value}</textarea>`;
          }
        );
      }

      function renderStart() {
        app.innerHTML = `
          <section class="card start-card">
            <h2>Start assignment</h2>
            <label>
              <span>Student name</span>
              <select id="studentName">
                <option value="">Choose your name</option>
                ${ASSIGNMENT.studentNames.map((name) => `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`).join("")}
              </select>
            </label>
            <button id="startButton" type="button">Start answering</button>
          </section>
        `;
        document.getElementById("startButton").addEventListener("click", () => {
          const name = document.getElementById("studentName").value;
          if (!name) return;
          state.studentName = name;
          state.startedAt = new Date().toISOString();
          studentLine.textContent = `${name} · started ${new Date(state.startedAt).toLocaleString()}`;
          renderQuestion();
        });
      }

      function answerInput(question, answer) {
        if (question.answerMode === "multiple-choice" && question.options.length) {
          return `
            <div class="choice-list compact">
              ${question.options.map((option) => `
                <label class="choice choice-letter">
                  <input type="radio" name="studentAnswer" value="${escapeHtml(option.label)}" ${answer.studentAnswer === option.label ? "checked" : ""} ${answer.submitted ? "disabled" : ""}>
                  <span>${escapeHtml(option.label)}</span>
                </label>
              `).join("")}
            </div>
          `;
        }
        return "";
      }

      function assessmentMarkup(question, answer) {
        if (!answer.submitted) return "";
        if (question.answerMode === "multiple-choice") {
          const isCorrect = answer.studentAnswer && answer.studentAnswer === question.correctOption;
          return `
            <section class="answer-collapse">
              <button class="answer-collapse-toggle" type="button" data-collapse-toggle data-label="answer">Answer</button>
              <div class="answer-collapse-body">
                <section class="mark-scheme">
                  <h3>Answer</h3>
                  <p class="assessment-score">${isCorrect ? "Correct" : "Not correct"}: ${escapeHtml(answer.studentAnswer || "No answer")} · Correct answer: ${escapeHtml(question.correctOption || "See mark scheme")} · Score: ${answer.awardedMarks} / ${question.marks}</p>
                  <div class="question-body">${question.markSchemeHtml}</div>
                </section>
              </div>
            </section>
          `;
        }
        return "";
      }

      function partAssessmentMarkup(part, answer) {
        if (!answer.partSubmitted[part.id]) return "";
        return `
          <section class="answer-collapse">
            <button class="answer-collapse-toggle" type="button" data-collapse-toggle data-label="answer ${escapeHtml(part.label)}">Answer ${escapeHtml(part.label)}</button>
            <div class="answer-collapse-body">
              <section class="mark-scheme">
                <h3>Mark scheme ${escapeHtml(part.label)}</h3>
                <p class="muted">Tick the boxes in the mark scheme. The score is capped at this part's marks.</p>
                <div class="question-body">${markSchemeWithInlineAssess(part, answer)}</div>
                <p class="assessment-score" id="assessmentScore-${escapeHtml(part.id)}">Score: ${answer.partScores[part.id] || 0} / ${part.marks || "?"}</p>
              </section>
            </div>
          </section>
        `;
      }

      function markSchemeWithInlineAssess(part, answer) {
        const items = part.selfAssessItems || [];
        let itemIndex = 0;
        const makeCheckbox = (item) => `
          <label class="inline-mark-point">
            <input type="checkbox" data-assess-part="${escapeHtml(part.id)}" data-assess-id="${escapeHtml(item.id)}" ${answer.checkedItems[item.id] ? "checked" : ""}>
          </label>`;
        const html = String(part.markSchemeHtml || "");
        const withTicks = html.replace(/(✓|✔|&#10003;|&#x2713;|&#10004;|&#x2714;)/g, (tick) => {
          const item = items[itemIndex] || {
            id: `${part.id}-inline-${itemIndex + 1}`,
            label: "Marking point",
            value: 1
          };
          itemIndex += 1;
          return tick + makeCheckbox(item);
        });
        if (itemIndex > 0) return withTicks;

        return `
          ${html}
          <div class="inline-mark-point-fallback">
            ${items.map((item) => `
              <label>
                <input type="checkbox" data-assess-part="${escapeHtml(part.id)}" data-assess-id="${escapeHtml(item.id)}" ${answer.checkedItems[item.id] ? "checked" : ""}>
                ${escapeHtml(item.label)} <em>(+${Number(item.value || 1)})</em>
              </label>
            `).join("")}
          </div>
        `;
      }

      function structuredQuestionMarkup(question, answer) {
        return `
          ${question.introHtml ? `<div class="question-body">${question.introHtml}</div>` : ""}
          ${(question.parts || []).map((part) => {
            const values = ensurePartAnswer(answer, part);
            const submitted = Boolean(answer.partSubmitted[part.id]);
            return `
              <section class="part-card">
                <div class="part-header">
                  <strong>${escapeHtml(part.label)}</strong>
                  <span class="muted">${part.marks || "?"} mark${Number(part.marks) === 1 ? "" : "s"}</span>
                </div>
                <div class="part-body">
                  <div class="question-body">${hydratePartHtml(part, values, submitted)}</div>
                  <button type="button" data-submit-part="${escapeHtml(part.id)}" ${submitted ? "hidden" : ""}>Submit ${escapeHtml(part.label)}</button>
                  ${partAssessmentMarkup(part, answer)}
                </div>
              </section>
            `;
          }).join("")}
        `;
      }

      function collectPartAnswer(part, answer) {
        const inputs = [...document.querySelectorAll(`[data-answer-input-part="${part.id}"]`)];
        const values = [];
        inputs
          .sort((a, b) => Number(a.dataset.answerInputIndex) - Number(b.dataset.answerInputIndex))
          .forEach((input) => {
            const index = Number(input.dataset.answerInputIndex);
            if (input.type === "radio") {
              if (input.checked) values[index] = input.value.trim();
              else if (values[index] === undefined) values[index] = "";
              return;
            }
            values[index] = input.value.trim();
          });
        answer.partAnswers[part.id] = values;
      }

      function updateQuestionAwardedMarks(question, answer) {
        if (question.answerMode === "multiple-choice") {
          answer.awardedMarks = answer.studentAnswer === question.correctOption ? Number(question.marks || 0) : 0;
          refreshGlobalScore();
          return;
        }
        answer.awardedMarks = (question.parts || []).reduce((sum, part) => sum + Number(answer.partScores[part.id] || 0), 0);
        refreshGlobalScore();
      }

      function renderQuestion() {
        const question = currentQuestion();
        const answer = ensureAnswer(question);
        app.innerHTML = `
          <article class="card">
            <div class="question-header">
              <div>
                <h2>${state.currentIndex + 1}. ${escapeHtml(question.questionId)}</h2>
                <div class="question-meta">${escapeHtml(question.datasetLabel)} · ${escapeHtml(question.series)} · ${escapeHtml(question.questionType)}</div>
              </div>
              <div class="stats question-stats">
                <div><strong>${question.marks}</strong><span>Marks</span></div>
                <div><strong>${question.timeMinutes}</strong><span>Minutes</span></div>
                <div><strong id="questionTotalScore">${currentAwardedMarks()}/${ASSIGNMENT.totalMarks}</strong><span>Total marks</span></div>
              </div>
            </div>
            ${question.answerMode === "structured" ? structuredQuestionMarkup(question, answer) : `<div class="question-body">${question.questionHtml}</div>`}
          </article>
          <section class="answer-panel">
            ${question.answerMode === "multiple-choice" ? `<h3>Your answer</h3>${answerInput(question, answer)}<button id="submitQuestion" type="button" ${answer.submitted ? "hidden" : ""}>Submit</button>` : `<h3>Your progress</h3><p class="muted">Submit each part to reveal its mark scheme, then self assess that part.</p>`}
            ${assessmentMarkup(question, answer)}
            <div class="nav-row">
              <button class="secondary" id="previousQuestion" type="button" ${state.currentIndex === 0 ? "disabled" : ""}>Previous</button>
              <button id="nextQuestion" type="button" ${questionComplete(question, answer) ? "" : "disabled"}>${state.currentIndex === ASSIGNMENT.questions.length - 1 ? "Finish assignment" : "Next question"}</button>
            </div>
          </section>
        `;

        const submitButton = document.getElementById("submitQuestion");
        if (submitButton) {
          submitButton.addEventListener("click", () => {
            if (question.answerMode === "multiple-choice") {
              const checked = document.querySelector("input[name='studentAnswer']:checked");
              answer.studentAnswer = checked ? checked.value : "";
              updateQuestionAwardedMarks(question, answer);
            }
            answer.submitted = true;
            renderQuestion();
          });
        }

        document.querySelectorAll("[data-submit-part]").forEach((button) => {
          button.addEventListener("click", () => {
            const part = (question.parts || []).find((item) => item.id === button.dataset.submitPart);
            if (!part) return;
            collectPartAnswer(part, answer);
            answer.partSubmitted[part.id] = true;
            updateQuestionAwardedMarks(question, answer);
            renderQuestion();
          });
        });

        document.querySelectorAll("[data-assess-id]").forEach((checkbox) => {
          checkbox.addEventListener("change", () => {
            answer.checkedItems[checkbox.dataset.assessId] = checkbox.checked;
            updateScore(question, answer, checkbox.dataset.assessPart);
          });
        });

        document.querySelectorAll("[data-collapse-toggle]").forEach((button) => {
          button.addEventListener("click", () => {
            const body = button.nextElementSibling;
            if (!body) return;
            body.hidden = !body.hidden;
            button.dataset.collapsed = body.hidden ? "true" : "false";
            const label = button.dataset.label || "answer";
            button.textContent = label.charAt(0).toUpperCase() + label.slice(1);
          });
        });

        document.getElementById("previousQuestion").addEventListener("click", () => {
          if (state.currentIndex > 0) {
            state.currentIndex -= 1;
            renderQuestion();
          }
        });

        document.getElementById("nextQuestion").addEventListener("click", () => {
          if (!questionComplete(question, answer)) return;
          if (state.currentIndex === ASSIGNMENT.questions.length - 1) renderFinal();
          else {
            state.currentIndex += 1;
            renderQuestion();
          }
        });
      }

      function updateScore(question, answer, partId) {
        const part = (question.parts || []).find((item) => item.id === partId);
        if (!part) return;
        const score = part.selfAssessItems.reduce((sum, item) => {
          return sum + (answer.checkedItems[item.id] ? Number(item.value || 1) : 0);
        }, 0);
        answer.partScores[part.id] = Math.min(Number(part.marks || question.marks || 0), score);
        updateQuestionAwardedMarks(question, answer);
        const scoreElement = document.getElementById(`assessmentScore-${part.id}`);
        if (scoreElement) scoreElement.textContent = `Score: ${answer.partScores[part.id]} / ${part.marks || "?"}`;
      }

      function buildPayload() {
        const questions = ASSIGNMENT.questions.map((question) => {
          const answer = ensureAnswer(question);
          const parts = (question.parts || []).map((part) => ({
            id: part.id,
            label: part.label,
            marks: part.marks,
            studentAnswer: answer.partAnswers[part.id] || [],
            submitted: Boolean(answer.partSubmitted[part.id]),
            selfAssessItems: part.selfAssessItems.map((item) => ({
              id: item.id,
              label: item.label,
              value: item.value,
              checked: Boolean(answer.checkedItems[item.id])
            })),
            awardedMarks: Number(answer.partScores[part.id] || 0)
          }));
          return {
            questionId: question.questionId,
            marks: question.marks,
            timeMinutes: question.timeMinutes,
            answerMode: question.answerMode,
            studentAnswer: answer.studentAnswer,
            correctOption: question.correctOption || "",
            parts,
            awardedMarks: Number(answer.awardedMarks || 0)
          };
        });
        const awardedMarks = questions.reduce((sum, question) => sum + Number(question.awardedMarks || 0), 0);
        const submittedAt = new Date().toISOString();
        return {
          submissionId: `${ASSIGNMENT.assignmentId}-${state.studentName}-${Date.now().toString(36)}`,
          assignmentId: ASSIGNMENT.assignmentId,
          assignmentTitle: ASSIGNMENT.assignmentTitle,
          studentName: state.studentName,
          startedAt: state.startedAt,
          submittedAt,
          durationSeconds: Math.round((new Date(submittedAt).getTime() - new Date(state.startedAt).getTime()) / 1000),
          totalMarks: ASSIGNMENT.totalMarks,
          awardedMarks,
          questions
        };
      }

      function renderFinal() {
        const payload = buildPayload();
        app.innerHTML = `
          <section class="final-panel">
            <h2>Assignment complete</h2>
            <p>Your recorded score is <strong>${payload.awardedMarks} / ${payload.totalMarks}</strong>.</p>
            <button class="big-submit" id="submitToTeacher" type="button">Submit to teacher</button>
            <p class="status" id="submitStatus"></p>
          </section>
        `;
        document.getElementById("submitToTeacher").addEventListener("click", () => submitToTeacher(buildPayload()));
      }

      function submitToTeacher(payload) {
        const status = document.getElementById("submitStatus");
        if (!ASSIGNMENT.appsScriptUrl) {
          downloadJson(payload);
          status.textContent = "No Apps Script URL was configured. Submission JSON downloaded instead.";
          status.className = "status warning";
          return;
        }

        const form = document.createElement("form");
        form.method = "POST";
        form.action = ASSIGNMENT.appsScriptUrl;
        form.target = "submitFrame";
        form.hidden = true;

        const input = document.createElement("textarea");
        input.name = "payload";
        input.value = JSON.stringify(payload);
        form.append(input);
        document.body.append(form);

        const frame = document.getElementById("submitFrame");
        frame.addEventListener("load", () => {
          status.textContent = "Submitted. Your teacher will see the JSON file in Drive and the score row in Google Sheets.";
          status.className = "status success";
          form.remove();
        }, { once: true });

        status.textContent = "Submitting...";
        form.submit();
      }

      function downloadJson(payload) {
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `${ASSIGNMENT.assignmentId}-${state.studentName || "student"}-submission.json`;
        document.body.append(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      }

      renderStart();
    </script>
  </body>
</html>

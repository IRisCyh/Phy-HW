<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Monday 3 Homework</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f6f8;
        --panel: #ffffff;
        --panel-soft: #f8fafc;
        --text: #17202a;
        --muted: #617085;
        --line: #d8e0e8;
        --accent: #256f9d;
        --accent-dark: #184f74;
        --success: #147a4a;
        --warning: #9a5b00;
        --shadow: 0 12px 32px rgba(24, 42, 63, 0.12);
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
      }
      .shell {
        margin: 0 auto;
        max-width: 1040px;
        min-height: 100vh;
        padding: 24px;
      }
      .topbar, .card, .answer-panel, .final-panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }
      .topbar {
        align-items: center;
        display: flex;
        gap: 20px;
        justify-content: space-between;
        margin-bottom: 16px;
        padding: 18px 22px;
      }
      h1, h2, h3 { margin: 0; }
      h1 { font-size: 26px; line-height: 1.15; }
      h2 { font-size: 22px; line-height: 1.2; }
      h3 { color: var(--accent-dark); font-size: 15px; margin-bottom: 8px; }
      p { line-height: 1.55; }
      .stats {
        display: grid;
        gap: 8px;
        grid-template-columns: repeat(3, minmax(86px, 1fr));
      }
      .question-stats {
        grid-template-columns: repeat(3, minmax(86px, 1fr));
      }
      .stats div {
        background: var(--panel-soft);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 9px 11px;
        text-align: right;
      }
      .stats strong { display: block; font-size: 20px; }
      .stats span, .muted { color: var(--muted); font-size: 13px; }
      .card, .answer-panel, .final-panel { padding: 18px; }
      .start-card {
        display: grid;
        gap: 14px;
        margin-top: 24px;
      }
      label { display: grid; gap: 7px; }
      label span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
      }
      select, textarea, button {
        border-radius: 6px;
        font-family: inherit;
        font-size: 15px;
      }
      select, textarea {
        background: #fff;
        border: 1px solid var(--line);
        color: var(--text);
        width: 100%;
      }
      select { min-height: 42px; padding: 0 10px; }
      textarea {
        line-height: 1.5;
        min-height: 150px;
        padding: 12px;
        resize: vertical;
      }
      button {
        background: var(--accent);
        border: 1px solid var(--accent);
        color: #fff;
        cursor: pointer;
        font-weight: 700;
        min-height: 44px;
        padding: 0 16px;
      }
      button:hover { background: var(--accent-dark); }
      button.secondary {
        background: #fff;
        border-color: var(--line);
        color: var(--accent-dark);
      }
      .big-submit {
        display: block;
        font-size: 22px;
        min-height: 74px;
        width: 100%;
      }
      .question-header {
        align-items: start;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 16px;
        justify-content: space-between;
        margin-bottom: 16px;
        padding-bottom: 14px;
      }
      .question-meta {
        color: var(--muted);
        font-size: 13px;
        margin-top: 6px;
      }
      .question-body {
        font-size: 15px;
        line-height: 1.6;
        overflow-wrap: anywhere;
      }
      .answer-panel {
        display: grid;
        gap: 14px;
        margin-top: 16px;
      }
      .choice-list, .assess-list {
        display: grid;
        gap: 10px;
      }
      .choice-list.compact {
        display: flex;
        flex-wrap: wrap;
      }
      .choice, .assess-item {
        align-items: start;
        background: var(--panel-soft);
        border: 1px solid var(--line);
        border-radius: 8px;
        display: grid;
        gap: 10px;
        grid-template-columns: 22px 1fr;
        padding: 10px 12px;
      }
      .choice-letter {
        align-items: center;
        grid-template-columns: 22px auto;
        min-width: 74px;
      }
      .choice-letter span {
        font-size: 18px;
        font-weight: 700;
      }
      .part-card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        display: grid;
        gap: 12px;
        margin-top: 14px;
        padding: 14px;
      }
      .part-card + .part-card {
        margin-top: 18px;
      }
      .part-header {
        align-items: center;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 12px;
        justify-content: space-between;
        padding-bottom: 10px;
      }
      .part-header strong {
        color: var(--accent-dark);
      }
      .part-body {
        display: grid;
        gap: 12px;
      }
      .inline-answer,
      .short-answer {
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--text);
        font: inherit;
      }
      .inline-answer {
        display: block;
        line-height: 1.45;
        margin: 8px 0;
        min-height: 76px;
        padding: 10px;
        resize: vertical;
        width: 100%;
      }
      .short-answer {
        display: inline-block;
        min-height: 34px;
        min-width: 150px;
        padding: 4px 8px;
      }
      .tick-choice-input {
        display: block;
        height: 18px;
        margin: 0 auto;
        width: 18px;
      }
      .mark-scheme {
        background: #fffdf5;
        border: 1px solid #e9dca8;
        border-radius: 8px;
        padding: 14px;
      }
      .answer-collapse {
        background: #fffdf5;
        border: 1px solid #e9dca8;
        border-radius: 8px;
        overflow: hidden;
      }
      .answer-collapse-toggle {
        align-items: center;
        background: transparent;
        border: 0;
        border-radius: 0;
        color: var(--accent-dark);
        cursor: pointer;
        display: flex;
        font-weight: 700;
        min-height: 0;
        justify-content: space-between;
        padding: 12px 14px;
        text-align: left;
        width: 100%;
      }
      .answer-collapse-toggle:hover {
        background: #fff8df;
      }
      .answer-collapse-toggle::after {
        content: "Hide";
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
      }
      .answer-collapse-toggle[data-collapsed="true"]::after {
        content: "Show";
      }
      .answer-collapse-body {
        border-top: 1px solid #e9dca8;
        display: grid;
        gap: 14px;
        padding: 14px;
      }
      .answer-collapse-body .mark-scheme {
        border: 0;
        padding: 0;
      }
      .inline-mark-point {
        align-items: center;
        display: inline-flex;
        gap: 6px;
        margin-right: 6px;
        vertical-align: baseline;
      }
      .inline-mark-point input {
        height: 15px;
        margin: 0;
        width: 15px;
      }
      .inline-mark-point-fallback {
        display: grid;
        gap: 6px;
        margin-top: 12px;
        padding: 0;
      }
      .assessment-score {
        color: var(--success);
        font-weight: 700;
      }
      .nav-row {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
      }
      .rtf-image { height: auto; max-width: 100%; object-fit: contain; }
      .rtf-image-block { display: block; margin: 8px auto; }
      .rtf-image-inline { display: inline-block; margin: 0 4px; max-height: 1.6em; vertical-align: middle; }
      .rtf-table-wrap { margin: 10px 0; max-width: 100%; overflow-x: auto; }
      .rtf-table { border-collapse: collapse; font-size: 13px; line-height: 1.35; max-width: 100%; width: 100%; }
      .rtf-table th, .rtf-table td {
        border: 1px solid var(--line);
        color: var(--text);
        padding: 6px 8px;
        text-align: center;
        vertical-align: middle;
      }
      .status { color: var(--muted); margin: 0; }
      .status.success { color: var(--success); }
      .status.warning { color: var(--warning); }
      @media (max-width: 760px) {
        .shell { padding: 12px; }
        .topbar, .question-header { display: grid; }
        .stats { grid-template-columns: 1fr; }
        .nav-row { display: grid; }
      }
    </style>
  </head>

03e shows his measurements and his estimated uncertainties.\u003cbr\u003e\n \u003cbr\u003e\n\n\u003cdiv class=\"rtf-table-wrap\"\u003e\u003ctable class=\"rtf-table\"\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eTable 1\n\u003c/strong\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMeasurement\u003c/td\u003e\u003ctd\u003eDistance / mm\u003c/td\u003e\u003ctd\u003eUncertainty / mm\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cem\u003ea\n\u003c/em\u003e\u003c/td\u003e\u003ctd\u003e289\u003c/td\u003e\u003ctd\u003e2\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cem\u003eb\n\u003c/em\u003e\u003c/td\u003e\u003ctd\u003e255\u003c/td\u003e\u003ctd\u003e2\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cem\u003ec\n\u003c/em\u003e\u003c/td\u003e\u003ctd\u003e544\u003c/td\u003e\u003ctd\u003e2\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\n(a)  Explain why the student’s estimated uncertainty in measurement a is greater than the smallest division on the metre ruler.\u003cbr\u003e\nYou should refer to the readings taken by the student in obtaining this measurement.\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n\u003cstrong\u003e(2)\u003cbr\u003e\n\u003c/strong\u003e(b)  The distance between the centres of spots \u003cstrong\u003eA\u003c/stro 003cbr\u003e\ndon’t look directly into the laser (beam)✔\u003cbr\u003e\nOr\u003cbr\u003e\ndirect laser towards nearest wall ✔\u003cbr\u003e\nOr\u003cbr\u003e\nswitch off laser when not in use ✔\u003cbr\u003e\nOr\u003cbr\u003e\nensure (glass) reflective surfaces are covered (prevent reflections) ✔\u003cbr\u003e\nOr\u003cbr\u003e\nDo not shine the laser onto a reflective surface ✔\u003cbr\u003e\nOr\u003cbr\u003e\nplace safety notices outside the laboratory [room] ✔\u003cbr\u003e\nOr\u003cbr\u003e\ndon’t shine laser at eye level ✔\u003cbr\u003e\nOr\u003cbr\u003e\nmark positions with pen/pencil and measure after laser switched off ✔\u003cbr\u003e\nOr\u003cbr\u003e\nlaboratory is normally illuminated (not darkened) ✔\u003cbr\u003e\n\u003cem\u003eWhere a list of safety measures has been given:\u003cbr\u003e\n•   Treat more than one correct as neutral\u003cbr\u003e\n•   Penalise incorrect safety measure in a list that may include correct safety measures.\u003cbr\u003e\nDo not credit weak statements:\u003cbr\u003e\n•   Do not look at the laser\u003cbr\u003e\n•   Don’t point the laser anywhere except at the grating\u003cbr\u003e\n•   Don’t look directly at the laser\u003cbr\u003e\nBeware of references to “the light”.\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e1\u003cbr\u003e\n\u003c/strong\u003e(e)  \u003cimg class=\"rtf-image rtf-image-block\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAAAAAAAD/4QBCRXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAAqACAAQAAAABAAAArKADAAQAAAABAAAAIQAAAAAAAP/iDRhJQ0NfUFJPRklMRQABAQAADQhhcHBsAhAAAG1udHJSR0IgWFlaIAfjAAsAHQAJABsAF2Fjc3BBUFBMAAAAAEFQUEwAAAAAAAAAAAAAAAAAAAAAAAD21gABAAAAANMtYXBwbAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAEWRlc2MAAAFQAAAAYmRzY20AAAG0AAAB8GNwcnQAAAOkAAAAI3d0cHQAAAPIAAAAFHJYWVoAAAPcAAAAFGdYWVoAAAPwAAAAFGJYWVoAAAQEAAAAFHJUUkMAAAQYAAAIDGFhcmcAAAwkAAAAIHZjZ3QAAAxEAAAAMG5kaW4AAAx0AAAAPmNoYWQAAAy0AAAALG1tb2QAAAzgAAAAKGJUUkMAAAQYAAAIDGdUUkMAAAQYAAAIDGFhYmcAAAwkAAA 3cbr\u003e\nCorrect rearrangement where subject would be λ\u003cbr\u003e\nor correct substitution of n, d and θ\u003cbr\u003e\nExpect to see n = 2 , d = 3.3(3) × 10\u003csup\u003e–6\u003c/sup\u003e , θ = 23(.0)\u003cbr\u003e\nCondone \u003cstrong\u003eone\u003c/strong\u003e error in substitution for n or d in a correctly rearranged equation where subject would be λ\u003cbr\u003e\n(or where answer indicates the correct working for incorrect numbers, d error leads to 5.86 × 10\u003csup\u003e4\u003c/sup\u003e)\u003cbr\u003e\nCondone power of ten errors in working\u003cbr\u003e\nλ\u003c/em\u003e = 6.5(2) × 10\u003csup\u003e–7\u003c/sup\u003e (m) \u003csub\u003e2\u003c/sub\u003e✔ ecf\u003cbr\u003e\n\u003cem\u003e2 or 3 sf only\u003cbr\u003e\nwhere 3 sf quoted answer must be in range 651 to 652 nm (or ecf )\u003cbr\u003e\nCommon ecf (sin θ error in 1.5):\u003cbr\u003e\nExpect to see an answer that rounds to 7.1 × 10\u003csup\u003e–7\u003c/sup\u003em to 2 sf\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e2\u003cbr\u003e\n\u003c/strong\u003e(g)  The second mark (\u003csub\u003e2\u003c/sub\u003e✔) is contingent on the award of the first mark (\u003csub\u003e1\u003c/sub\u003e✔).\u003cbr\u003e\nIncrease distance from grating to screen / increase y \u003csub\u003e1\u003c/sub\u003e✔\u003cbr\u003e\n(This will increase distance y (and/or c) therefore) decreasing the percentage uncertainty in y / c / fringe spacing / \u003cem\u003eθ\u003c/em\u003e / sin \u003cem\u003eθ\u003c/em\u003e \u003csub\u003e2\u003c/sub\u003e✔\u003cbr\u003e\n\u003cem\u003eDo not accept:\u003cbr\u003e\n•   darkened room\u003cbr\u003e\n•   use a (vernier) caliper\u003cbr\u003e\n•   use a travelling microscope\u003cbr\u003e\n•   Repeat\u003cbr\u003e\n•   Repeat and average\u003cbr\u003e\n•   Computer / data logger / camera\u003cbr\u003e\n•   Ruler with smaller divisions\u003cbr\u003e\n•   Make the maxima further apart (details on how this is achieved are required)\u003cbr\u003e\n•   Increase distance between laser and screen.\u003cbr\u003e\nDecreases the percentage uncertainty in y \u003csub\u003e2\u003c/sub\u003e✔\u003cbr\u003e\n\u003c/em\u003eOr\u003cbr\u003e\nUse a higher-order spot \u003csub\u003e1\u003c/sub\u003e✔\u003cbr\u003e\n(This will increase distance from centre spot to higher-order spot therefore) decreasing the percentage uncertainty in the fringe spacing/\u003cem\u003eθ\u003c/em\u003e /sin \u003cem\u003eθ\u003c/em\u003e \u003csub\u003e2\u003c/sub\u003e✔\u003cbr\u003e\n\u003cem\u003eCondone reference to this distance as c\u003cbr\u003e\n\u003c/em\u003eOr\u003cbr\u003e\nMeasure distance between A and E \u003csub\u003e1\u003c/sub\u003e✔\u003cbr\u003e\n(This increases the distance therefore) decreasing the percentage uncertainty in c \u003csub\u003e2\u003c/sub\u003e✔\u003cbr\u003e\n\u003cem\u003eNo details of determination of c are required.\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e2\u003cbr\u003e\n[12]\u003cbr\u003e\u003c/strong\u003e","answerMode":"structured","options":[],"correctOption":"","introHtml":"This question is about the measurement of the wavelength of laser light.\u003cbr\u003e\nThe light is shone onto a diffraction grating at normal incidence.\u003cbr\u003e\nThe light transmitted by the diffraction grating produces five spots on a screen. These spots are labelled \u003cstrong\u003eA\u003c/strong\u003e to \u003cstrong\u003eE\u003c/strong\u003e in \u003cstrong\u003eFigure 1\u003c/strong\u003e.\u003cbr\u003e\n\u003cstrong\u003eFigure 1\u003cbr\u003e\n\u003cimg class=\"rtf-image rtf-image-block\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAAAAAAAD/4QBCRXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAAqACAAQAAAABAAABTKADAAQAAAABAAAA0QAAAAAAAP/iAiBJQ0NfUFJPRklMRQABAQAAAhBhcHBsBAAAAG1udHJSR0IgWFlaIAfjAAsAEgAOAAcAEmFjc3BBUFBMAAAAAEFQUEwAAAAAAAAAAAAAAAAAAAAAAAD21gABAAAAANMtYXBwbHLMecmiYB6M42CD+g3kWEIAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACmRlc2MAAAD8AAAAY2NwcnQAAAFgAAAAI3d 03e.\u003cbr\u003e\n\u003cstrong\u003eTable 1\u003c/strong\u003e shows his measurements and his estimated uncertainties.\u003cbr\u003e\n \u003cbr\u003e\n\n\u003cdiv class=\"rtf-table-wrap\"\u003e\u003ctable class=\"rtf-table\"\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eTable 1\n\u003c/strong\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMeasurement\u003c/td\u003e\u003ctd\u003eDistance / mm\u003c/td\u003e\u003ctd\u003eUncertainty / mm\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cem\u003ea\n\u003c/em\u003e\u003c/td\u003e\u003ctd\u003e289\u003c/td\u003e\u003ctd\u003e2\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cem\u003eb\n\u003c/em\u003e\u003c/td\u003e\u003ctd\u003e255\u003c/td\u003e\u003ctd\u003e2\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cem\u003ec\n\u003c/em\u003e\u003c/td\u003e\u003ctd\u003e544\u003c/td\u003e\u003ctd\u003e2\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e","parts":[{"id":"p-a","label":"(a)","marks":2,"questionHtml":"(a)  Explain why the student’s estimated uncertainty in measurement a is greater than the smallest division on the metre ruler.\u003cbr\u003e\nYou should refer to the readings taken by the student in obtaining this measurement.\u003cbr\u003e\n\u003cspan class=\"answer-slot\" data-answer-index=\"0\" data-kind=\"long\" data-width=\"72\"\u003e\u003c/span\u003e\u003cstrong\u003e(2)\u003cbr\u003e\n\u003c/strong\u003e","markSchemeHtml":"(a)  MAX 2\u003cbr\u003e\nUncertainty in one/each reading is 1 mm \u003csub\u003e1\u003c/sub\u003e✔\u003cbr\u003e\n\u003cem\u003eAllow the uncertainty in (reading) the position of a spot is 1 mm. \u003csub\u003e1\u003c/sub\u003e✔\u003cbr\u003e\n\u003c/em\u003eOR\u003cbr\u003e\nThe measurement involves making two readings / there are two uncertainties (to be considered) in this measurement \u003csub\u003e1\u003c/sub\u003e✔\u003cbr\u003e\n\u003cem\u003eOwtte\u003cbr\u003e\n\u003c/em\u003eDifficulty / uncertainty in locating (exact) position of (centre of) spot \u003csub\u003e2\u003c/sub\u003e✔\u003cbr\u003e\nOr\u003cbr\u003e\nDifficulty / uncertainty in lining up the (centre of the) spot with a graduation on the ruler \u003csub\u003e2\u003c/sub\u003e✔\u003cbr\u003e\nOr\u003cbr\u003e\nDifficulty / uncertainty in locating the position of A / B \u003csub\u003e2\u003c/sub\u003e✔\u003cbr\u003e\n\u003cem\u003eDo not allow:\u003cbr\u003e\n•   because the smallest division is 1 mm\u003cbr\u003e\n•   hard to see measurements to less than 1 mm (need to link to position of spot (or A or B)\u003cbr\u003e\n•   “because of both sides of the ruler” on its own\u003cbr\u003e\n•   “ruler slightly misaligned” too vague\u003cbr\u003e\n\u003c/em\u003ethe uncertainties from two (readings) are added \u003csub\u003e3\u003c/sub\u003e✔\u003cbr\u003e\n\u003cem\u003einsufficient includes:\u003cbr\u003e\n•   uncertainty doubles\u003cbr\u003e\n•   uncertainty is twice the smallest division\u003cbr\u003e\n•   Random error or human error or error without further detail.\u003cbr\u003e\nHowever:\u003cbr\u003e\nThe uncertainty doubles because there are two readings scores MP1\u003cbr\u003e\nAlso:\u003cbr\u003e\nThe uncertainty doubles because there are two readings with identical uncertainties would score 2 marks.\u003cbr\u003e\nMention of range of repeated measurements ÷ 2 is not applicable in this case.\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e2\u003cbr\u003e\n\u003c/strong\u003e","selfAssessItems":[{"id":"p-a-sa-1","part":"(a)","label":"Uncertainty in one/each reading is 1 mm 1","value":1},{"id":"p-a-sa-2","part":"(a)","label":"The measurement involves making two readings / there are two uncertainties (to be considered) in this measurement 1","value":1},{"id":"p-a-sa-3","part":"(a)","label":"Difficulty / uncertainty in locating (exact) position of (centre of) spot 2","value":1},{"id":"p-a-sa-4","part":"(a)","label":"Difficulty / un ay from the laser (eg when taking readings) ✔\u003cbr\u003e\nOr\u003cbr\u003e\nif in front of laser (when switched on) don’t look at/towards the laser (eg when taking readings) ✔\u003cbr\u003e\nOr\u003cbr\u003e\ndon’t look directly into the laser (beam)✔\u003cbr\u003e\nOr\u003cbr\u003e\ndirect laser towards nearest wall ✔\u003cbr\u003e\nOr\u003cbr\u003e\nswitch off laser when not in use ✔\u003cbr\u003e\nOr\u003cbr\u003e\nensure (glass) reflective surfaces are covered (prevent reflections) ✔\u003cbr\u003e\nOr\u003cbr\u003e\nDo not shine the laser onto a reflective surface ✔\u003cbr\u003e\nOr\u003cbr\u003e\nplace safety notices outside the laboratory [room] ✔\u003cbr\u003e\nOr\u003cbr\u003e\ndon’t shine laser at eye level ✔\u003cbr\u003e\nOr\u003cbr\u003e\nmark positions with pen/pencil and measure after laser switched off ✔\u003cbr\u003e\nOr\u003cbr\u003e\nlaboratory is normally illuminated (not darkened) ✔\u003cbr\u003e\n\u003cem\u003eWhere a list of safety measures has been given:\u003cbr\u003e\n•   Treat more than one correct as neutral\u003cbr\u003e\n•   Penalise incorrect safety measure in a list that may include correct safety measures.\u003cbr\u003e\nDo not credit weak statements:\u003cbr\u003e\n•   Do not look at the laser\u003cbr\u003e\n•   Don’t point the laser anywhere except at the grating\u003cbr\u003e\n•   Don’t look directly at the laser\u003cbr\u003e\nBeware of references to “the light”.\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e1\u003cbr\u003e\n\u003c/strong\u003e","selfAssessItems":[{"id":"p-d-sa-1","part":"(d)","label":"(when laser is switched on) always stand behind the laser (unless taking readings)","value":1},{"id":"p-d-sa-2","part":"(d)","label":"if in front of laser (when switched on) look away from the laser (eg when taking readings)","value":1},{"id":"p-d-sa-3","part":"(d)","label":"if in front of laser (when switched on) don’t look at/towards the laser (eg when taking readings)","value":1},{"id":" \u003e–6\u003c/sup\u003e , θ = 23(.0)\u003cbr\u003e\nCondone \u003cstrong\u003eone\u003c/strong\u003e error in substitution for n or d in a correctly rearranged equation where subject would be λ\u003cbr\u003e\n(or where answer indicates the correct working for incorrect numbers, d error leads to 5.86 × 10\u003csup\u003e4\u003c/sup\u003e)\u003cbr\u003e\nCondone power of ten errors in working\u003cbr\u003e\nλ\u003c/em\u003e = 6.5(2) × 10\u003csup\u003e–7\u003c/sup\u003e (m) \u003csub\u003e2\u003c/sub\u003e✔ ecf\u003cbr\u003e\n\u003cem\u003e2 or 3 sf only\u003cbr\u003e\nwhere 3 sf quoted answer must be in range 651 to 652 nm (or ecf )\u003cbr\u003e\nCommon ecf (sin θ error in 1.5):\u003cbr\u003e\nExpect to see an answer that rounds to 7.1 × 10\u003csup\u003e–7\u003c/sup\u003em to 2 sf\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e2\u003cbr\u003e\n\u003c/strong\u003e","selfAssessItems":[{"id":"p-f-sa-1","part":"(f)","label":"(if nothing else seen) d = 3.3 × 10–6m 1","value":1},{"id":"p-f-sa-2","part":"(f)","label":"λ = 6.5(2) × 10–7 (m) 2ecf","value":1}]},{"id":"p-g","label":"(g)","marks":2,"questionHtml":"(g)  The student plans to repeat the experiment using the same diffraction grating and laser.\u003cbr\u003e\nState and explain \u003cstrong\u003eone\u003c/strong\u003e way the student can change the experimental arrangement to reduce the percentage uncertainty in the measurement of the wavelength.\u003cbr\u003e\nAssume the percentage uncertainty in sin \u003cem\u003eθ\u003c/em\u003e is the sum of the percentage uncertainties in \u003cem\u003ey\u003c/em\u003e and \u003cem\u003ec\u003c/em\u003e.\u003cbr\u003e\n\u003cspan class=\"answer-slot\" data-answer-index=\"0\" data-kind=\"long\" data-width=\"72\"\u003e\u003c/span\u003e\u003cstrong\u003e(2)\u003cbr\u003e\u003c/strong\u003e","markSchemeHtml":"(g)  The second mark (\u003csub\u003e2\u003c/sub\u003e✔) is contingent on the award of the first mark (\u003csub\u003e1\u003c/sub\u003e✔) es to point \u003cstrong\u003eB\u003c/strong\u003e, at right angles to the line \u003cstrong\u003eOA\u003c/strong\u003e, still facing the two loudspeakers.\u003cbr\u003e\nAs his head moves from \u003cstrong\u003eA\u003c/strong\u003e to \u003cstrong\u003eB\u003c/strong\u003e the amplitude of the sound wave he hears decreases and then increases. The amplitude starts to decrease again as he moves beyond \u003cstrong\u003eB\u003c/strong\u003e.\u003cbr\u003e\nExplain why the variation in amplitude occurs as he moves from \u003cstrong\u003eA\u003c/strong\u003e to \u003cstrong\u003eB\u003c/strong\u003e.\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n\u003cstrong\u003e(3)\u003cbr\u003e\n\u003c/strong\u003e(c)     The student records the following data:\u003cbr\u003e\n \u003cbr\u003e\n\n\u003cdiv class=\"rtf-table-wrap\"\u003e\u003ctable class=\"rtf-table\"\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eseparation of the two loudspeakers\u003c/td\u003e\u003ctd\u003e= 0.30 m\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003edistance \u003cstrong\u003eOA\n\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003e= 2.25 m\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003edistance from \u003cstrong\u003eA\u003c/strong\u003e to \u003cstrong\u003eB\n\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003e= 0.95 m\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\nShow that the path difference for the sound waves from the two loudspeakers to point \u003cstrong\u003eB\u003c/strong\u003e is about 0.1 m.\u003cbr\u003e\n \u003cbr\u003e\n\u003cstrong\u003e(3)\u003cbr\u003e\n\u003c/strong\u003e(d)     The frequency of the sound wave is 2960 Hz.\u003cbr\u003e\nCalculate the speed of sound from the student’s data.\u003cbr\u003e\n \u003cbr\u003e\nspeed of sound = _______________ m s\u003csup\u003e−1\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/sup\u003e\u003cstrong\u003e(1)\u003cbr\u003e\n\u003c/strong\u003e(e)     The student moves his head to point \u003cstrong\u003eC\u003c/strong\u003e as shown in \u003cstrong\u003eFigure 2\u003c/strong\u003e. The emitted frequency of the sound from the loudspeakers is then gradually decreased.\u003cbr\u003e\n\u003cstrong\u003eFigure 2\u003cbr\u003e\n\u003cimg class=\"rtf-image rtf-image-block\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEBLAEsAAD/4QmaRXhpZgAATU0AKgAAAAgABwESAAMAAAABAAEAAAEaAAUAAAABAAAAYgEbAAUAAAABAAAAagEoAAMAAAABAAIAAAExAAIAAAAiAAAAcgEyAAIAAAAUAAAAlIdpAAQAAAABAAAAqAAAAMgBLAAAAAEAAAEsAAAAAQAAQWRvYmUgUGhvdG9zaG9wIENDIDIwMTUgKFdpbmRvd3MpADIwMjI6MDE6MDQgMjI6MTA6NTEAAAKgAgAEAAAAAQAAAiugAwAEAAAAAQAAARIAAAAAAAAABgEDAAMAAAABAAYAAAEaAAUAAAABAAABFgEbAAUAAAABAAABHgEoAAMAAAABAAIAAAIBAAQAAAABAAABJgICAAQAAAABAAAIbAAAAAAAAABIAAAAAQAAAEgAAAAB/9j/7QAMQWRvYmVfQ00AAf/uAA5BZG9iZQBkgAAAAAH/2wCEAAwICAgJCAwJCQwRCwoLERUPDAwPFRgTExUTExgRDAwMDAwMEQwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwBDQsLDQ4NEA4OEBQODg4UFA4ODg4UEQwMDAwMEREMDAwMDAwRDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDP/AABEIAE8AoAMBIgACEQEDEQH/3QAEAAr/xAE/AAABBQEBAQEBAQAAAAAAAAADAAECBAUGBwgJCgsBAAEFAQEBAQEBAAAAAAAAAAEAAgMEBQYHCAkKCxAAAQQBAwIEAgUHBggFAwwzAQACEQMEIRIxBUFRYRMicYEyBhSRobFCIyQVUsFiMzRygtFDByWSU/Dh8WNzNRaisoMmRJNUZEXCo3Q2F9JV4mX _________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n\u003cstrong\u003e(3)\u003cbr\u003e\n(Total 12 marks)\u003cbr\u003e\u003c/strong\u003e","markSchemeHtml":"(a)     Understanding that for coherence sources must have same frequency/wavelength AND constant phase difference. ✔\u003cbr\u003e\nAnd that this achieved by both speakers being connected to same signal (generator). ✔\u003cbr\u003e\n\u003cstrong\u003e2\u003cbr\u003e\n\u003c/strong\u003e(b)     The sound waves from the two speakers superpose (at a point) ✔\u003cbr\u003e\n\u003cem\u003eDo \u003cstrong\u003enot\u003c/strong\u003e accept ‘interfere’ or ‘superimpose’ for ‘superpose’\u003cbr\u003e\nAccept for MP1 waves adding together/combine at a point (e.g. point A) for ‘superpose’.\u003cbr\u003e\nDo not accept diagram.\u003cbr\u003e\n\u003c/em\u003eAt A (and B) the two waves are in phase/ have zero phase difference (and a maximum is produced) ✔\u003cbr\u003e\nMoving away from A introduces a path difference/phase difference/waves are out of phase (and amplitude decreases) ✔\u003cbr\u003e\n(Moving on towards B the waves move back in phase)\u003cbr\u003e\n\u003cem\u003eAward MP3 for formation of minimum/destructive interference due to (odd number of) half wavelength path difference/π/ 180\u003csup\u003eo\u003c/sup\u003e phase difference/ antiphase.\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e3\u003cbr\u003e\n\u003c/strong\u003e(c)     Clear evidence of use of Pythagoras ✔\u003cbr\u003e\nCorrect calculation of either length PB or QB ✔\u003cbr\u003e\nPB = (2.25\u003csup\u003e2\u003c/sup\u003e + (0.95 – 0.3/2)\u003csup\u003e2\u003c/sup\u003e) \u003csup\u003e½\u003c/sup\u003e = 2.39 m\u003cbr\u003e\nQB = (2.25\u003csup\u003e2\u003c/sup\u003e + (0.95 + 0.3/2)\u003csup\u003e2\u003c/sup\u003e) \u003csup\u003e½\u003c/sup\u003e = 2.50 m\u003cbr\u003e\n(Path difference =) QB – PB either numerically or algebraically ✔\u003cbr\u003e\n(= 0.11 (0.12) m)\u003cbr\u003e\n\u003cem\u003eIf ws/D used to give 0.13 (m) reward with 1 mark\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e3\u003cbr\u003e\n\u003c/strong\u003e(d)     (Path difference = one wavelength)\u003cbr\u003e\nUse of speed = frequency × wavelength to give\u003cbr\u003e\nSpeed = 2960 × 0.12 = 360 m s\u003csup\u003e–1\u003c/sup\u003e ✔\u003cbr\u003e\n\u003cem\u003eWorking or equation must be seen.\u003cbr\u003e\nCondone use of 0.10 m or 0.11 m or 0.127m or 0.13 m\u003cbr\u003e\n0.10 gives 300 (296) m s\u003csup\u003e–1\u003cbr\u003e\n\u003c/sup\u003e0.11 gives 330 (325.6) m s\u003csup\u003e–1\u003cbr\u003e\n\u003c/sup\u003e0.127 gives 376 m s\u003csup\u003e–1\u003cbr\u003e\n\u003c/sup\u003e0.13 gives 380 (385) m s\u003csup\u003e–1\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/sup\u003e\u003c/em\u003e\u003cstrong\u003e1\u003cbr\u003e\n\u003c/strong\u003e(e)     Wavelength (gradually) increases. ✔\u003cbr\u003e\nSo that path difference at C gets closer to one wavelength ✔\u003cbr\u003e\n\u003cem\u003eAlternative for MP2:\u003cbr\u003e\nSeparation of maxima (along line AB) increases ✔\u003cbr\u003e\n\u003c/em\u003e(Amplitude of) sound will get larger/louder as waves move in phase (then smaller/quieter). ✔\u003cbr\u003e\n\u003cem\u003eAlternatives for MP3:\u003cbr\u003e\nMaximum moves (from B) towards C so amplitude of sound gets larger/louder (then quieter).\u003cbr\u003e\nOR\u003cbr\u003e\nMaximum moves further along path/beyond C so amplitude of sound gets quieter ✔\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e3\u003cbr\u003e\n[12]\u003cbr\u003e\u003c/strong\u003e","answerMode":"structured","options":[],"correctOption":"","introHtml":"A student investigates the interference of sound waves using two loudspeakers, \u003cstrong\u003eP\u003c/strong\u003e and \u003cstrong\u003eQ\u003c/strong\u003e, connected to a signal generator (oscillator). Each loudspeaker acts as a point source of sound.\u003cbr\u003e\n\u003cstrong\u003eFigure 1\u003c/strong\u003e shows the arrangement.\u003cbr\u003e\n\u003cstrong\u003eFigure 1\u003cbr\u003e\n\u003cimg class=\"rtf-image rtf-image-block\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEBLAEsAAD/4QjaRXhpZgAATU0AKgAAAAgABwESAAMAAAABAAEAAAEaAAUAAAABAAAAYgEbAAUAAAABAAAAagEoAAMAAAABAAIAAAExAAIAAAAiAAAAcgEyAAIAAAAUAAAAlIdpAAQAAAABAAAAqAAAAMgBLAAAAAEAAAEsAAAAAQAAQWRvYmUgUGhvdG9zaG9wIENDIDIwMTUgKFdpbmRvd3MpADIwMjI6MDE6MDQgMjI6MTA6MjkAAAKgAgAEAAAAAQAAAi6gAwAEAAAAAQAAAQAAAAAAAAAABgEDAAMAAAABAAYAAAEaAAUAAAABAAABFgEbAAUAAAABAAABHgEoAAMAAAABAAIAAAIBAAQAAAABAAABJgICAAQAAAABAAAHqwAAAAAAAABIAAAAAQAAAEgAAAAB/9j/7QAMQWRvYmVfQ00AAf/uAA5BZG9iZQBkgAAAAAH/2wCEAAwICAgJCAwJCQwRCwoLERUPDAwPFRgTExUTExgRDAwMDAwMEQwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwBDQsLDQ4NEA4OEBQODg4UFA4ODg4UEQwMDAwMEREMDAwMDAwRDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDP/AABEIAEkAoAMBIgACEQEDEQH/3QAEAAr/xAE/AAABBQEBAQEBAQAAAAAAAAADAAECBAUGBwgJCgsBAAEFAQEBAQEBAAAAAAAAAAEAAgMEBQYHCAkKCxAAAQQBAwIEAgUHBggFAwwzAQACEQMEIRIxBUFRYRMicYEyBhSRobFCIyQVUsFiMzRygtFDByWSU/Dh8WNzNRaisoMmRJNUZEXCo3Q2F9JV4mXys4TD03Xj80YnlKSFtJXE1OT0pbXF1eX1VmZ2hpamtsbW5vY3R1dnd4eXp7fH1+f3EQACAgECBAQDBAUGBwcGBTUBAAIRAyExEgRBUWFxIhMFMoGRFKGxQiPBUtHwMyRi4XKCkkNTFWNzNPElBhaisoMHJjXC0kSTVKMXZEVVNnRl4vKzhMPTdePzRpSkhbSVxNTk9KW1xdXl9VZmdoaWprbG1ub2JzdHV2d3h5ent8f/2gAMAwEAAhEDEQA/APUqqqqamU0sbXVW0MrrYA1rW 003c/strong\u003e to \u003cstrong\u003eB\u003c/strong\u003e the amplitude of the sound wave he hears decreases and then increases. The amplitude starts to decrease again as he moves beyond \u003cstrong\u003eB\u003c/strong\u003e.\u003cbr\u003e\nExplain why the variation in amplitude occurs as he moves from \u003cstrong\u003eA\u003c/strong\u003e to \u003cstrong\u003eB\u003c/strong\u003e.\u003cbr\u003e\n\u003cspan class=\"answer-slot\" data-answer-index=\"0\" data-kind=\"long\" data-width=\"72\"\u003e\u003c/span\u003e\u003cstrong\u003e(3)\u003cbr\u003e\n\u003c/strong\u003e","markSchemeHtml":"(b)     The sound waves from the two speakers superpose (at a point) ✔\u003cbr\u003e\n\u003cem\u003eDo \u003cstrong\u003enot\u003c/strong\u003e accept ‘interfere’ or ‘superimpose’ for ‘superpose’\u003cbr\u003e\nAccept for MP1 waves adding together/combine at a point (e.g. point A) for ‘superpose’.\u003cbr\u003e\nDo not accept diagram.\u003cbr\u003e\n\u003c/em\u003eAt A (and B) the two waves are in phase/ have zero phase difference (and a maximum is produced) ✔\u003cbr\u003e\nMoving away from A introduces a path difference/phase difference/waves are out of phase (and amplitude decreases) ✔\u003cbr\u003e\n(Moving on towards B the waves move back in phase)\u003cbr\u003e\n\u003cem\u003eAward MP3 for formation of minimum/destructive interference due to (odd number of) half wavelength path difference/π/ 180\u003csup\u003eo\u003c/sup\u003e phase difference/ antiphase.\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e3\u003cbr\u003e\n\u003c/strong\u003e","selfAssessItems":[{"id":"p-b-sa-1","part":"(b)","label":"The sound waves from the two speakers superpose (at a point)","value":1},{"id":"p-b-sa-2","part":"(b)","label":"At A (and B) the two waves are in phase/ have zero phase difference (and a maximum is produced)","value":1},{"id":"p-b-sa-3","part":"(b)","label":"Moving away from A introduces a path difference/phase difference/waves are out of phase (and amplitude decreases)","value":1}]},{"id":"p-c","label":"(c)","marks":3,"questionHtml":"(c)     The student records the following data:\u003cbr\u003e\n \u003cbr\u003e\n\n\u003cdiv class=\"rtf-table-wrap\"\u003e\u003ctable class=\"rtf-table\"\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eseparation of the two loudspeakers\u003c/td\u003e\u003ctd\u003e= 0.30 m\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003edistance \u003cstrong\u003eOA\n\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003e= 2.25 m\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003edistance from \u003cstrong\u003eA\u003c/strong\u003e to \u003cstrong\u003eB\n\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003e= 0.95 m\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\nShow that the path difference for the sound waves from the two loudspeakers to point \u003cstrong\u003eB\u003c/strong\u003e is about 0.1 m.\u003cbr\u003e\n \u003cbr\u003e\n\u003cspan class=\"answer-slot\" data-answer-index=\"0\" data-kind=\"long\" data-width=\"72\"\u003e\u003c/span\u003e\u003cstrong\u003e(3)\u003cbr\u003e\n\u003c/strong\u003e","markSchemeHtml":"(c)     Clear evidence of use of Pythagoras ✔\u003cbr\u003e\nCorrect calculation of either length PB or QB ✔\u003cbr\u003e\nPB = (2.25\u003csup\u003e2\u003c/sup\u003e + (0.95 – 0.3/2)\u003csup\u003e2\u003c/sup\u003e) \u003csup\u003e½\u003c/sup\u003e = 2.39 m\u003cbr\u003e\nQB = (2.25\u003csup\u003e2\u003c/sup\u003e + (0.95 + 0.3/2)\u003csup\u003e2\u003c/sup\u003e) \u003csup\u003e½\u003c/sup\u003e = 2.50 m\u003cbr\u003e\n(Path difference =) QB – PB either numerically or algebraically ✔\u003cbr\u003e\n(= 0.11 (0.12) m)\u003cbr\u003e\n\u003cem\u003eIf ws/D used to give 0.13 (m) reward with 1 mark\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e3\u003cbr\u003e\n\u003c/strong\u003e","selfAssessItems":[{"id":"p-c-sa-1","part":"(c)","label":"Clear evidence of use of Pythagoras","value":1},{"id":"p-c-sa-2","part":"(c)","label":"Correct calculation of either length PB or QB","value":1},{"id":"p-c-sa-3","part":"(c)","label":"(Path difference =) QB – PB either numerically or algebraically","value":1}]},{"id":"p-d","label":"(d)","marks":1,"questionHtml":"(d)     The frequency of the sound wave is 2960 Hz.\u003cbr\u003e\nCalculate the speed of sound from the student’s data.\u003cbr\u003e\n \u003cbr\u003e\nspeed of sound = \u003cspan class=\"answer-slot\" data-answer-index=\"0\" data-kind=\"long\" data-width=\"24\"\u003e\u003c/span\u003e m s\u003csup\u003e−1\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/sup\u003e\u003cstrong\u003e(1)\u003cbr\u003e\n\u003c/strong\u003e","markSchemeHtml":"(d)     (Path difference = one wavelength)\u003cbr\u003e\nUse of speed = frequency × wavelength to give\u003cbr\u003e\nSpeed = 2960 × 0.12 = 360 m s\u003csup\u003e–1\u003c/sup\u003e ✔\u003cbr\u003e\n\u003cem\u003eWorking or equation must be seen.\u003cbr\u003e\nCondone use of 0.10 m or 0.11 m or 0.127m or 0.13 m\u003cbr\u003e\n0.10 gives 300 (296) m s\u003csup\u003e–1\u003cbr\u003e\n\u003c/sup\u003e0.11 gives 330 (325.6) m s\u003csup\u003e–1\u003cbr\u003e\n\u003c/sup\u003e0.127 gives 376 m s\u003csup\u003e–1\u003cbr\u003e\n\u003c/sup\u003e0.13 gives 380 (385) m s\u003csup\u003e–1\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/sup\u003e\u003c/em\u003e\u003cstrong\u003e1\u003cbr\u003e\n\u003c/strong\u003e","selfAssessItems":[{"id":"p-d-sa-1","part":"(d)","label":"Speed = 2960 × 0.12 = 360 m s–1","value":1}]},{"id":"p-e","label":"(e)","marks":3,"questionHtml":"(e)     The student moves his head to point \u003cstrong\u003eC\u003c/strong\u003e as shown in \u003cstrong\u003eFigure 2\u003c/strong\u003e. The emitted frequency of the sound from the loudspeakers is then gradually decreased.\u003cbr\u003e\n\u003cstrong\u003eFigure 2\u003cbr\u003e\n\u003cimg class=\"rtf-image rtf-image-block\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEBLAEsAAD/4QmaRXhpZgAATU0AKgAAAAgABwESAAM BRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQB/9X+/iiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigD/2Q==\" style=\"width:400px;height:auto\" alt=\"\"\u003e\u003cbr\u003e\n\u003c/strong\u003eExplain how the pattern produced on the screen supports the idea that the electron beam is behaving as a wave rather than as a stream of particles.\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n\u003cstrong\u003e(3)\u003cbr\u003e\n\u003c/strong\u003e(d)     Explain how the emission of light from the fluorescent screen shows that the electrons incident on it are behaving as particles.\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n_________________________________ g\u003e1\u003cbr\u003e\n\u003c/strong\u003e(c)     Particle behaviour would only produce a patch/circle of light /small spot of light or Particles would scatter randomly ✔\u003cbr\u003e\nWave property shown by diffraction/ interference ✔\u003cbr\u003e\nGraphite causes (electron)waves/beam to spread out /electrons to travel in particular directions ✔\u003cbr\u003e\nBright rings/maximum intensity occurs where waves\u003cbr\u003e\ninterfere constructively/ are in phase ✔\u003cbr\u003e\nfor a diffraction grating maxima when sinθ = \u003cem\u003enλ/d\u003c/em\u003e ✔\u003cbr\u003e\n\u003cem\u003eMarks are essentially for\u003cbr\u003e\n1. Explaining appearance of screen if particle\u003cbr\u003e\n2. Identifying explicitly a wave property\u003cbr\u003e\n3. Explaining what happens when diffraction occurs\u003cbr\u003e\n4. Explaining cause of bright rings\u003cbr\u003e\n5. Similar to diffraction grating formula (although not same)\u003cbr\u003e\nNB Not expected: For graphite target maxima occur when sinθ =λ/2d (d =spacing of atomic layers in crystal)\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e1\u003cbr\u003e\n1\u003cbr\u003e\n1\u003cbr\u003e\n\u003c/strong\u003e(d)     Electrons must provide enough (kinetic) energy\u003cbr\u003e\n‘instantly’ to cause the excitation\u003cbr\u003e\n\u003cstrong\u003eOR\u003cbr\u003e\n\u003c/strong\u003ethe atom or energy transfer in 1 to 1 interaction\u003cbr\u003e\n\u003cstrong\u003eOR\u003cbr\u003e\n\u003c/strong\u003eelectron can provide the energy in discrete amounts\u003cbr\u003e\n\u003cstrong\u003eOR\u003cbr\u003e\n\u003c/strong\u003eenergy cannot be provided over time as it would be in a wave\u003cbr\u003e\n\u003cem\u003eDescription of Photoelectric effect = 0\u003cbr\u003e\nNot allowed: any idea that wave cannot pass on energy, e.g. waves pass through the screen\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e1\u003cbr\u003e\nAny 2 from\u003cbr\u003e\n\u003 ergy transfer in 1 to 1 interaction\u003cbr\u003e\n\u003cstrong\u003eOR\u003cbr\u003e\n\u003c/strong\u003eelectron can provide the energy in discrete amounts\u003cbr\u003e\n\u003cstrong\u003eOR\u003cbr\u003e\n\u003c/strong\u003eenergy cannot be provided over time as it would be in a wave\u003cbr\u003e\n\u003cem\u003eDescription of Photoelectric effect = 0\u003cbr\u003e\nNot allowed: any idea that wave cannot pass on energy, e.g. waves pass through the screen\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e1\u003cbr\u003e\nAny 2 from\u003cbr\u003e\n\u003c/strong\u003eIdea of light emission due to excitation and de-excitation of electrons/atoms ✔\u003cbr\u003e\nIdea of collisions by incident electrons moving electrons in atoms between energy levels/shells/orbits ✔\u003cbr\u003e\nLight/photon emitted when atoms de-excite or electrons move to lower energy levels ✔\u003cbr\u003e\n\u003cstrong\u003e1\u003cbr\u003e\n1\u003cbr\u003e\n[10]\u003cbr\u003e\u003c/strong\u003e","selfAssessItems":[{"id":"p-d-sa-1","part":"(d)","label":"Idea of light emission due to excitation and de-excitation of electrons/atoms","value":1},{"id":"p-d-sa-2","part":"(d)","label":"Idea of collisions by incident electrons moving electrons in atoms between energy levels/shells/orbits","value":1},{"id":"p-d-sa-3","part":"(d)","label":"Light/photon emitted when atoms de-excite or electrons move to lower energy levels","value":1}]}],"selfAssessItems":[{"id":"sa-1","part":"(a)","label":"(7.35; 7.25; 7.35)","value":1},{"id":"sa-2","part":"(a)","label":"three correct values plus conclusion","value":1},{"id":"sa-3","part":"(a)","label":"ratio approach v1/v2= λ2/λ1 shown for 2 sets of data","value":1},{"id":"sa-4","part":"(a)","label":"shown for two other sets of data + conclusion","value":1},{"id":"sa-5","part":"(b)","label":"h =λmv or substitution of correct data in any form","value":1},{"id":"sa-6","part":"(b)","label":"6.7(0) × 10–34 from first and third data set; 6.6( eed limit is 31 m s\u003csup\u003e−1\u003c/sup\u003e.\u003cbr\u003e\n \u003cbr\u003e\n\u003cem\u003ed\u003c/em\u003e = _______________ m\u003cbr\u003e\n\u003cstrong\u003e(2)\u003cbr\u003e\n\u003c/strong\u003e(c)     The chevron separation is based on the response time, not on the time taken for a car to stop.\u003cbr\u003e\nThe brakes of a car are applied when its speed is 31 m s\u003csup\u003e−1\u003c/sup\u003e and the car comes to rest. The total mass of the car is 1200 kg.\u003cbr\u003e\nThe average braking force acting on the car is 6.8 kN.\u003cbr\u003e\nCalculate the time taken for the braking force to stop the car \u003cstrong\u003eand\u003c/strong\u003e the distance travelled by the car in this time.\u003cbr\u003e\n \u003cbr\u003e\ntime = _______________ s\u003cbr\u003e\ndistance = _______________ m\u003cbr\u003e\n\u003cstrong\u003e(4)\u003cbr\u003e\n\u003c/strong\u003e(d)     Suggest why the chevron separation on motorways does not take into account the distance travelled as a car comes to rest after the brakes are applied.\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n\u003cstrong\u003e(1)\u003cbr\u003e\n\u003c/strong\u003e(e)     At bends on motorways the road is sloped so that a car is less likely to slide out of its lane when travelling at a high speed.\u003cbr\u003e\n\u003cstrong\u003eFigure 3\u003c/strong\u003e shows a car of mass 1200 kg travelling around a curve of radius 200 m. The motorway is sloped at an angle of 5.0°.\u003cbr\u003e\n\u003cstrong\u003eFigure 4\u003c/strong\u003e shows the weight \u003cem\u003eW\u003c/em\u003e and reaction force \u003cem\u003eN\u003c/em\u003e acting on the car. The advisory speed for the bend is chosen so that the fric a.\u003cbr\u003e\nAllow ce for either incorrect s or t.\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e4\u003cbr\u003e\n\u003c/strong\u003e(d)     (It is assumed that) the car in front would take the same time/travel the same distance as the car behind when braking/ only difference is reaction time of the driver of car behind. ✔\u003cbr\u003e\nOr\u003cbr\u003e\nCar in front cannot stop instantaneously (so car behind will have time/distance to bring car to rest).or words to that effect\u003cbr\u003e\n\u003cem\u003eAlternative:\u003cbr\u003e\nsuggestion that total stopping distance is too large (drivers would ignore it/inefficient use of motorway)\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e1\u003cbr\u003e\n\u003c/strong\u003e(e)     Correct use of cos (5) ✔\u003cbr\u003e\nE.g.\u003cbr\u003e\n\u003cem\u003emg\u003c/em\u003e = \u003cem\u003eN\u003c/em\u003e cos (5)\u003cbr\u003e\nCorrect use of sin (5) ✔\u003cbr\u003e\nE.g.\u003cbr\u003e\n\u003cem\u003eN\u003c/em\u003e sin (5) (= \u003cem\u003emv\u003c/em\u003e\u003csup\u003e2\u003c/sup\u003e/\u003cem\u003er)\u003cbr\u003e\n\u003c/em\u003eSo\u003cbr\u003e\n\u003cem\u003emv\u003c/em\u003e\u003csup\u003e2\u003c/sup\u003e/\u003cem\u003er\u003c/em\u003e seen ✔\u003cbr\u003e\nAnd \u003cem\u003ev\u003c/em\u003e = (\u003cem\u003erg\u003c/em\u003e tan(5))\u003csup\u003e ½\u003cbr\u003e\n\u003c/sup\u003eGives \u003cem\u003ev\u003c/em\u003e = (200 × 9.81 × tan (5)) \u003csup\u003e½\u003c/sup\u003e = 13\u003cbr\u003e\nSo speed limit = 13 m s\u003csup\u003e–1\u003c/sup\u003e ✔\u003cbr\u003e\n\u003cem\u003eMay see cos (85) for sin (5)\u003cbr\u003e\nAlternative for MP1 and MP2: Evidence of mg tan (5)\u003cbr\u003e\nfourth mark is for answer and suggesting this as the speed limit.\u003cbr\u003e\nMax 3 if mg = N used\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e4\u003cbr\u003e\n[14]\u003cbr\u003e\u003c/strong\u003e", ss of the car is 1200 kg.\u003cbr\u003e\nThe average braking force acting on the car is 6.8 kN.\u003cbr\u003e\nCalculate the time taken for the braking force to stop the car \u003cstrong\u003eand\u003c/strong\u003e the distance travelled by the car in this time.\u003cbr\u003e\n \u003cbr\u003e\ntime = \u003cspan class=\"answer-slot\" data-answer-index=\"0\" data-kind=\"long\" data-width=\"24\"\u003e\u003c/span\u003e s\u003cbr\u003e\ndistance = \u003cspan class=\"answer-slot\" data-answer-index=\"1\" data-kind=\"long\" data-width=\"24\"\u003e\u003c/span\u003e m\u003cbr\u003e\n\u003cstrong\u003e(4)\u003cbr\u003e\n\u003c/strong\u003e","markSchemeHtml":"(c)     Use of F = ma to calculate acceleration.\u003cbr\u003e\n\u003cem\u003ea\u003c/em\u003e = 6800/1200 ✔ = 5.7 m s\u003csup\u003e–2\u003cbr\u003e\n\u003c/sup\u003eevidence of use of suvat to calculate s or t, ✔\u003cbr\u003e\nto give \u003cem\u003et\u003c/em\u003e = 5.5 s ✔\u003cbr\u003e\n\u003cem\u003es\u003c/em\u003e = 85 m. ✔\u003cbr\u003e\n\u003cem\u003eIf no other mark given, allow 1 mark for\u003cbr\u003e\nmv = 1200 × 31 (= 37200)\u003cbr\u003e\nAlternative for MP1 and MP2\u003cbr\u003e\n\u003cimg class=\"rtf-image rtf-image-inline\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAYABgAAD/4QCwRXhpZgAATU0AKgAAAAgAAwE7AAIAAAAHAAAAModpAAQAAAABAAAAOpydAAEAAAAOAAAAmgAAAABIYXJpc2gAAAAEkAMAAgAAABQAAABwkAQAAgAAABQAAACEkpEAAgAAAAM3NgAAkpIAAgAAAAM3NgAAAAAAADIwMjE6MTI6MzAgMTg6MzM6NTYAMjAyMToxMjozMCAxODozMzo1NgAAAEgAYQByAGkAcwBoAAAA/9sAQwAHBQUGBQQHBgUGCAcHCAoRCwoJCQoVDxAMERgVGhkYFRgXGx4nIRsdJR0XGCIuIiUoKSssKxogLzMvKjInKisq/9sAQwEHCAgKCQoUCwsUKhwYHCoqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioq/8AAEQgAGQBGAwEiAAIRAQMRAf/EAB8AAAEFAQEBAQEBAAAAAAAAAAABAgMEBQYHCAkKC//EALUQAAIBAwMCBAMFBQQEAAABfQECAwAEEQUSITFBBhNRYQcicRQygZGhCCNCscEVUtHwJDNicoIJChYXGBkaJSYnKCkqNDU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6g4SFhoeIiYqSk5SVlpeYmZqio6Slpqeoqaqys7S1tre4ubrCw8TFxsfIycrS09TV1tfY2drh4uPk5ebn6Onq8fLz9PX29/j5+v/E eHtml":"(d)     (It is assumed that) the car in front would take the same time/travel the same distance as the car behind when braking/ only difference is reaction time of the driver of car behind. ✔\u003cbr\u003e\nOr\u003cbr\u003e\nCar in front cannot stop instantaneously (so car behind will have time/distance to bring car to rest).or words to that effect\u003cbr\u003e\n\u003cem\u003eAlternative:\u003cbr\u003e\nsuggestion that total stopping distance is too large (drivers would ignore it/inefficient use of motorway)\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e1\u003cbr\u003e\n\u003c/strong\u003e","selfAssessItems":[{"id":"p-d-sa-1","part":"(d)","label":"(It is assumed that) the car in front would take the same time/travel the same distance as the car behind when braking/ only difference is reaction time of the driver of car behind.","value":1}]},{"id":"p-e","label":"(e)","marks":4,"questionHtml":"(e)     At bends on motorways the road is sloped so that a car is less likely to slide out of its lane when travelling at a high speed.\u003cbr\u003e\n\u003cstrong\u003eFigure 3\u003c/strong\u003e shows a car of mass 1200 kg travelling around a curve of radius 200 m. The motorway is sloped at an angle of 5.0°.\u003cbr\u003e\n\u003cstrong\u003eFigure 4\u003c/strong\u003e shows the weight \u003cem\u003eW\u003c/em\u003e and reaction force \u003cem\u003eN\u003c/em\u003e acting on the car. The advisory speed for the bend is chosen so that the friction force down the slope is zero.\u003cbr\u003e\n\u003cstrong\u003eFigure 3\u003cbr\u003e\n\u003cimg class=\"rtf-image rtf-image-block\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEBLAEsAAD/4RB8RXhpZgAATU0AKgAAAAgABwESAAMAAAABAAEAAAEaAAUAAAABAAAAYgEbAAUAAAABAAAAagEoAAMAAAABAAIAAAExAAIAAAAiAAAAcgEyAAIAAAAUAAAAlIdpAAQAAAABAAAAqAAAAMgBLAAAAAEAAAEsAAAAAQAAQWRvYmUgUGhvdG9zaG9wIENDIDIwMTUgKFdpbmRvd3MpADIwMjI6MDE6MDQgMjI6MTE6NDMAAAKgAgAEAAAAAQAAARygAwAEAAAAAQAAANgAAAAAAAAABgEDAAMAAAABAAYAAAEaAAUAA cem\u003ev\u003c/em\u003e = (\u003cem\u003erg\u003c/em\u003e tan(5))\u003csup\u003e ½\u003cbr\u003e\n\u003c/sup\u003eGives \u003cem\u003ev\u003c/em\u003e = (200 × 9.81 × tan (5)) \u003csup\u003e½\u003c/sup\u003e = 13\u003cbr\u003e\nSo speed limit = 13 m s\u003csup\u003e–1\u003c/sup\u003e ✔\u003cbr\u003e\n\u003cem\u003eMay see cos (85) for sin (5)\u003cbr\u003e\nAlternative for MP1 and MP2: Evidence of mg tan (5)\u003cbr\u003e\nfourth mark is for answer and suggesting this as the speed limit.\u003cbr\u003e\nMax 3 if mg = N used\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e4\u003cbr\u003e\n[14]\u003cbr\u003e\u003c/strong\u003e","selfAssessItems":[{"id":"p-e-sa-1","part":"(e)","label":"Correct use of cos (5)","value":1},{"id":"p-e-sa-2","part":"(e)","label":"Correct use of sin (5)","value":1},{"id":"p-e-sa-3","part":"(e)","label":"mv2/r seen","value":1},{"id":"p-e-sa-4","part":"(e)","label":"So speed limit = 13 m s–1","value":1}]}],"selfAssessItems":[{"id":"sa-1","part":"(a)","label":"Evidence of distance travelled = area under graph = 1755 + 1440 + 1620 = 4815","value":1},{"id":"sa-2","part":"(a)","label":"= 20.1 m s–1(at least 3sf)","value":1},{"id":"sa-3","part":"(a)","label":"Which is less than (speed) limit, (and therefore the answer is No).","value":1},{"id":"sa-4","part":"(a)","label":"Calculation of distance travelled at speed limit = 5280 m","value":1},{"id":"sa-5","part":"(a)","label":"Which is greater than distance travelled (so no).","value":1},{"id":"sa-6","part":"(a)","label":"Total area = 80.25 m s–1 min","value":1},{"id":"sa-7","part":"(a)","label":"Average = 20.1 m s-1","value":1},{"id":"sa-8","part":"(b)","label":"Using reaction time of 2.0 s","value":1},{"id":"sa-9","part":"(b)","label":"62 m (would be appropriate).","value":1},{"id":"sa-10","part":"(c)","label":"a = 6800/1200= 5.7 m s–2","value":1},{"id":"sa-11","part":"(c)","label":"evidence of use of suvat to calculate s or t,","value":1},{"id":"sa-12","part ;height:auto\" alt=\"\"\u003e\u003cbr\u003e\n\u003c/strong\u003eThe table below shows some properties of the optical fibre.\u003cbr\u003e\n \u003cbr\u003e\n\n\u003cdiv class=\"rtf-table-wrap\"\u003e\u003ctable class=\"rtf-table\"\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003c/td\u003e\u003ctd\u003e\u003cstrong\u003eRefractive index\n\u003c/strong\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ecladding\u003c/td\u003e\u003ctd\u003e1.41\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ecore\u003c/td\u003e\u003ctd\u003e1.47\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e","parts":[{"id":"p-a","label":"(a)","marks":1,"questionHtml":"(a)  Calculate the speed of the light ray in the optical fibre.\u003cbr\u003e\n \u003cbr\u003e\nspeed = \u003cspan class=\"answer-slot\" data-answer-index=\"0\" data-kind=\"long\" data-width=\"24\"\u003e\u003c/span\u003e m s\u003csup\u003e−1\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/sup\u003e\u003cstrong\u003e(1)\u003cbr\u003e\n\u003c/strong\u003e","markSchemeHtml":"(a)     Speed = 3.0 × 10\u003csup\u003e8\u003c/sup\u003e/1.47\u003cbr\u003e\n= 2.0(4) × 10\u003csup\u003e8\u003c/sup\u003e m s\u003csup\u003e–1\u003c/sup\u003e ✔\u003cbr\u003e\n\u003cem\u003eDo not accept 1 sf answer\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e1\u003cbr\u003e\n\u003c/strong\u003e","selfAssessItems":[{"id":"p-a-sa-1","part":"(a)","label":"= 2.0(4) × 108 m s–1","value":1}]},{"id":"p-b","label":"(b)","marks":3,"questionHtml":"(b)  Calculate \u003cem\u003eA\u003c/em\u003e, in degrees, for the optical fibre shown in \u003cstrong\u003eFigure 1\u003c/strong\u003e.\u003cbr\u003e\n \u003cbr\u003e\n\u003cem\u003eA\u003c/em\u003e = \u003cspan class=\"answer-slot\" data-answer-index=\"0\" data-kind=\"long\" data-width=\"24\"\u003e\u003c/span\u003e degrees\u003cbr\u003e\n\u003cstrong\u003e(3)\u003cbr\u003e\n\u003c/strong\u003e","markSchemeHtml":"(b)

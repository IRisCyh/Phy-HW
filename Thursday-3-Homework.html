<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thursday 3 Homework</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f6f8;
        --panel: #ffffff;
        --panel-soft: #f8fafc;
        --text: #17202a;
        --muted: #617085;
        --line: #d8e0e8;
        --accent: #256f9d;
        --accent-dark: #184f74;
        --success: #147a4a;
        --warning: #9a5b00;
        --shadow: 0 12px 32px rgba(24, 42, 63, 0.12);
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
      }
      .shell {
        margin: 0 auto;
        max-width: 1040px;
        min-height: 100vh;
        padding: 24px;
      }
      .topbar, .card, .answer-panel, .final-panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }
      .topbar {
        align-items: center;
        display: flex;
        gap: 20px;
        justify-content: space-between;
        margin-bottom: 16px;
        padding: 18px 22px;
      }
      h1, h2, h3 { margin: 0; }
      h1 { font-size: 26px; line-height: 1.15; }
      h2 { font-size: 22px; line-height: 1.2; }
      h3 { color: var(--accent-dark); font-size: 15px; margin-bottom: 8px; }
      p { line-height: 1.55; }
      .stats {
        display: grid;
        gap: 8px;
        grid-template-columns: repeat(3, minmax(86px, 1fr));
      }
      .question-stats {
        grid-template-columns: repeat(3, minmax(86px, 1fr));
      }
      .stats div {
        background: var(--panel-soft);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 9px 11px;
        text-align: right;
      }
      .stats strong { display: block; font-size: 20px; }
      .stats span, .muted { color: var(--muted); font-size: 13px; }
      .card, .answer-panel, .final-panel { padding: 18px; }
      .start-card {
        display: grid;
        gap: 14px;
        margin-top: 24px;
      }
      label { display: grid; gap: 7px; }
      label span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
      }
      select, textarea, button {
        border-radius: 6px;
        font-family: inherit;
        font-size: 15px;
      }
      select, textarea {
        background: #fff;
        border: 1px solid var(--line);
        color: var(--text);
        width: 100%;
      }
      select { min-height: 42px; padding: 0 10px; }
      textarea {
        line-height: 1.5;
        min-height: 150px;
        padding: 12px;
        resize: vertical;
      }
      button {
        background: var(--accent);
        border: 1px solid var(--accent);
        color: #fff;
        cursor: pointer;
        font-weight: 700;
        min-height: 44px;
        padding: 0 16px;
      }
      button:hover { background: var(--accent-dark); }
      button.secondary {
        background: #fff;
        border-color: var(--line);
        color: var(--accent-dark);
      }
      .big-submit {
        display: block;
        font-size: 22px;
        min-height: 74px;
        width: 100%;
      }
      .question-header {
        align-items: start;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 16px;
        justify-content: space-between;
        margin-bottom: 16px;
        padding-bottom: 14px;
      }
      .question-meta {
        color: var(--muted);
        font-size: 13px;
        margin-top: 6px;
      }
      .question-body {
        font-size: 15px;
        line-height: 1.6;
        overflow-wrap: anywhere;
      }
      .answer-panel {
        display: grid;
        gap: 14px;
        margin-top: 16px;
      }
      .choice-list, .assess-list {
        display: grid;
        gap: 10px;
      }
      .choice-list.compact {
        display: flex;
        flex-wrap: wrap;
      }
      .choice, .assess-item {
        align-items: start;
        background: var(--panel-soft);
        border: 1px solid var(--line);
        border-radius: 8px;
        display: grid;
        gap: 10px;
        grid-template-columns: 22px 1fr;
        padding: 10px 12px;
      }
      .choice-letter {
        align-items: center;
        grid-template-columns: 22px auto;
        min-width: 74px;
      }
      .choice-letter span {
        font-size: 18px;
        font-weight: 700;
      }
      .part-card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        display: grid;
        gap: 12px;
        margin-top: 14px;
        padding: 14px;
      }
      .part-card + .part-card {
        margin-top: 18px;
      }
      .part-header {
        align-items: center;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 12px;
        justify-content: space-between;
        padding-bottom: 10px;
      }
      .part-header strong {
        color: var(--accent-dark);
      }
      .part-body {
        display: grid;
        gap: 12px;
      }
      .inline-answer,
      .short-answer {
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--text);
        font: inherit;
      }
      .inline-answer {
        display: block;
        line-height: 1.45;
        margin: 8px 0;
        min-height: 76px;
        padding: 10px;
        resize: vertical;
        width: 100%;
      }
      .short-answer {
        display: inline-block;
        min-height: 34px;
        min-width: 150px;
        padding: 4px 8px;
      }
      .tick-choice-input {
        display: block;
        height: 18px;
        margin: 0 auto;
        width: 18px;
      }
      .mark-scheme {
        background: #fffdf5;
        border: 1px solid #e9dca8;
        border-radius: 8px;
        padding: 14px;
      }
      .answer-collapse {
        background: #fffdf5;
        border: 1px solid #e9dca8;
        border-radius: 8px;
        overflow: hidden;
      }
      .answer-collapse-toggle {
        align-items: center;
        background: transparent;
        border: 0;
        border-radius: 0;
        color: var(--accent-dark);
        cursor: pointer;
        display: flex;
        font-weight: 700;
        min-height: 0;
        justify-content: space-between;
        padding: 12px 14px;
        text-align: left;
        width: 100%;
      }
      .answer-collapse-toggle:hover {
        background: #fff8df;
      }
      .answer-collapse-toggle::after {
        content: "Hide";
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
      }
      .answer-collapse-toggle[data-collapsed="true"]::after {
        content: "Show";
      }
      .answer-collapse-body {
        border-top: 1px solid #e9dca8;
        display: grid;
        gap: 14px;
        padding: 14px;
      }
      .answer-collapse-body .mark-scheme {
        border: 0;
        padding: 0;
      }
      .inline-mark-point {
        align-items: center;
        display: inline-flex;
        gap: 6px;
        margin-right: 6px;
        vertical-align: baseline;
      }
      .inline-mark-point input {
        height: 15px;
        margin: 0;
        width: 15px;
      }
      .inline-mark-point-fallback {
        display: grid;
        gap: 6px;
        margin-top: 12px;
        padding: 0;
      }
      .assessment-score {
        color: var(--success);
        font-weight: 700;
      }
      .nav-row {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
      }
      .rtf-image { height: auto; max-width: 100%; object-fit: contain; }
      .rtf-image-block { display: block; margin: 8px auto; }
      .rtf-image-inline { display: inline-block; margin: 0 4px; max-height: 1.6em; vertical-align: middle; }
      .rtf-table-wrap { margin: 10px 0; max-width: 100%; overflow-x: auto; }
      .rtf-table { border-collapse: collapse; font-size: 13px; line-height: 1.35; max-width: 100%; width: 100%; }
      .rtf-table th, .rtf-table td {
        border: 1px solid var(--line);
        color: var(--text);
        padding: 6px 8px;
        text-align: center;
        vertical-align: middle;
      }
      .status { color: var(--muted); margin: 0; }
      .status.success { color: var(--success); }
      .status.warning { color: var(--warning); }
      @media (max-width: 760px) {
        .shell { padding: 12px; }
        .topbar, .question-header { display: grid; }
        .stats { grid-template-columns: 1fr; }
        .nav-row { display: grid; }
      }
    </style>
  </head>

traviolet (UV) light and showing that the plate loses its charge.\u003cbr\u003e\n(a)     Explain why, when ultraviolet light is shone on a \u003cstrong\u003epositively\u003c/strong\u003e charged plate, no charge is lost by the plate.\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n\u003cstrong\u003e(2)\u003cbr\u003e\n\u003c/strong\u003e(b)     Threshold frequency and work function are important ideas in the study of the photoelectric effect.\u003cbr\u003e\n\u003cstrong\u003eTables 1\u003c/strong\u003e and \u003cstrong\u003e2\u003c/strong\u003e summarise the work functions of three metals and photon energies of three UV light sources.\u003cbr\u003e\n\u003cstrong\u003eTable 1\u003cbr\u003e\n\u003c/strong\u003e \u003cbr\u003e\n\n\u003cdiv class=\"rtf-table-wrap\"\u003e\u003ctable class=\"rtf-table has-header-row\"\u003e\u003ctbody\u003e\u003ctr\u003e\u003cth\u003e\u003cstrong\u003eMetal\n\u003c/strong\u003e\u003c/th\u003e\u003cth\u003eWork function / \u003cbr\u003e\neV\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eZinc\u003c/td\u003e\u003ctd\u003e4.3\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eIron\u003c/td\u003e\u003ctd\u003e4.5\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eCopper\u003c/td\u003e\u003ctd\u003e4.7\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\n\u003cstrong\u003eTable 2\u003cbr\u003e\n\u003c/strong\u003e \u003cbr\u003e\n\n\u003cdiv class=\"rtf-table-wrap\"\u003e\u003ctable class=\"rtf-table has-header-row\"\u003e\u003ctbody\u003e\u003ctr\u003e\u003cth\u003e\u003cstrong\u003eLight source\n\u003c/strong\u003e\u003c/th\u003e\u003cth\u003ePhoton energy / \u003cbr\u003e\neV\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e1\u003c/td\u003e\u003ctd\u003e4.0\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e2\u003c/td\u003e\u003ctd\u003e4.4\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e3\u003c/td\u003e\u003ctd\u003e5.0\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\nDiscuss the combinations of metal and UV light source that could best be used to demonstrate the idea of threshold frequency and the idea of work function.\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n\u003cstrong\u003e(6)\u003cbr\u003e\n\u003c/strong\u003e(c)     Calculate the maximum kinetic energy, in J, of the electrons emitted from a zinc plate when illuminated with ultraviolet light.\u003cbr\u003e\nwork function of zinc = 4.3 eV\u003cbr\u003e\nfrequency of ultraviolet light = 1.2 × 10\u003csup\u003e15\u003c/sup\u003e Hz\u003cbr\u003e\u003cbr\u003emaximum kinetic energy ____________________ J\u003cbr\u003e\n\u003cstrong\u003e(3)\u003cbr\u003e\n\u003c/strong\u003e(d)     Explain why your answer is a maximum.\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n\u003cstrong\u003e(1)\u003cbr\u003e\n(Total 12 marks)\u003cbr\u003e\u003c/strong\u003e","markSchemeHtml":"(a)     The process involves the ejection of electrons which are negatively charged. ✓\u003cbr\u003e\n\u003cstrong\u003e1\u003cbr\u003e\n\u003c/strong\u003eAny electrons ejected will only make the positive charge greater. ✓\u003cbr\u003e\n\u003cstrong\u003e1\u003cbr\u003e\n\u003c/strong\u003e(b)     \u003cstrong\u003eThe mark scheme gives some guidance as to what statements are expected to be seen in a 1 or 2 mark (L1), 3 or 4 mark (L2) and 5 or 6 mark (L3) answer. Guidance provided in section 3.10 of the ‘\u003cem\u003eMark Scheme Instructions\u003c/em\u003e’ document should be used to assist in marking this question.\u003cbr\u003e\n\u003c/strong\u003e \u003cbr\u003e\n\n\u003cdiv class=\"rtf-table-wrap\"\u003e\u003ctable class=\"rtf-table\"\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eMark\u003c/td\u003e\u003ctd\u003eCriteria\u003c/td\u003e\u003ctd\u003eQoWC\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e6\u003c/td\u003e\u003ctd\u003eBoth ideas fully analysed, with full discussion of alternatives.\u003c/td\u003e\u003ctd\u003eThe student presents relevant information coherently, employing structure, style and sp\u0026amp;g to render meaning clear. The text is legible.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e5\u003c/td\u003e\u003ctd\u003eBoth ideas analysed with supporting discussion but without alternatives\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e4\u003c/td\u003e\u003ctd\u003eBoth ideas analysed, with one dealt with satisfactorily and the other with some supporting discussion\u003c/td\u003e\u003ctd\u003eThe student presents relevant information and in a way which assists the communication of meaning. The text is legible. Sp\u0026amp;g are sufficiently accurate not to obscure meaning.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e3\u003c/td\u003e\u003ctd\u003eBoth ideas analysed, with only one dealt with satisfactorily\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e2\u003c/td\u003e\u003ctd\u003eOne idea analysed with some supporting discussion\u003c/td\u003e\u003ctd\u003eThe student presents some relevant information in a simple form. The text is usually legible. Sp\u0026amp;g allow meaning to be derived although errors are sometimes obstructive.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e1\u003c/td\u003e\u003ctd\u003eOne idea analysed, with little supporting discussion\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e0\u003c/td\u003e\u003ctd\u003eUnsupported combination or no relevant analysis\u003c/td\u003e\u003ctd\u003eThe student’s presentation, spelling, punctuation and grammar seriously obstruct understanding.\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\n\u003cem\u003eThe following statements are likely to be present. \u003cbr\u003e\nTo demonstrate threshold frequency: \u003cbr\u003e\nThe metal should be kept the same, and the light source varied. \u003cbr\u003e\nUsing any metal, and light sources 1 and 3, \u003cbr\u003e\nno charge will be lost with light source 1 \u003cbr\u003e\nbut charge will be lost with light source 3 \u003cbr\u003e\nbecause light source three has a greater photon energy \u003cbr\u003e\nand therefore frequency (from E=hf) \u003cbr\u003e\nand is above the threshold frequency \u003cbr\u003e\nas the photon energy is greater than the work function of the metal \u003cbr\u003e\nbut light source 1 has a photon energy less than the work function of the metal \u003cbr\u003e\nso its frequency is below the threshold frequency. \u003cbr\u003e\nTo demonstrate work function \u003cbr\u003e\nThe light source should be kept the same, and the metal varied \u003cbr\u003e\nUse light source 2 as the other two will either cause all three metals to lose their charge, or none of the metals to lose their charge. \u003cbr\u003e\nUse each metal in turn, so that zinc loses its charge, due to its low work function, but copper and iron do not lose their charge.\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e6\u003cbr\u003e\n\u003c/strong\u003e(c)     Work function in joules = 1.6 x 10\u003csup\u003e-19\u003c/sup\u003e x 4.3 = 6.9 x 10\u003csup\u003e-19\u003c/sup\u003e J ✓\u003cbr\u003e\n\u003cem\u003eThe first mark is for converting the work function into J\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e1\u003cbr\u003e\n\u003c/strong\u003eUse of hf = work function + KE\u003csub\u003emax\u003cbr\u003e\n\u003cem\u003e\u003c/em\u003e\u003c/sub\u003e\u003cem\u003eThe second mark is for substituting into the photoelectric equation\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e1\u003cbr\u003e\n\u003c/strong\u003eKE\u003csub\u003emax\u003c/sub\u003e = hf – work function \u003cbr\u003e\n= (6.63 x 10\u003csup\u003e-34\u003c/sup\u003e) x (1.2 x 10\u003csup\u003e15\u003c/sup\u003e) + 6.9 x 10\u003csup\u003e-19\u003c/sup\u003e ✓ \u003cbr\u003e\n           = 7.9 x 10\u003csup\u003e-19\u003c/sup\u003e – 6.9 x 10\u003csup\u003e-19\u003c/sup\u003e \u003cbr\u003e\n= 1.0 x 10\u003csup\u003e-19\u003c/sup\u003e J ✓\u003cbr\u003e\n\u003cem\u003eThe third mark is for the final answer\u003cbr\u003e\nAllow 1.1\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e1\u003cbr\u003e\n\u003c/strong\u003e(d)     The work function is the minimum amount of energy needed to remove the electron from the zinc surface ✓\u003cbr\u003e\n\u003cem\u003eAlternative\u003cbr\u003e\nReference to max ke corresponding to emission of surface electrons whilst electrons from deeper in the metal will be emitted with smaller ke\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e1\u003cbr\u003e\n[12]\u003cbr\u003e\u003c/strong\u003e","answerMode":"structured","options":[],"correctOption":"","introHtml":"The photoelectric effect can be demonstrated by illuminating a negatively charged plate, made from certain metals, with ultraviolet (UV) light and showing that the plate loses its charge.\u003cbr\u003e","parts":[{"id":"p-a","label":"(a)","marks":2,"questionHtml":"(a)     Explain why, when ultraviolet light is shone on a \u003cstrong\u003epositively\u003c/strong\u003e charged plate, no charge is lost by the plate.\u003cbr\u003e\n\u003cspan class=\"answer-slot\" data-answer-index=\"0\" data-kind=\"long\" data-width=\"72\"\u003e\u003c/span\u003e\u003cstrong\u003e(2)\u003cbr\u003e\n\u003c/strong\u003e","markSchemeHtml":"(a)     The process involves the ejection of electrons which are negatively charged. ✓\u003cbr\u003e\n\u003cstrong\u003e1\u003cbr\u003e\n\u003c/strong\u003eAny electrons ejected will only make the positive charge greater. ✓\u003cbr\u003e\n\u003cstrong\u003e1\u003cbr\u003e\n\u003c/strong\u003e","selfAssessItems":[{"id":"p-a-sa-1","part":"(a)","label":"The process involves the ejection of electrons which are negatively charged. ✓","value":1},{"id":"p-a-sa-2","part":"(a)","label":"Any electrons ejected will only make the positive charge greater. ✓","value":1}]},{"id":"p-b","label":"(b)","marks":27,"questionHtml":"(b)     Threshold frequency and work function are important ideas in the study of the photoelectric effect.\u003cbr\u003e\n\u003cstrong\u003eTables 1\u003c/strong\u003e and \u003cstrong\u003e2\u003c/strong\u003e summarise the work functions of three metals and photon energies of three UV light sources.\u003cbr\u003e\n\u003cstrong\u003eTable 1\u003cbr\u003e\n\u003c/strong\u003e \u003cbr\u003e\n\n\u003cdiv class=\"rtf-table-wrap\"\u003e\u003ctable class=\"rtf-table has-header-row\"\u003e\u003ctbody\u003e\u003ctr\u003e\u003cth\u003e\u003cstrong\u003eMetal\n\u003c/strong\u003e\u003c/th\u003e\u003cth\u003eWork function / \u003cbr\u003e\neV\u003c/th\u003e\ 003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e6\u003c/td\u003e\u003ctd\u003eBoth ideas fully analysed, with full discussion of alternatives.\u003c/td\u003e\u003ctd\u003eThe student presents relevant information coherently, employing structure, style and sp\u0026amp;g to render meaning clear. The text is legible.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e5\u003c/td\u003e\u003ctd\u003eBoth ideas analysed with supporting discussion but without alternatives\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e4\u003c/td\u003e\u003ctd\u003eBoth ideas analysed, with one dealt with satisfactorily and the other with some supporting discussion\u003c/td\u003e\u003ctd\u003eThe student presents relevant information and in a way which assists the communication of meaning. The text is legible. Sp\u0026amp;g are sufficiently accurate not to obscure meaning.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e3\u003c/td\u003e\u003ctd\u003eBoth ideas analysed, with only one dealt with satisfactorily\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e2\u003c/td\u003e\u003ctd\u003eOne idea analysed with some supporting discussion\u003c/td\u003e\u003ctd\u003eThe student presents some relevant information in a simple form. The text is usually legible. Sp\u0026amp;g allow meaning to be derived although errors are sometimes obstructive.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e1\u003c/td\u003e\u003ctd\u003eOne idea analysed, with little supporting discussion\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e0\u003c/td\u003e\u003ctd\u003eUnsupported combination or no relevant analysis\u003c/td\u003e\u003ctd\u003eThe student’s presentation, spelling, punctuation and grammar seriously obstruct understanding.\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\n\u003cem\u003eThe following statements are likely to be present. \u003cbr\u003e\nTo demonstrate threshold frequency: \u003cbr\u003e\nThe metal should be kept the same, and the light source varied. \u003cbr\u003e\nUsing any metal, and light sources 1 and 3, \u003cbr\u003e\nno charge will be lost with light source 1 \u003cbr\u003e\nbut charge will be lost with light source 3 \u003cbr\u003e\nbecause light source three has a greater photon energy \u003cbr\u003e\nand therefore frequency (from E=hf) \u003cbr\u003e\nand is above the threshold frequency \u003cbr\u003e\nas the photon energy is greater than the work function of the metal \u003cbr\u003e\nbut light source 1 has a photon energy less than the work function of the metal \u003cbr\u003e\nso its frequency is below the threshold frequency. \u003cbr\u003e\nTo demonstrate work function \u003cbr\u003e\nThe light source should be kept the same, and the metal varied \u003cbr\u003e\nUse light source 2 as the other two will either cause all three metals to lose their charge, or none of the metals to lose their charge. \u003cbr\u003e\nUse each metal in turn, so that zinc loses its charge, due to its low work function, but copper and iron do not lose their charge.\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e6\u003cbr\u003e\n\u003c/strong\u003e","selfAssessItems":[{"id":"p-b-sa-1","part":"(b)","label":"The mark scheme gives some guidance as to what statements are expected to be seen in a 1 or 2 mark (L1), 3 or 4 mark (L2) and 5 or 6 mark (L3) answer. Guidance provided in section 3.10 of the ‘Mark Scheme Instructions’ document should be used to assist in marking this question.","value":1},{"id":"p-b-sa-2","part":"(b)","label":"QoWC","value":1},{"id":"p-b-sa-3","part":"(b)","label":"Both ideas fully analysed, with full discussion of alternatives.","value":1},{"id":"p-b-sa-4","part":"(b)","label":"The student presents relevant information coherently, employing structure, style and sp\u0026g to render meaning clear. The text is legible.","value":1},{"i id":"p-b-sa-21","part":"(b)","label":"and therefore frequency (from E=hf)","value":1},{"id":"p-b-sa-22","part":"(b)","label":"and is above the threshold frequency","value":1},{"id":"p-b-sa-23","part":"(b)","label":"as the photon energy is greater than the work function of the metal","value":1},{"id":"p-b-sa-24","part":"(b)","label":"but light source 1 has a photon energy less than the work function of the metal","value":1},{"id":"p-b-sa-25","part":"(b)","label":"so its frequency is below the threshold frequency.","value":1},{"id":"p-b-sa-26","part":"(b)","label":"To demonstrate work function","value":1},{"id":"p-b-sa-27","part":"(b)","label":"The light source should be kept the same, and the metal varied","value":1}]},{"id":"p-c","label":"(c)","marks":3,"questionHtml":"(c)     Calculate the maximum kinetic energy, in J, of the electrons emitted from a zinc plate when illuminated with ultraviolet light.\u003cbr\u003e\nwork function of zinc = 4.3 eV\u003cbr\u003e\nfrequency of ultraviolet light = 1.2 × 10\u003csup\u003e15\u003c/sup\u003e Hz\u003cbr\u003e\u003cbr\u003emaximum kinetic energy \u003cspan class=\"answer-slot\" data-answer-index=\"0\" data-kind=\"long\" data-width=\"24\"\u003e\u003c/span\u003e J\u003cbr\u003e\n\u003cstrong\u003e(3)\u003cbr\u003e\n\u003c/strong\u003e","markSchemeHtml":"(c)     Work function in joules = 1.6 x 10\u003csup\u003e-19\u003c/sup\u003e x 4.3 = 6.9 x 10\u003csup\u003e-19\u003c/sup\u003e J ✓\u003cbr\u003e\n\u003cem\u003eThe first mark is for converting the work function into J\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e1\u003cbr\u003e\n\u003c/strong\u003eUse of hf = work function + KE\u003csub\u003emax\u003cbr\u003e\n\u003cem\u003e\u003c/em\u003e\u003c/sub\u003e\u003cem\u003eThe second mark is for substituting into the photoelectric equation\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e1\u003cbr\u003e\n\u003c/strong\u003eKE\u003csub\u003emax\u003c/sub\u003e = hf – work function \u003cbr\u003e\n= (6.63 x 10\u003csup\u003e-34\u003c/sup\u003e) x (1.2 x 10\u003csup\u003e15\u003c/sup\u003e) + 6.9 x 10\u003csup\u003e-19\u003c/sup\u003e ✓ \u003cbr\u003e\n           = 7.9 x 10\u003csup\u003e-19\u003c/sup\u003e – 6.9 x 10\u003csup\u003e-19\u003c/sup\u003e \u003cbr\u003e\n= 1.0 x 10\u003csup\u003e-19\u003c/sup\u003e J ✓\u003cbr\u003e\n\u003cem\u003eThe third mark is for the final answer\u003cbr\u003e\nAllow 1.1\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e1\u003cbr\u003e\n\u003c/strong\u003e","selfAssessItems":[{"id":"p-c-sa-1","part":"(c)","label":"Work function in joules = 1.6 x 10-19 x 4.3 = 6.9 x 10-19 J ✓","value":1},{"id":"p-c-sa-2","part":"(c)","label":"The first mark is for converting the work function into J","value":1},{"id":"p-c-sa-3","part":"(c)","label":"The second mark is for substituting into the photoelectric equation","value":1}]},{"id":"p-d","label":"(d)","marks":1,"questionHtml":"(d)     Explain why your answer is a maximum.\u003cbr\u003e\n\u003cspan class=\"answer-slot\" data-answer-index=\"0\" data-kind=\"long\" data-width=\"72\"\u003e\u003c/span\u003e\u003cstrong\u003e(1)\u003cbr\u003e\u003c/strong\u003e","markSchemeHtml":"(d)     The work function is the minimum amount of energy needed to remove the electron from the zinc surface ✓\u003cbr\u003e\n\u003cem\u003eAlternative\u003cbr\u003e\nReference to max ke corresponding to emission of surface electrons whilst electrons from deeper in the metal will be emitted with smaller ke\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e1\u003cbr\u003e\n[12]\u003cbr\u003e\u003c/strong\u003e","selfAssessItems":[{"id":"p-d-sa-1","part":"(d)","label":"The work function is the minimum amount of energy needed to remove the electron from the zinc surface ✓","value":1}]}],"selfAssessItems":[{"id":"sa-1","part":"(a)","label":"The process involves the ejection of electrons which are negatively charge Id":"QS16.1.03","summary":"Pair production","marks":9,"timeMinutes":10,"questionType":"State/explain/numerical","series":"2016 Summer AS Paper 1","topics":["Particles"],"questionHtml":"Under certain conditions a photon may be converted into an electron and a positron.\u003cbr\u003e\n(a)     State the name of this process.\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n\u003cstrong\u003e(1)\u003cbr\u003e\n\u003c/strong\u003e(b)     For the conversion to take place the photon has to have an energy equal to or greater than a certain minimum energy.\u003cbr\u003e\n(i)      Explain why there is a minimum energy.\u003cbr\u003e\n______________________________________________________________\u003cbr\u003e\n______________________________________________________________\u003cbr\u003e\n\u003cstrong\u003e(2)\u003cbr\u003e\n\u003c/strong\u003e(ii)     Show that this minimum energy is about 1 MeV.\u003cbr\u003e\n \u003cbr\u003e\n\u003cstrong\u003e(1)\u003cbr\u003e\n\u003c/strong\u003e(iii)     Explain what happens to the excess energy when the photon energy is greater than the minimum energy.\u003cbr\u003e\n______________________________________________________________\u003cbr\u003e\n______________________________________________________________\u003cbr\u003e\n\u003cstrong\u003e(1)\u003cbr\u003e\n\u003c/strong\u003e(iv)     A photon has an energy of 1.0 MeV.\u003cbr\u003e\nCalculate the frequency associated with this photon energy.\u003cbr\u003e\nState an appropriate unit in your answer.\u003cbr\u003e\nfrequency = __________ unit = __________\u003cbr\u003e\n\u003cstrong\u003e(4)\u003cbr\u003e\n(Total 9 marks)\u003cbr\u003e\u003c/strong\u003e","markSchemeHtml":"(a)     pair production ✔\u003cbr\u003e\n\u003cstrong\u003e1\u003cbr\u003e\n\u003c/strong\u003e(b)     (i)      energy of photon needs to provide\u003cbr\u003e\nat least the rest masses ✔\u003cbr\u003e\n\u003cem\u003eOR at least the rest energy ✔\u003cbr\u003e\n\u003c/em\u003eof the electron and positron / of (both) particles / of particle and antiparticle ✔\u003cbr\u003e\n\u003cem\u003eOf the electron and positron / of (both) particles of particle and antiparticle ✔\u003cbr\u003e\nCan't score 2nd mark without having scored 1st\u003cbr\u003e\n\u003c/em\u003e(allow particles or products)\u003cbr\u003e\nTO on any suggestion of particles have KE\u003cbr\u003e\n\u003cstrong\u003e2\u003cbr\u003e\n\u003c/strong\u003e(ii)     minimum energy = 2 × 0.510999 = 1.021998 (MeV) ✔\u003cbr\u003e\n\u003cem\u003emust see working\u003cbr\u003e\n\u003cstrong\u003eand\u003c/strong\u003e final answer must be at least 3 sf\u003cbr\u003e\n\u003c/em\u003eallow detailed argument in reverse\u003cbr\u003e\n0.5 Mev close to 0.511 MeV\u003cbr\u003e\n\u003cem\u003eOr E=mc\u003csup\u003e2\u003c/sup\u003e leading to 1.024875 MeV\u003cbr\u003e\nOr 2 × 5.5 × 10\u003csup\u003e-4\u003c/sup\u003e × 931.5 = 1.02 MeV\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e1\u003cbr\u003e\n\u003c/strong\u003e(iii)     (electron / positron have) kinetic energy ✔\u003cbr\u003e\n\u003cem\u003ethermal energy n/e\u003cbr\u003e\nMomentum n/e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e1\u003cbr\u003e\n\u003c/strong\u003e(iv)     (attempts to convert energy to joules)\u003cbr\u003e\nenergy = 1.0 × 10\u003csup\u003e6\u003c/sup\u003e × 1.60 × 10\u003csup\u003e-19\u003c/sup\u003e = 1.6 × 10\u003csup\u003e-13\u003c/sup\u003e (J) ✔ \u003cbr\u003e\n\u003cem\u003eCondone power 10 error on MeV\u003cbr\u003e\nconversion to J\u003cbr\u003e\n\u003c/em\u003e(use of \u003cem\u003eE = hf\u003c/em\u003e)\u003cbr\u003e\nTheir energy ÷ 6.63 × 10\u003csup\u003e-34\u003c/sup\u003e = \u003cem\u003ef\u003c/em\u003e ✔\u003cbr\u003e\n\u003cem\u003eMust see subject or their f on answer line consistent with working\u003cbr\u003e\nf\u003c/em\u003e = 2.4 × 10\u003csup\u003e20\u003c/sup\u003e ✔ cao\u003cbr\u003e\nHz (condone s\u003csup\u00       const state = {
        studentName: "",
        startedAt: "",
        currentIndex: 0,
        answers: {}
      };
      const app = document.getElementById("app");
      const studentLine = document.getElementById("studentLine");
      const globalScore = document.getElementById("globalScore");

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function currentQuestion() {
        return ASSIGNMENT.questions[state.currentIndex];
      }

      function currentAwardedMarks() {
        return ASSIGNMENT.questions.reduce((sum, question) => {
          return sum + Number(state.answers[question.questionId]?.awardedMarks || 0);
        }, 0);
      }

      function refreshGlobalScore() {
        if (globalScore) globalScore.textContent = `${currentAwardedMarks()}/${ASSIGNMENT.totalMarks}`;
        const questionTotalScore = document.getElementById("questionTotalScore");
        if (questionTotalScore) questionTotalScore.textContent = `${currentAwardedMarks()}/${ASSIGNMENT.totalMarks}`;
      }

      function ensureAnswer(question) {
        if (!state.answers[question.questionId]) {
          state.answers[question.questionId] = {
            studentAnswer: "",
            submitted: false,
            partAnswers: {},
            partSubmitted: {},
            partScores: {},
            checkedItems: {},
            awardedMarks: 0
          };
        }
        return state.answers[question.questionId];
      }

      function countAnswerSlots(part) {
        const indexes = [...String(part.questionHtml || "").matchAll(/data-answer-index="(\d+)"/g)].map((match) => Number(match[1]));
        return indexes.length ? Math.max(...indexes) + 1 : 1;
      }

      function ensurePartAnswer(answer, part) {
        if (!answer.partAnswers[part.id]) {
          answer.partAnswers[part.id] = Array.from({ length: countAnswerSlots(part) }, () => "");
        }
        return answer.partAnswers[part.id];
      }

      function questionComplete(question, answer) {
        if (question.answerMode === "multiple-choice") return answer.submitted;
        return (question.parts || []).every((part) => answer.partSubmitted[part.id]);
      }

      function hydratePartHtml(part, values, disabled) {
        const source = String(part.questionHtml || "");
        const disabledAttr = disabled ? "disabled" : "";
        if (!source.includes('class="answer-slot"')) {
          return `${source}<textarea class="inline-answer" data-answer-input-part="${escapeHtml(part.id)}" data-answer-input-index="0" ${disabledAttr}>${escapeHtml(values[0] || "")}</textarea>`;
        }
        return source.replace(
          /<span class="answer-slot" data-answer-index="(\d+)" data-kind="([^"]+)" data-width="([^"]+)"><\/span>/g,
          (_match, index, kind, width) => {
            const value = escapeHtml(values[Number(index)] || "");
            if (kind === "choice") {
              const checked = values[Number(index)] === String(width) ? "checked" : "";
              return `<input type="radio" class="tick-choice-input" name="answer-${escapeHtml(part.id)}-${index}" data-answer-input-part="${escapeHtml(part.id)}" data-answer-input-index="${index}" value="${escapeHtml(width)}" ${checked} ${disabledAttr}>`;
            }
            if (kind === "short") {
              return `<input class="short-answer" data-answer-input-part="${escapeHtml(part.id)}" data-answer-input-index="${index}" style="width:${Number(width) + 5}ch" value="${value}" ${disabledAttr}>`;
            }
            return `<textarea class="inline-answer" data-answer-input-part="${escapeHtml(part.id)}" data-answer-input-index="${index}" ${disabledAttr}>${value}</textarea>`;
          }
        );
      }

      function renderStart() {
        app.innerHTML = `
          <section class="card start-card">
            <h2>Start assignment</h2>
            <label>
              <span>Student name</span>
              <select id="studentName">
                <option value="">Choose your name</option>
                ${ASSIGNMENT.studentNames.map((name) => `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`).join("")}
              </select>
            </label>
            <button id="startButton" type="button">Start answering</button>
          </section>
        `;
        document.getElementById("startButton").addEventListener("click", () => {
          const name = document.getElementById("studentName").value;
          if (!name) return;
          state.studentName = name;
          state.startedAt = new Date().toISOString();
          studentLine.textContent = `${name} · started ${new Date(state.startedAt).toLocaleString()}`;
          renderQuestion();
        });
      }

      function answerInput(question, answer) {
        if (question.answerMode === "multiple-choice" && question.options.length) {
          return `
            <div class="choice-list compact">
              ${question.options.map((option) => `
                <label class="choice choice-letter">
                  <input type="radio" name="studentAnswer" value="${escapeHtml(option.label)}" ${answer.studentAnswer === option.label ? "checked" : ""} ${answer.submitted ? "disabled" : ""}>
                  <span>${escapeHtml(option.label)}</span>
                </label>
              `).join("")}
            </div>
          `;
        }
        return "";
      }

      function assessmentMarkup(question, answer) {
        if (!answer.submitted) return "";
        if (question.answerMode === "multiple-choice") {
          const isCorrect = answer.studentAnswer && answer.studentAnswer === question.correctOption;
          return `
            <section class="answer-collapse">
              <button class="answer-collapse-toggle" type="button" data-collapse-toggle data-label="answer">Answer</button>
              <div class="answer-collapse-body">
                <section class="mark-scheme">
                  <h3>Answer</h3>
                  <p class="assessment-score">${isCorrect ? "Correct" : "Not correct"}: ${escapeHtml(answer.studentAnswer || "No answer")} · Correct answer: ${escapeHtml(question.correctOption || "See mark scheme")} · Score: ${answer.awardedMarks} / ${question.marks}</p>
                  <div class="question-body">${question.markSchemeHtml}</div>
                </section>
              </div>
            </section>
          `;
        }
        return "";
      }

      function partAssessmentMarkup(part, answer) {
        if (!answer.partSubmitted[part.id]) return "";
        return `
          <section class="answer-collapse">
            <button class="answer-collapse-toggle" type="button" data-collapse-toggle data-label="answer ${escapeHtml(part.label)}">Answer ${escapeHtml(part.label)}</button>
            <div class="answer-collapse-body">
              <section class="mark-scheme">
                <h3>Mark scheme ${escapeHtml(part.label)}</h3>
                <p class="muted">Tick the boxes in the mark scheme. The score is capped at this part's marks.</p>
                <div class="question-body">${markSchemeWithInlineAssess(part, answer)}</div>
                <p class="assessment-score" id="assessmentScore-${escapeHtml(part.id)}">Score: ${answer.partScores[part.id] || 0} / ${part.marks || "?"}</p>
              </section>
            </div>
          </section>
        `;
      }

      function markSchemeWithInlineAssess(part, answer) {
        const items = part.selfAssessItems || [];
        let itemIndex = 0;
        const makeCheckbox = (item) => `
          <label class="inline-mark-point">
            <input type="checkbox" data-assess-part="${escapeHtml(part.id)}" data-assess-id="${escapeHtml(item.id)}" ${answer.checkedItems[item.id] ? "checked" : ""}>
          </label>`;
        const html = String(part.markSchemeHtml || "");
        const withTicks = html.replace(/(✓|✔|&#10003;|&#x2713;|&#10004;|&#x2714;)/g, (tick) => {
          const item = items[itemIndex] || {
            id: `${part.id}-inline-${itemIndex + 1}`,
            label: "Marking point",
            value: 1
          };
          itemIndex += 1;
          return tick + makeCheckbox(item);
        });
        if (itemIndex > 0) return withTicks;

        return `
          ${html}
          <div class="inline-mark-point-fallback">
            ${items.map((item) => `
              <label>
                <input type="checkbox" data-assess-part="${escapeHtml(part.id)}" data-assess-id="${escapeHtml(item.id)}" ${answer.checkedItems[item.id] ? "checked" : ""}>
                ${escapeHtml(item.label)} <em>(+${Number(item.value || 1)})</em>
              </label>
            `).join("")}
          </div>
        `;
      }

      function structuredQuestionMarkup(question, answer) {
        return `
          ${question.introHtml ? `<div class="question-body">${question.introHtml}</div>` : ""}
          ${(question.parts || []).map((part) => {
            const values = ensurePartAnswer(answer, part);
            const submitted = Boolean(answer.partSubmitted[part.id]);
            return `
              <section class="part-card">
                <div class="part-header">
                  <strong>${escapeHtml(part.label)}</strong>
                  <span class="muted">${part.marks || "?"} mark${Number(part.marks) === 1 ? "" : "s"}</span>
                </div>
                <div class="part-body">
                  <div class="question-body">${hydratePartHtml(part, values, submitted)}</div>
                  <button type="button" data-submit-part="${escapeHtml(part.id)}" ${submitted ? "hidden" : ""}>Submit ${escapeHtml(part.label)}</button>
                  ${partAssessmentMarkup(part, answer)}
                </div>
              </section>
            `;
          }).join("")}
        `;
      }

      function collectPartAnswer(part, answer) {
        const inputs = [...document.querySelectorAll(`[data-answer-input-part="${part.id}"]`)];
        const values = [];
        inputs
          .sort((a, b) => Number(a.dataset.answerInputIndex) - Number(b.dataset.answerInputIndex))
          .forEach((input) => {
            const index = Number(input.dataset.answerInputIndex);
            if (input.type === "radio") {
              if (input.checked) values[index] = input.value.trim();
              else if (values[index] === undefined) values[index] = "";
              return;
            }
            values[index] = input.value.trim();
          });
        answer.partAnswers[part.id] = values;
      }

      function updateQuestionAwardedMarks(question, answer) {
        if (question.answerMode === "multiple-choice") {
          answer.awardedMarks = answer.studentAnswer === question.correctOption ? Number(question.marks || 0) : 0;
          refreshGlobalScore();
          return;
        }
        answer.awardedMarks = (question.parts || []).reduce((sum, part) => sum + Number(answer.partScores[part.id] || 0), 0);
        refreshGlobalScore();
      }

      function renderQuestion() {
        const question = currentQuestion();
        const answer = ensureAnswer(question);
        app.innerHTML = `
          <article class="card">
            <div class="question-header">
              <div>
                <h2>${state.currentIndex + 1}. ${escapeHtml(question.questionId)}</h2>
                <div class="question-meta">${escapeHtml(question.datasetLabel)} · ${escapeHtml(question.series)} · ${escapeHtml(question.questionType)}</div>
              </div>
              <div class="stats question-stats">
                <div><strong>${question.marks}</strong><span>Marks</span></div>
                <div><strong>${question.timeMinutes}</strong><span>Minutes</span></div>
                <div><strong id="questionTotalScore">${currentAwardedMarks()}/${ASSIGNMENT.totalMarks}</strong><span>Total marks</span></div>
              </div>
            </div>
            ${question.answerMode === "structured" ? structuredQuestionMarkup(question, answer) : `<div class="question-body">${question.questionHtml}</div>`}
          </article>
          <section class="answer-panel">
            ${question.answerMode === "multiple-choice" ? `<h3>Your answer</h3>${answerInput(question, answer)}<button id="submitQuestion" type="button" ${answer.submitted ? "hidden" : ""}>Submit</button>` : `<h3>Your progress</h3><p class="muted">Submit each part to reveal its mark scheme, then self assess that part.</p>`}
            ${assessmentMarkup(question, answer)}
            <div class="nav-row">
              <button class="secondary" id="previousQuestion" type="button" ${state.currentIndex === 0 ? "disabled" : ""}>Previous</button>
              <button id="nextQuestion" type="button" ${questionComplete(question, answer) ? "" : "disabled"}>${state.currentIndex === ASSIGNMENT.questions.length - 1 ? "Finish assignment" : "Next question"}</button>
            </div>
          </section>
        `;

        const submitButton = document.getElementById("submitQuestion");
        if (submitButton) {
          submitButton.addEventListener("click", () => {
            if (question.answerMode === "multiple-choice") {
              const checked = document.querySelector("input[name='studentAnswer']:checked");
              answer.studentAnswer = checked ? checked.value : "";
              updateQuestionAwardedMarks(question, answer);
            }
            answer.submitted = true;
            renderQuestion();
          });
        }

        document.querySelectorAll("[data-submit-part]").forEach((button) => {
          button.addEventListener("click", () => {
            const part = (question.parts || []).find((item) => item.id === button.dataset.submitPart);
            if (!part) return;
            collectPartAnswer(part, answer);
            answer.partSubmitted[part.id] = true;
            updateQuestionAwardedMarks(question, answer);
            renderQuestion();
          });
        });

        document.querySelectorAll("[data-assess-id]").forEach((checkbox) => {
          checkbox.addEventListener("change", () => {
            answer.checkedItems[checkbox.dataset.assessId] = checkbox.checked;
            updateScore(question, answer, checkbox.dataset.assessPart);
          });
        });

        document.querySelectorAll("[data-collapse-toggle]").forEach((button) => {
          button.addEventListener("click", () => {
            const body = button.nextElementSibling;
            if (!body) return;
            body.hidden = !body.hidden;
            button.dataset.collapsed = body.hidden ? "true" : "false";
            const label = button.dataset.label || "answer";
            button.textContent = label.charAt(0).toUpperCase() + label.slice(1);
          });
        });

        document.getElementById("previousQuestion").addEventListener("click", () => {
          if (state.currentIndex > 0) {
            state.currentIndex -= 1;
            renderQuestion();
          }
        });

        document.getElementById("nextQuestion").addEventListener("click", () => {
          if (!questionComplete(question, answer)) return;
          if (state.currentIndex === ASSIGNMENT.questions.length - 1) renderFinal();
          else {
            state.currentIndex += 1;
            renderQuestion();
          }
        });
      }

      function updateScore(question, answer, partId) {
        const part = (question.parts || []).find((item) => item.id === partId);
        if (!part) return;
        const score = part.selfAssessItems.reduce((sum, item) => {
          return sum + (answer.checkedItems[item.id] ? Number(item.value || 1) : 0);
        }, 0);
        answer.partScores[part.id] = Math.min(Number(part.marks || question.marks || 0), score);
        updateQuestionAwardedMarks(question, answer);
        const scoreElement = document.getElementById(`assessmentScore-${part.id}`);
        if (scoreElement) scoreElement.textContent = `Score: ${answer.partScores[part.id]} / ${part.marks || "?"}`;
      }

      function buildPayload() {
        const questions = ASSIGNMENT.questions.map((question) => {
          const answer = ensureAnswer(question);
          const parts = (question.parts || []).map((part) => ({
            id: part.id,
            label: part.label,
            marks: part.marks,
            studentAnswer: answer.partAnswers[part.id] || [],
            submitted: Boolean(answer.partSubmitted[part.id]),
            selfAssessItems: part.selfAssessItems.map((item) => ({
              id: item.id,
              label: item.label,
              value: item.value,
              checked: Boolean(answer.checkedItems[item.id])
            })),
            awardedMarks: Number(answer.partScores[part.id] || 0)
          }));
          return {
            questionId: question.questionId,
            marks: question.marks,
            timeMinutes: question.timeMinutes,
            answerMode: question.answerMode,
            studentAnswer: answer.studentAnswer,
            correctOption: question.correctOption || "",
            parts,
            awardedMarks: Number(answer.awardedMarks || 0)
          };
        });
        const awardedMarks = questions.reduce((sum, question) => sum + Number(question.awardedMarks || 0), 0);
        const submittedAt = new Date().toISOString();
        return {
          submissionId: `${ASSIGNMENT.assignmentId}-${state.studentName}-${Date.now().toString(36)}`,
          assignmentId: ASSIGNMENT.assignmentId,
          assignmentTitle: ASSIGNMENT.assignmentTitle,
          studentName: state.studentName,
          startedAt: state.startedAt,
          submittedAt,
          durationSeconds: Math.round((new Date(submittedAt).getTime() - new Date(state.startedAt).getTime()) / 1000),
          totalMarks: ASSIGNMENT.totalMarks,
          awardedMarks,
          questions
        };
      }

      function renderFinal() {
        const payload = buildPayload();
        app.innerHTML = `
          <section class="final-panel">
            <h2>Assignment complete</h2>
            <p>Your recorded score is <strong>${payload.awardedMarks} / ${payload.totalMarks}</strong>.</p>
            <button class="big-submit" id="submitToTeacher" type="button">Submit to teacher</button>
            <p class="status" id="submitStatus"></p>
          </section>
        `;
        document.getElementById("submitToTeacher").addEventListener("click", () => submitToTeacher(buildPayload()));
      }

      function submitToTeacher(payload) {
        const status = document.getElementById("submitStatus");
        if (!ASSIGNMENT.appsScriptUrl) {
          downloadJson(payload);
          status.textContent = "No Apps Script URL was configured. Submission JSON downloaded instead.";
          status.className = "status warning";
          return;
        }

        const form = document.createElement("form");
        form.method = "POST";
        form.action = ASSIGNMENT.appsScriptUrl;
        form.target = "submitFrame";
        form.hidden = true;

        const input = document.createElement("textarea");
        input.name = "payload";
        input.value = JSON.stringify(payload);
        form.append(input);
        document.body.append(form);

        const frame = document.getElementById("submitFrame");
        frame.addEventListener("load", () => {
          status.textContent = "Submitted. Your teacher will see the JSON file in Drive and the score row in Google Sheets.";
          status.className = "status success";
          form.remove();
        }, { once: true });

        status.textContent = "Submitting...";
        form.submit();
      }

      function downloadJson(payload) {
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `${ASSIGNMENT.assignmentId}-${state.studentName || "student"}-submission.json`;
        document.body.append(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      }

      renderStart();
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wednesday 3 Homework</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f6f8;
        --panel: #ffffff;
        --panel-soft: #f8fafc;
        --text: #17202a;
        --muted: #617085;
        --line: #d8e0e8;
        --accent: #256f9d;
        --accent-dark: #184f74;
        --success: #147a4a;
        --warning: #9a5b00;
        --shadow: 0 12px 32px rgba(24, 42, 63, 0.12);
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
      }
      .shell {
        margin: 0 auto;
        max-width: 1040px;
        min-height: 100vh;
        padding: 24px;
      }
      .topbar, .card, .answer-panel, .final-panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }
      .topbar {
        align-items: center;
        display: flex;
        gap: 20px;
        justify-content: space-between;
        margin-bottom: 16px;
        padding: 18px 22px;
      }
      h1, h2, h3 { margin: 0; }
      h1 { font-size: 26px; line-height: 1.15; }
      h2 { font-size: 22px; line-height: 1.2; }
      h3 { color: var(--accent-dark); font-size: 15px; margin-bottom: 8px; }
      p { line-height: 1.55; }
      .stats {
        display: grid;
        gap: 8px;
        grid-template-columns: repeat(3, minmax(86px, 1fr));
      }
      .question-stats {
        grid-template-columns: repeat(3, minmax(86px, 1fr));
      }
      .stats div {
        background: var(--panel-soft);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 9px 11px;
        text-align: right;
      }
      .stats strong { display: block; font-size: 20px; }
      .stats span, .muted { color: var(--muted); font-size: 13px; }
      .card, .answer-panel, .final-panel { padding: 18px; }
      .start-card {
        display: grid;
        gap: 14px;
        margin-top: 24px;
      }
      label { display: grid; gap: 7px; }
      label span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
      }
      select, textarea, button {
        border-radius: 6px;
        font-family: inherit;
        font-size: 15px;
      }
      select, textarea {
        background: #fff;
        border: 1px solid var(--line);
        color: var(--text);
        width: 100%;
      }
      select { min-height: 42px; padding: 0 10px; }
      textarea {
        line-height: 1.5;
        min-height: 150px;
        padding: 12px;
        resize: vertical;
      }
      button {
        background: var(--accent);
        border: 1px solid var(--accent);
        color: #fff;
        cursor: pointer;
        font-weight: 700;
        min-height: 44px;
        padding: 0 16px;
      }
      button:hover { background: var(--accent-dark); }
      button.secondary {
        background: #fff;
        border-color: var(--line);
        color: var(--accent-dark);
      }
      .big-submit {
        display: block;
        font-size: 22px;
        min-height: 74px;
        width: 100%;
      }
      .question-header {
        align-items: start;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 16px;
        justify-content: space-between;
        margin-bottom: 16px;
        padding-bottom: 14px;
      }
      .question-meta {
        color: var(--muted);
        font-size: 13px;
        margin-top: 6px;
      }
      .question-body {
        font-size: 15px;
        line-height: 1.6;
        overflow-wrap: anywhere;
      }
      .answer-panel {
        display: grid;
        gap: 14px;
        margin-top: 16px;
      }
      .choice-list, .assess-list {
        display: grid;
        gap: 10px;
      }
      .choice-list.compact {
        display: flex;
        flex-wrap: wrap;
      }
      .choice, .assess-item {
        align-items: start;
        background: var(--panel-soft);
        border: 1px solid var(--line);
        border-radius: 8px;
        display: grid;
        gap: 10px;
        grid-template-columns: 22px 1fr;
        padding: 10px 12px;
      }
      .choice-letter {
        align-items: center;
        grid-template-columns: 22px auto;
        min-width: 74px;
      }
      .choice-letter span {
        font-size: 18px;
        font-weight: 700;
      }
      .part-card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        display: grid;
        gap: 12px;
        margin-top: 14px;
        padding: 14px;
      }
      .part-card + .part-card {
        margin-top: 18px;
      }
      .part-header {
        align-items: center;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 12px;
        justify-content: space-between;
        padding-bottom: 10px;
      }
      .part-header strong {
        color: var(--accent-dark);
      }
      .part-body {
        display: grid;
        gap: 12px;
      }
      .inline-answer,
      .short-answer {
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--text);
        font: inherit;
      }
      .inline-answer {
        display: block;
        line-height: 1.45;
        margin: 8px 0;
        min-height: 76px;
        padding: 10px;
        resize: vertical;
        width: 100%;
      }
      .short-answer {
        display: inline-block;
        min-height: 34px;
        min-width: 150px;
        padding: 4px 8px;
      }
      .tick-choice-input {
        display: block;
        height: 18px;
        margin: 0 auto;
        width: 18px;
      }
      .mark-scheme {
        background: #fffdf5;
        border: 1px solid #e9dca8;
        border-radius: 8px;
        padding: 14px;
      }
      .answer-collapse {
        background: #fffdf5;
        border: 1px solid #e9dca8;
        border-radius: 8px;
        overflow: hidden;
      }
      .answer-collapse-toggle {
        align-items: center;
        background: transparent;
        border: 0;
        border-radius: 0;
        color: var(--accent-dark);
        cursor: pointer;
        display: flex;
        font-weight: 700;
        min-height: 0;
        justify-content: space-between;
        padding: 12px 14px;
        text-align: left;
        width: 100%;
      }
      .answer-collapse-toggle:hover {
        background: #fff8df;
      }
      .answer-collapse-toggle::after {
        content: "Hide";
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
      }
      .answer-collapse-toggle[data-collapsed="true"]::after {
        content: "Show";
      }
      .answer-collapse-body {
        border-top: 1px solid #e9dca8;
        display: grid;
        gap: 14px;
        padding: 14px;
      }
      .answer-collapse-body .mark-scheme {
        border: 0;
        padding: 0;
      }
      .inline-mark-point {
        align-items: center;
        display: inline-flex;
        gap: 6px;
        margin-right: 6px;
        vertical-align: baseline;
      }
      .inline-mark-point input {
        height: 15px;
        margin: 0;
        width: 15px;
      }
      .inline-mark-point-fallback {
        display: grid;
        gap: 6px;
        margin-top: 12px;
        padding: 0;
      }
      .assessment-score {
        color: var(--success);
        font-weight: 700;
      }
      .nav-row {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
      }
      .rtf-image { height: auto; max-width: 100%; object-fit: contain; }
      .rtf-image-block { display: block; margin: 8px auto; }
      .rtf-image-inline { display: inline-block; margin: 0 4px; max-height: 1.6em; vertical-align: middle; }
      .rtf-table-wrap { margin: 10px 0; max-width: 100%; overflow-x: auto; }
      .rtf-table { border-collapse: collapse; font-size: 13px; line-height: 1.35; max-width: 100%; width: 100%; }
      .rtf-table th, .rtf-table td {
        border: 1px solid var(--line);
        color: var(--text);
        padding: 6px 8px;
        text-align: center;
        vertical-align: middle;
      }
      .status { color: var(--muted); margin: 0; }
      .status.success { color: var(--success); }
      .status.warning { color: var(--warning); }
      @media (max-width: 760px) {
        .shell { padding: 12px; }
        .topbar, .question-header { display: grid; }
        .stats { grid-template-columns: 1fr; }
        .nav-row { display: grid; }
      }
    </style>
  </head>

\u003e(b)  A polonium-210 nucleus is formed when a stationary nucleus of bismuth-210 decays. A beta-minus (β\u003csup\u003e−\u003c/sup\u003e) particle is emitted in this decay.\u003cbr\u003e\nOutline, with reference to β\u003csup\u003e−\u003c/sup\u003e decay, why bismuth-210 and polonium-210 have different proton numbers.\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n\u003cstrong\u003e(2)\u003cbr\u003e\n\u003c/strong\u003eThe kinetic energies of β\u003csup\u003e−\u003c/sup\u003e particles emitted from a sample of bismuth-210 are analysed. These β\u003csup\u003e−\u003c/sup\u003e particles have a range of kinetic energies.\u003cbr\u003e\nThe total energy released when each nucleus of bismuth-210 decays to a nucleus of polonium-210 is 1.2 MeV.\u003cbr\u003e\n\u003cstrong\u003eFigure 1\u003c/strong\u003e shows the variation with \u003cem\u003eE\u003csub\u003ek\u003c/sub\u003e\u003c/em\u003e of the number of β\u003csup\u003e−\u003c/sup\u003e particles that have the kinetic energy \u003cem\u003eE\u003csub\u003ek\u003c/sub\u003e\u003c/em\u003e.\u003cbr\u003e\n\u003cstrong\u003eFigure 1\u003cbr\u003e\n\u003cimg class=\"rtf-image rtf-image-block\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAYABgAAD/7gAOQWRvYmUAZAAAAAAB/+ELvkV4aWYAAE1NACoAAAAIAAcBEgADAAAAAQABAAABGgAFAAAAAQAAAGIBGwAFAAAAAQAAAGoBKAADAAAAAQACAAABMQACAAAAIgAAAHIBMgACAAAAFAAAAJSHaQAEAAAAAQAAAKgAAADIAGAAAAABAAAAYAAAAAEAAEFkb2JlIFBob3Rvc2hvcCBDQyAyMDE1IChXaW5kb3dzKQAyMDIyOjA1OjE5IDIxOjU1OjE5AAACoAIABAAAAAEAAAGdoAMABAAAAAEAAAERAAAAAAAAAAYBAwADAAAAAQAGAAA no.\u003cbr\u003e\n\u003c/em\u003eThere is missing energy (When) a beta (particle) has less than 1.2 MeV (of kinetic energy).\u003cbr\u003e\nOr\u003cbr\u003e\nThe law of conservation of energy appears to be violated when beta (particle) has less than 1.2 MeV ✔\u003cbr\u003e\n\u003cem\u003eIdentify there is difference between 1.2 MeV and E\u003csub\u003ek\u003c/sub\u003e.\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e2\u003cbr\u003e\n\u003c/strong\u003e(d)     (It must be an electron antineutrino to) conserve lepton number✔\u003cbr\u003e\nAn electron and (electron) antineutrino have lepton numbers of opposite signs.\u003cbr\u003e\nOr\u003cbr\u003e\nAn electron and (electron) antineutrino have a (total) lepton number of zero. ✔\u003cbr\u003e\n\u003cem\u003eAlternative for 2\u003csup\u003end\u003c/sup\u003e Marking point:\u003cbr\u003e\nAppropriate particle equation seen annotated with correct lepton numbers.\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003eAlternative:\u003cbr\u003e\n\u003c/strong\u003eProducing an (electron) neutrino wouldn’t conserve lepton number✔\u003cbr\u003e\nAn electron and (electron) neutrino have lepton numbers of the same sign.\u003cbr\u003e\nOr\u003cbr\u003e\nAn electron and (electron) neutrino have a (total) lepton number equal to 2. ✔\u003cbr\u003e\n\u003cem\u003eAlternative 2\u003csup\u003end\u003c/sup\u003e marking point:\u003cbr\u003e\nAppropriate particle equation seen annotated with correct lepton numbers.\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e2\u003cbr\u003e\n\u003c/strong\u003e(e)     (\u003cstrong\u003eX\u003c/strong\u003e =) W-minus (boson) / W\u003csup\u003e–\u003c/sup\u003e (boson) ✔\u003cbr\u003e\n(\u003cstrong\u003eY\u003c/strong\u003e =) neutron / n ✔\u003cbr\u003e\n\u003cstrong\u003e2\u003cbr\u003e\n\u003c/strong\u003e(f)     Lepton (in the water molecule) is an electron ✔\u003cbr\u003e\n\u003cem\u003eMu 3e\u003cbr\u003e(c)  Explain how the data in \u003cstrong\u003eFigure 1\u003c/strong\u003e support the hypothesis that a third particle is produced during β\u003csup\u003e−\u003c/sup\u003e decay.\u003cbr\u003e\n\u003cspan class=\"answer-slot\" data-answer-index=\"0\" data-kind=\"long\" data-width=\"72\"\u003e\u003c/span\u003e\u003cstrong\u003e(2)\u003cbr\u003e\n\u003c/strong\u003e","markSchemeHtml":"(c)     (Missing) energy carried off by third particle\u003cbr\u003e\nOr\u003cbr\u003e\n(A third particle must be produced) for conservation of energy✔\u003cbr\u003e\n\u003cem\u003eAccept energy is converted into mass of third particle.\u003cbr\u003e\nWhere third particle is named must be a neutrino or an antineutrino.\u003cbr\u003e\n\u003c/em\u003eThere is missing energy (When) a beta (particle) has less than 1.2 MeV (of kinetic energy).\u003cbr\u003e\nOr\u003cbr\u003e\nThe law of conservation of energy appears to be violated when beta (particle) has less than 1.2 MeV ✔\u003cbr\u003e\n\u003cem\u003eIdentify there is difference between 1.2 MeV and E\u003csub\u003ek\u003c/sub\u003e.\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e2\u003cbr\u003e\n\u003c/strong\u003e","selfAssessItems":[{"id":"p-c-sa-1","part":"(c)","label":"(A third particle must be produced) for conservation of energy","value":1},{"id":"p-c-sa-2","part":"(c)","label":"The law of conservation of energy appears to be violated when beta (particle) has less than 1.2 MeV","value":1}]},{"id":"p-d","label":"(d)","marks":2,"questionHtml":"(d)  This third particle is an electron antineutrino.\u003cbr\u003e\nExplain why an electron antineutrino, rather than an electron neutrino, is produced during β\u003csup\u003e−\u003c/sup\u003e decay.\u003cbr\u003e\n\u003cspan class=\"answer-slot\" data-answer-index=\"0\" data-kind=\"long\" data-width=\"72\"\u003e\u003c/span\u003e\u003cstrong\u003e(2)\u003cbr\u003e\n\u003c/strong\u003e","markSchemeHtml":"(d)     (It must be an electron antineutrino to) conserve lepton number✔\u003cbr\u003e\nAn electron and (electron) antineutrino have lepton numbers of opposite signs.\u003cbr\u003e\nOr\u003cbr\u003e\nAn electron and (electron) antineutrino have a (total) lepton number of zero. ✔\u003cbr\u003e\n\u003cem\u003eAlternative for 2\u003csup\u003end\u003c/sup\u003e Marking point:\u003cbr\u003e\nAppropriate particle equation seen annotated with correct lepton numbers.\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003eAlternative:\u003cbr\u003e\n\u003c/strong\u003eProducing an (electron) neutrino wouldn’t conserve lepton number✔\u003cbr\u003e\nAn electron and (electron) neutrino have lepton numbers of the same sign.\u003cbr\u003e\nOr\u003cbr\u003e\nAn electron and (electron) neutrino have a (total) lepton number equal to 2. ✔\u003cbr\u003e\n\u003cem\u003eAlternative 2\u003csup\u003end\u003c/sup\u003e marking point:\u003cbr\u003e\nAppropriate particle equation seen annotated with correct lepton numbers.\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e2\u003cbr\u003e\n\u003c/strong\u003e","selfAssessItems":[{"id":"p-d-sa-1","part":"(d)","label":"(It must be an electron antineutrino to) conserve lepton number","value":1},{"id":"p-d-sa-2","part":"(d)","label":"An electron and (electron) antineutrino have a (total) lepton number of zero.","value":1},{"id":"p-d-sa-3","part":"(d)","label":"Producing an (electron) neutrino wouldn’t conserve lepton number","value":1},{"id":"p-d-sa-4","part":"(d)","label":"An electron and (electron) neutrino have a (total) lepton number equal to 2.","value":1}]},{"id":"p-e","label":"(e)","marks":2,"questionHtml":"(e)  A large tank of water is used as part of an electron antineutrino detector. An electron antineutrino \u003cimg class=\"rtf-image rtf-image-inline\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAYABgAAD/7gAOQWRvYmUAZAAAAAAB/+ED1EV4aWYAAE1NACoAAAAIAAcBEgADAAAAAQABAAABGgAFAAAAAQAAAGIBGwAFAAAAAQAAAGoBKAAD h:269px;height:auto\" alt=\"\"\u003e\u003cbr\u003e\n\u003c/strong\u003eThe angle of incidence is changed so that the angle of refraction of the green light ray at the glass-liquid interface is again 90°. The angle of incidence is now 58°.\u003cbr\u003e\nCalculate the refractive index of the liquid.\u003cbr\u003e\nrefractive index = ____________________\u003cbr\u003e\n\u003cstrong\u003e(2)\u003cbr\u003e\n\u003c/strong\u003e(c)     The source of green light is changed for one that contains only red and blue light. For any material red light has a lower refractive index than green light, and blue light has a higher refractive index than green light. The angle of incidence at the glass-liquid interface remains at 58°.\u003cbr\u003e\nDescribe and explain the paths followed by the red and blue rays immediately after the light is incident on the glass-liquid interface.\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n\u003cstrong\u003e(3)\u003cbr\u003e\n(Total 6 marks)\u003cbr\u003e\u003c/strong\u003e","markSchemeHtml":"(a)     \u003cem\u003ei\u003c/em\u003e = sin\u003csup\u003e–1\u003c/sup\u003e (1/1.6) = 39° ✔\u003cbr\u003e\n\u003cstrong\u003e1\u003cbr\u003e\n\u003c/strong\u003e(b)     sin 58 = n/1.6 ✔\u003cbr\u003e\n\u003cem\u003en\u003c/em\u003e = 1.4 (1.36) ✔\u003cbr\u003e\n\u003cstrong\u003e1\u003cbr\u003e\n1\u003cbr\u003e\n\u003c/strong\u003e(c)     blue light undergoes TIR ✔\u003cbr\u003e\nred light refracted ✔\u003cbr\u003e\nreason i.e. critical angle for red light is more OR critical angle for blue light is less ✔\u003cbr\u003e\n\u003cem\u003eAllow correct description of refraction. Ignore statements about towards/away from normal\u003cbr\u003e\n\u003c/em\u003eOR\u003cbr\u003e\nif refractive indices change by same factor ✔\u003cbr\u003e\ncritical angle stays constant ✔\u003cbr\u003e\nso path followed by red and blue light is the same ✔\u003cbr\u003e\nOR\u003cbr\u003e\ndon’t know if refractive indices change by same factor ✔\u003cbr\u003e\nso can’t predict the effect on critical angle ✔\u003cbr\u003e\nso can’t predict paths of red and blue light ✔\u003cbr\u003e\n\u003cem\u003eFor second two alternatives third mark (i.e. about paths of red and blue) dependent on first mark (i.e. factor of refractive index change)\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e1\u003cbr\u003e\n1\u003cbr\u003e\n1\u003cbr\u003e\n[6]\u003cbr\u003e\u003c/strong\u003e","answerMode":"structured","options":[],"correctOption":"","introHtml":"Figure 1 shows a ray of monochromatic green light incident normally on the curved surface of a semicircular glass block.\u003cbr\u003e\n\u003cstrong\u003eFigure 1\u003cbr\u003e\n\u003cimg class=\"rtf-image rtf-image-block\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAAAAAAAD/4QBiRXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAA5KGAAcAAAAWAAAARKACAAQAAAABAAABDKADAAQAAAABAAAAcwAAAABTAGMAcgBlAGUAbgBzAGgAbwB0AAAA/9sAQwABAQEBAQECAQECAwICAgMEAwMDAwQFBAQEBAQFBgUFBQUFBQYGBgYGBgYGBwcHBwcHCAgICAgJCQkJCQkJCQkJ/9sAQwEBAQECAgIEAgIECQYFBgkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJ/8AAEQgAcwEMAwEiAAIRAQMRAf/EAB8AAAEFAQEBAQEBAAAAAAAAAAABAgMEBQYHCAkKC//EALUQAAIBAwMCBAMFBQQEAAABfQECAwAEEQUSITFBBhNRYQcicRQygZGhCCNCscEVUtHwJDNicoIJChYXGBkaJSYnKCkqNDU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6g4SFhoeIiYqSk5SVlpeYmZqio6Slpqeoqaqys7S1tre4ubrCw8TFxsfIycrS09TV1tfY2drh4uPk5ebn6Onq8fLz9PX29/j5+v/EAB8BAAMBAQEBAQEBAQEAAAAAAAABAgMEBQYHCAkKC tive index than green light. The angle of incidence at the glass-liquid interface remains at 58°.\u003cbr\u003e\nDescribe and explain the paths followed by the red and blue rays immediately after the light is incident on the glass-liquid interface.\u003cbr\u003e\n\u003cspan class=\"answer-slot\" data-answer-index=\"0\" data-kind=\"long\" data-width=\"72\"\u003e\u003c/span\u003e\u003cstrong\u003e(3)\u003cbr\u003e\u003c/strong\u003e","markSchemeHtml":"(c)     blue light undergoes TIR ✔\u003cbr\u003e\nred light refracted ✔\u003cbr\u003e\nreason i.e. critical angle for red light is more OR critical angle for blue light is less ✔\u003cbr\u003e\n\u003cem\u003eAllow correct description of refraction. Ignore statements about towards/away from normal\u003cbr\u003e\n\u003c/em\u003eOR\u003cbr\u003e\nif refractive indices change by same factor ✔\u003cbr\u003e\ncritical angle stays constant ✔\u003cbr\u003e\nso path followed by red and blue light is the same ✔\u003cbr\u003e\nOR\u003cbr\u003e\ndon’t know if refractive indices change by same factor ✔\u003cbr\u003e\nso can’t predict the effect on critical angle ✔\u003cbr\u003e\nso can’t predict paths of red and blue light ✔\u003cbr\u003e\n\u003cem\u003eFor second two alternatives third mark (i.e. about paths of red and blue) dependent on first mark (i.e. factor of refractive index change)\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e1\u003cbr\u003e\n1\u003cbr\u003e\n1\u003cbr\u003e\n[6]\u003cbr\u003e\u003c/strong\u003e","selfAssessItems":[{"id":"p-c-sa-1","part":"(c)","label":"blue light undergoes TIR","value":1},{"id":"p-c-sa-2","part":"(c)","label":"red light refracted","value":1},{"id":"p-c-sa-3","part":"(c)","label":"reason i.e. critical angle for red light is more OR critical angle for blue light is less","value":1},{"id":"p-c-sa-4","part":"(c)","label":"if refractive indices change by same factor","value":1},{"id":"p-c-sa-5","part":"(c)","label":"critical angle stays constant","value":1},{"id":"p-c-sa-6","part":"(c)","label":"so path followed by red and blue light is the same","value":1},{"id":"p-c-sa-7","part":"(c)","label":"don’t know if refractive indices change by same factor","value":1},{"id":"p-c-sa-8","part":"(c)","label":"so can’t predict the effect on critical angle","value":1},{"id":"p-c-sa-9","part":"(c)","label":"so can’t predict paths of red and blue light","value":1}]}],"selfAssessItems":[{"id":"sa-1","part":"(a)","label":"i = sin–1 (1/1.6) = 39°","value":1},{"id":"sa-2","part":"(b)","label":"sin 58 = n/1.6","value":1},{"id":"sa-3","part":"(b)","label":"n = 1.4 (1.36)","value":1},{"id":"sa-4","part":"(c)","label":"blue light undergoes TIR","value":1},{"id":"sa-5","part":"(c)","label":"red light refracted","value":1},{"id":"sa-6","part":"(c)","label":"reason i.e. critical angle for red light is more OR critical angle for blue light is less","value":1},{"id":"sa-7","part":"(c)","label":"if refractive indices change by same factor","value":1},{"id":"sa-8","part":"(c)","label":"critical angle stays constant","value":1},{"id":"sa-9","part":"(c)","label":"so path followed by red and blue light is the same","value":1},{"id":"sa-10","part":"(c)","label":"don’t know if refractive indices change by same factor","value":1},{"id":"sa-11","part":"(c)","label":"so can’t predict the effect on critical angle","value":1},{"id":"sa-12","part":"(c)","label":"so can’t predict paths of red and blue light","value":1}]}]};
      const state = {
        studentName: "",
        startedAt: "",
        currentIndex: 0,
        answers: {}
      };
      const app = document.getElementById("app");
      const studentLine = document.getElementById("studentLine");
      const globalScore = document.getElementById("globalScore");

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function currentQuestion() {
        return ASSIGNMENT.questions[state.currentIndex];
      }

      function currentAwardedMarks() {
        return ASSIGNMENT.questions.reduce((sum, question) => {
          return sum + Number(state.answers[question.questionId]?.awardedMarks || 0);
        }, 0);
      }

      function refreshGlobalScore() {
        if (globalScore) globalScore.textContent = `${currentAwardedMarks()}/${ASSIGNMENT.totalMarks}`;
        const questionTotalScore = document.getElementById("questionTotalScore");
        if (questionTotalScore) questionTotalScore.textContent = `${currentAwardedMarks()}/${ASSIGNMENT.totalMarks}`;
      }

      function ensureAnswer(question) {
        if (!state.answers[question.questionId]) {
          state.answers[question.questionId] = {
            studentAnswer: "",
            submitted: false,
            partAnswers: {},
            partSubmitted: {},
            partScores: {},
            checkedItems: {},
            awardedMarks: 0
          };
        }
        return state.answers[question.questionId];
      }

      function countAnswerSlots(part) {
        const indexes = [...String(part.questionHtml || "").matchAll(/data-answer-index="(\d+)"/g)].map((match) => Number(match[1]));
        return indexes.length ? Math.max(...indexes) + 1 : 1;
      }

      function ensurePartAnswer(answer, part) {
        if (!answer.partAnswers[part.id]) {
          answer.partAnswers[part.id] = Array.from({ length: countAnswerSlots(part) }, () => "");
        }
        return answer.partAnswers[part.id];
      }

      function questionComplete(question, answer) {
        if (question.answerMode === "multiple-choice") return answer.submitted;
        return (question.parts || []).every((part) => answer.partSubmitted[part.id]);
      }

      function hydratePartHtml(part, values, disabled) {
        const source = String(part.questionHtml || "");
        const disabledAttr = disabled ? "disabled" : "";
        if (!source.includes('class="answer-slot"')) {
          return `${source}<textarea class="inline-answer" data-answer-input-part="${escapeHtml(part.id)}" data-answer-input-index="0" ${disabledAttr}>${escapeHtml(values[0] || "")}</textarea>`;
        }
        return source.replace(
          /<span class="answer-slot" data-answer-index="(\d+)" data-kind="([^"]+)" data-width="([^"]+)"><\/span>/g,
          (_match, index, kind, width) => {
            const value = escapeHtml(values[Number(index)] || "");
            if (kind === "choice") {
              const checked = values[Number(index)] === String(width) ? "checked" : "";
              return `<input type="radio" class="tick-choice-input" name="answer-${escapeHtml(part.id)}-${index}" data-answer-input-part="${escapeHtml(part.id)}" data-answer-input-index="${index}" value="${escapeHtml(width)}" ${checked} ${disabledAttr}>`;
            }
            if (kind === "short") {
              return `<input class="short-answer" data-answer-input-part="${escapeHtml(part.id)}" data-answer-input-index="${index}" style="width:${Number(width) + 5}ch" value="${value}" ${disabledAttr}>`;
            }
            return `<textarea class="inline-answer" data-answer-input-part="${escapeHtml(part.id)}" data-answer-input-index="${index}" ${disabledAttr}>${value}</textarea>`;
          }
        );
      }

      function renderStart() {
        app.innerHTML = `
          <section class="card start-card">
            <h2>Start assignment</h2>
            <label>
              <span>Student name</span>
              <select id="studentName">
                <option value="">Choose your name</option>
                ${ASSIGNMENT.studentNames.map((name) => `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`).join("")}
              </select>
            </label>
            <button id="startButton" type="button">Start answering</button>
          </section>
        `;
        document.getElementById("startButton").addEventListener("click", () => {
          const name = document.getElementById("studentName").value;
          if (!name) return;
          state.studentName = name;
          state.startedAt = new Date().toISOString();
          studentLine.textContent = `${name} · started ${new Date(state.startedAt).toLocaleString()}`;
          renderQuestion();
        });
      }

      function answerInput(question, answer) {
        if (question.answerMode === "multiple-choice" && question.options.length) {
          return `
            <div class="choice-list compact">
              ${question.options.map((option) => `
                <label class="choice choice-letter">
                  <input type="radio" name="studentAnswer" value="${escapeHtml(option.label)}" ${answer.studentAnswer === option.label ? "checked" : ""} ${answer.submitted ? "disabled" : ""}>
                  <span>${escapeHtml(option.label)}</span>
                </label>
              `).join("")}
            </div>
          `;
        }
        return "";
      }

      function assessmentMarkup(question, answer) {
        if (!answer.submitted) return "";
        if (question.answerMode === "multiple-choice") {
          const isCorrect = answer.studentAnswer && answer.studentAnswer === question.correctOption;
          return `
            <section class="answer-collapse">
              <button class="answer-collapse-toggle" type="button" data-collapse-toggle data-label="answer">Answer</button>
              <div class="answer-collapse-body">
                <section class="mark-scheme">
                  <h3>Answer</h3>
                  <p class="assessment-score">${isCorrect ? "Correct" : "Not correct"}: ${escapeHtml(answer.studentAnswer || "No answer")} · Correct answer: ${escapeHtml(question.correctOption || "See mark scheme")} · Score: ${answer.awardedMarks} / ${question.marks}</p>
                  <div class="question-body">${question.markSchemeHtml}</div>
                </section>
              </div>
            </section>
          `;
        }
        return "";
      }

      function partAssessmentMarkup(part, answer) {
        if (!answer.partSubmitted[part.id]) return "";
        return `
          <section class="answer-collapse">
            <button class="answer-collapse-toggle" type="button" data-collapse-toggle data-label="answer ${escapeHtml(part.label)}">Answer ${escapeHtml(part.label)}</button>
            <div class="answer-collapse-body">
              <section class="mark-scheme">
                <h3>Mark scheme ${escapeHtml(part.label)}</h3>
                <p class="muted">Tick the boxes in the mark scheme. The score is capped at this part's marks.</p>
                <div class="question-body">${markSchemeWithInlineAssess(part, answer)}</div>
                <p class="assessment-score" id="assessmentScore-${escapeHtml(part.id)}">Score: ${answer.partScores[part.id] || 0} / ${part.marks || "?"}</p>
              </section>
            </div>
          </section>
        `;
      }

      function markSchemeWithInlineAssess(part, answer) {
        const items = part.selfAssessItems || [];
        let itemIndex = 0;
        const makeCheckbox = (item) => `
          <label class="inline-mark-point">
            <input type="checkbox" data-assess-part="${escapeHtml(part.id)}" data-assess-id="${escapeHtml(item.id)}" ${answer.checkedItems[item.id] ? "checked" : ""}>
          </label>`;
        const html = String(part.markSchemeHtml || "");
        const withTicks = html.replace(/(✓|✔|&#10003;|&#x2713;|&#10004;|&#x2714;)/g, (tick) => {
          const item = items[itemIndex] || {
            id: `${part.id}-inline-${itemIndex + 1}`,
            label: "Marking point",
            value: 1
          };
          itemIndex += 1;
          return tick + makeCheckbox(item);
        });
        if (itemIndex > 0) return withTicks;

        return `
          ${html}
          <div class="inline-mark-point-fallback">
            ${items.map((item) => `
              <label>
                <input type="checkbox" data-assess-part="${escapeHtml(part.id)}" data-assess-id="${escapeHtml(item.id)}" ${answer.checkedItems[item.id] ? "checked" : ""}>
                ${escapeHtml(item.label)} <em>(+${Number(item.value || 1)})</em>
              </label>
            `).join("")}
          </div>
        `;
      }

      function structuredQuestionMarkup(question, answer) {
        return `
          ${question.introHtml ? `<div class="question-body">${question.introHtml}</div>` : ""}
          ${(question.parts || []).map((part) => {
            const values = ensurePartAnswer(answer, part);
            const submitted = Boolean(answer.partSubmitted[part.id]);
            return `
              <section class="part-card">
                <div class="part-header">
                  <strong>${escapeHtml(part.label)}</strong>
                  <span class="muted">${part.marks || "?"} mark${Number(part.marks) === 1 ? "" : "s"}</span>
                </div>
                <div class="part-body">
                  <div class="question-body">${hydratePartHtml(part, values, submitted)}</div>
                  <button type="button" data-submit-part="${escapeHtml(part.id)}" ${submitted ? "hidden" : ""}>Submit ${escapeHtml(part.label)}</button>
                  ${partAssessmentMarkup(part, answer)}
                </div>
              </section>
            `;
          }).join("")}
        `;
      }

      function collectPartAnswer(part, answer) {
        const inputs = [...document.querySelectorAll(`[data-answer-input-part="${part.id}"]`)];
        const values = [];
        inputs
          .sort((a, b) => Number(a.dataset.answerInputIndex) - Number(b.dataset.answerInputIndex))
          .forEach((input) => {
            const index = Number(input.dataset.answerInputIndex);
            if (input.type === "radio") {
              if (input.checked) values[index] = input.value.trim();
              else if (values[index] === undefined) values[index] = "";
              return;
            }
            values[index] = input.value.trim();
          });
        answer.partAnswers[part.id] = values;
      }

      function updateQuestionAwardedMarks(question, answer) {
        if (question.answerMode === "multiple-choice") {
          answer.awardedMarks = answer.studentAnswer === question.correctOption ? Number(question.marks || 0) : 0;
          refreshGlobalScore();
          return;
        }
        answer.awardedMarks = (question.parts || []).reduce((sum, part) => sum + Number(answer.partScores[part.id] || 0), 0);
        refreshGlobalScore();
      }

      function renderQuestion() {
        const question = currentQuestion();
        const answer = ensureAnswer(question);
        app.innerHTML = `
          <article class="card">
            <div class="question-header">
              <div>
                <h2>${state.currentIndex + 1}. ${escapeHtml(question.questionId)}</h2>
                <div class="question-meta">${escapeHtml(question.datasetLabel)} · ${escapeHtml(question.series)} · ${escapeHtml(question.questionType)}</div>
              </div>
              <div class="stats question-stats">
                <div><strong>${question.marks}</strong><span>Marks</span></div>
                <div><strong>${question.timeMinutes}</strong><span>Minutes</span></div>
                <div><strong id="questionTotalScore">${currentAwardedMarks()}/${ASSIGNMENT.totalMarks}</strong><span>Total marks</span></div>
              </div>
            </div>
            ${question.answerMode === "structured" ? structuredQuestionMarkup(question, answer) : `<div class="question-body">${question.questionHtml}</div>`}
          </article>
          <section class="answer-panel">
            ${question.answerMode === "multiple-choice" ? `<h3>Your answer</h3>${answerInput(question, answer)}<button id="submitQuestion" type="button" ${answer.submitted ? "hidden" : ""}>Submit</button>` : `<h3>Your progress</h3><p class="muted">Submit each part to reveal its mark scheme, then self assess that part.</p>`}
            ${assessmentMarkup(question, answer)}
            <div class="nav-row">
              <button class="secondary" id="previousQuestion" type="button" ${state.currentIndex === 0 ? "disabled" : ""}>Previous</button>
              <button id="nextQuestion" type="button" ${questionComplete(question, answer) ? "" : "disabled"}>${state.currentIndex === ASSIGNMENT.questions.length - 1 ? "Finish assignment" : "Next question"}</button>
            </div>
          </section>
        `;

        const submitButton = document.getElementById("submitQuestion");
        if (submitButton) {
          submitButton.addEventListener("click", () => {
            if (question.answerMode === "multiple-choice") {
              const checked = document.querySelector("input[name='studentAnswer']:checked");
              answer.studentAnswer = checked ? checked.value : "";
              updateQuestionAwardedMarks(question, answer);
            }
            answer.submitted = true;
            renderQuestion();
          });
        }

        document.querySelectorAll("[data-submit-part]").forEach((button) => {
          button.addEventListener("click", () => {
            const part = (question.parts || []).find((item) => item.id === button.dataset.submitPart);
            if (!part) return;
            collectPartAnswer(part, answer);
            answer.partSubmitted[part.id] = true;
            updateQuestionAwardedMarks(question, answer);
            renderQuestion();
          });
        });

        document.querySelectorAll("[data-assess-id]").forEach((checkbox) => {
          checkbox.addEventListener("change", () => {
            answer.checkedItems[checkbox.dataset.assessId] = checkbox.checked;
            updateScore(question, answer, checkbox.dataset.assessPart);
          });
        });

        document.querySelectorAll("[data-collapse-toggle]").forEach((button) => {
          button.addEventListener("click", () => {
            const body = button.nextElementSibling;
            if (!body) return;
            body.hidden = !body.hidden;
            button.dataset.collapsed = body.hidden ? "true" : "false";
            const label = button.dataset.label || "answer";
            button.textContent = label.charAt(0).toUpperCase() + label.slice(1);
          });
        });

        document.getElementById("previousQuestion").addEventListener("click", () => {
          if (state.currentIndex > 0) {
            state.currentIndex -= 1;
            renderQuestion();
          }
        });

        document.getElementById("nextQuestion").addEventListener("click", () => {
          if (!questionComplete(question, answer)) return;
          if (state.currentIndex === ASSIGNMENT.questions.length - 1) renderFinal();
          else {
            state.currentIndex += 1;
            renderQuestion();
          }
        });
      }

      function updateScore(question, answer, partId) {
        const part = (question.parts || []).find((item) => item.id === partId);
        if (!part) return;
        const score = part.selfAssessItems.reduce((sum, item) => {
          return sum + (answer.checkedItems[item.id] ? Number(item.value || 1) : 0);
        }, 0);
        answer.partScores[part.id] = Math.min(Number(part.marks || question.marks || 0), score);
        updateQuestionAwardedMarks(question, answer);
        const scoreElement = document.getElementById(`assessmentScore-${part.id}`);
        if (scoreElement) scoreElement.textContent = `Score: ${answer.partScores[part.id]} / ${part.marks || "?"}`;
      }

      function buildPayload() {
        const questions = ASSIGNMENT.questions.map((question) => {
          const answer = ensureAnswer(question);
          const parts = (question.parts || []).map((part) => ({
            id: part.id,
            label: part.label,
            marks: part.marks,
            studentAnswer: answer.partAnswers[part.id] || [],
            submitted: Boolean(answer.partSubmitted[part.id]),
            selfAssessItems: part.selfAssessItems.map((item) => ({
              id: item.id,
              label: item.label,
              value: item.value,
              checked: Boolean(answer.checkedItems[item.id])
            })),
            awardedMarks: Number(answer.partScores[part.id] || 0)
          }));
          return {
            questionId: question.questionId,
            marks: question.marks,
            timeMinutes: question.timeMinutes,
            answerMode: question.answerMode,
            studentAnswer: answer.studentAnswer,
            correctOption: question.correctOption || "",
            parts,
            awardedMarks: Number(answer.awardedMarks || 0)
          };
        });
        const awardedMarks = questions.reduce((sum, question) => sum + Number(question.awardedMarks || 0), 0);
        const submittedAt = new Date().toISOString();
        return {
          submissionId: `${ASSIGNMENT.assignmentId}-${state.studentName}-${Date.now().toString(36)}`,
          assignmentId: ASSIGNMENT.assignmentId,
          assignmentTitle: ASSIGNMENT.assignmentTitle,
          studentName: state.studentName,
          startedAt: state.startedAt,
          submittedAt,
          durationSeconds: Math.round((new Date(submittedAt).getTime() - new Date(state.startedAt).getTime()) / 1000),
          totalMarks: ASSIGNMENT.totalMarks,
          awardedMarks,
          questions
        };
      }

      function renderFinal() {
        const payload = buildPayload();
        app.innerHTML = `
          <section class="final-panel">
            <h2>Assignment complete</h2>
            <p>Your recorded score is <strong>${payload.awardedMarks} / ${payload.totalMarks}</strong>.</p>
            <button class="big-submit" id="submitToTeacher" type="button">Submit to teacher</button>
            <p class="status" id="submitStatus"></p>
          </section>
        `;
        document.getElementById("submitToTeacher").addEventListener("click", () => submitToTeacher(buildPayload()));
      }

      function submitToTeacher(payload) {
        const status = document.getElementById("submitStatus");
        if (!ASSIGNMENT.appsScriptUrl) {
          downloadJson(payload);
          status.textContent = "No Apps Script URL was configured. Submission JSON downloaded instead.";
          status.className = "status warning";
          return;
        }

        const form = document.createElement("form");
        form.method = "POST";
        form.action = ASSIGNMENT.appsScriptUrl;
        form.target = "submitFrame";
        form.hidden = true;

        const input = document.createElement("textarea");
        input.name = "payload";
        input.value = JSON.stringify(payload);
        form.append(input);
        document.body.append(form);

        const frame = document.getElementById("submitFrame");
        frame.addEventListener("load", () => {
          status.textContent = "Submitted. Your teacher will see the JSON file in Drive and the score row in Google Sheets.";
          status.className = "status success";
          form.remove();
        }, { once: true });

        status.textContent = "Submitting...";
        form.submit();
      }

      function downloadJson(payload) {
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `${ASSIGNMENT.assignmentId}-${state.studentName || "student"}-submission.json`;
        document.body.append(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      }

      renderStart();
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Friday 2 Homework</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f6f8;
        --panel: #ffffff;
        --panel-soft: #f8fafc;
        --text: #17202a;
        --muted: #617085;
        --line: #d8e0e8;
        --accent: #256f9d;
        --accent-dark: #184f74;
        --success: #147a4a;
        --warning: #9a5b00;
        --shadow: 0 12px 32px rgba(24, 42, 63, 0.12);
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
      }
      .shell {
        margin: 0 auto;
        max-width: 1040px;
        min-height: 100vh;
        padding: 24px;
      }
      .topbar, .card, .answer-panel, .final-panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }
      .topbar {
        align-items: center;
        display: flex;
        gap: 20px;
        justify-content: space-between;
        margin-bottom: 16px;
        padding: 18px 22px;
      }
      h1, h2, h3 { margin: 0; }
      h1 { font-size: 26px; line-height: 1.15; }
      h2 { font-size: 22px; line-height: 1.2; }
      h3 { color: var(--accent-dark); font-size: 15px; margin-bottom: 8px; }
      p { line-height: 1.55; }
      .stats {
        display: grid;
        gap: 8px;
        grid-template-columns: repeat(3, minmax(86px, 1fr));
      }
      .question-stats {
        grid-template-columns: repeat(3, minmax(86px, 1fr));
      }
      .stats div {
        background: var(--panel-soft);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 9px 11px;
        text-align: right;
      }
      .stats strong { display: block; font-size: 20px; }
      .stats span, .muted { color: var(--muted); font-size: 13px; }
      .card, .answer-panel, .final-panel { padding: 18px; }
      .start-card {
        display: grid;
        gap: 14px;
        margin-top: 24px;
      }
      label { display: grid; gap: 7px; }
      label span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
      }
      select, textarea, button {
        border-radius: 6px;
        font-family: inherit;
        font-size: 15px;
      }
      select, textarea {
        background: #fff;
        border: 1px solid var(--line);
        color: var(--text);
        width: 100%;
      }
      select { min-height: 42px; padding: 0 10px; }
      textarea {
        line-height: 1.5;
        min-height: 150px;
        padding: 12px;
        resize: vertical;
      }
      button {
        background: var(--accent);
        border: 1px solid var(--accent);
        color: #fff;
        cursor: pointer;
        font-weight: 700;
        min-height: 44px;
        padding: 0 16px;
      }
      button:hover { background: var(--accent-dark); }
      button.secondary {
        background: #fff;
        border-color: var(--line);
        color: var(--accent-dark);
      }
      .big-submit {
        display: block;
        font-size: 22px;
        min-height: 74px;
        width: 100%;
      }
      .question-header {
        align-items: start;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 16px;
        justify-content: space-between;
        margin-bottom: 16px;
        padding-bottom: 14px;
      }
      .question-meta {
        color: var(--muted);
        font-size: 13px;
        margin-top: 6px;
      }
      .question-body {
        font-size: 15px;
        line-height: 1.6;
        overflow-wrap: anywhere;
      }
      .answer-panel {
        display: grid;
        gap: 14px;
        margin-top: 16px;
      }
      .choice-list, .assess-list {
        display: grid;
        gap: 10px;
      }
      .choice-list.compact {
        display: flex;
        flex-wrap: wrap;
      }
      .choice, .assess-item {
        align-items: start;
        background: var(--panel-soft);
        border: 1px solid var(--line);
        border-radius: 8px;
        display: grid;
        gap: 10px;
        grid-template-columns: 22px 1fr;
        padding: 10px 12px;
      }
      .choice-letter {
        align-items: center;
        grid-template-columns: 22px auto;
        min-width: 74px;
      }
      .choice-letter span {
        font-size: 18px;
        font-weight: 700;
      }
      .part-card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        display: grid;
        gap: 12px;
        margin-top: 14px;
        padding: 14px;
      }
      .part-card + .part-card {
        margin-top: 18px;
      }
      .part-header {
        align-items: center;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 12px;
        justify-content: space-between;
        padding-bottom: 10px;
      }
      .part-header strong {
        color: var(--accent-dark);
      }
      .part-body {
        display: grid;
        gap: 12px;
      }
      .inline-answer,
      .short-answer {
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--text);
        font: inherit;
      }
      .inline-answer {
        display: block;
        line-height: 1.45;
        margin: 8px 0;
        min-height: 76px;
        padding: 10px;
        resize: vertical;
        width: 100%;
      }
      .short-answer {
        display: inline-block;
        min-height: 34px;
        min-width: 150px;
        padding: 4px 8px;
      }
      .tick-choice-input {
        display: block;
        height: 18px;
        margin: 0 auto;
        width: 18px;
      }
      .mark-scheme {
        background: #fffdf5;
        border: 1px solid #e9dca8;
        border-radius: 8px;
        padding: 14px;
      }
      .answer-collapse {
        background: #fffdf5;
        border: 1px solid #e9dca8;
        border-radius: 8px;
        overflow: hidden;
      }
      .answer-collapse-toggle {
        align-items: center;
        background: transparent;
        border: 0;
        border-radius: 0;
        color: var(--accent-dark);
        cursor: pointer;
        display: flex;
        font-weight: 700;
        min-height: 0;
        justify-content: space-between;
        padding: 12px 14px;
        text-align: left;
        width: 100%;
      }
      .answer-collapse-toggle:hover {
        background: #fff8df;
      }
      .answer-collapse-toggle::after {
        content: "Hide";
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
      }
      .answer-collapse-toggle[data-collapsed="true"]::after {
        content: "Show";
      }
      .answer-collapse-body {
        border-top: 1px solid #e9dca8;
        display: grid;
        gap: 14px;
        padding: 14px;
      }
      .answer-collapse-body .mark-scheme {
        border: 0;
        padding: 0;
      }
      .inline-mark-point {
        align-items: center;
        display: inline-flex;
        gap: 6px;
        margin-right: 6px;
        vertical-align: baseline;
      }
      .inline-mark-point input {
        height: 15px;
        margin: 0;
        width: 15px;
      }
      .inline-mark-point-fallback {
        display: grid;
        gap: 6px;
        margin-top: 12px;
        padding: 0;
      }
      .assessment-score {
        color: var(--success);
        font-weight: 700;
      }
      .nav-row {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
      }
      .rtf-image { height: auto; max-width: 100%; object-fit: contain; }
      .rtf-image-block { display: block; margin: 8px auto; }
      .rtf-image-inline { display: inline-block; margin: 0 4px; max-height: 1.6em; vertical-align: middle; }
      .rtf-table-wrap { margin: 10px 0; max-width: 100%; overflow-x: auto; }
      .rtf-table { border-collapse: collapse; font-size: 13px; line-height: 1.35; max-width: 100%; width: 100%; }
      .rtf-table th, .rtf-table td {
        border: 1px solid var(--line);
        color: var(--text);
        padding: 6px 8px;
        text-align: center;
        vertical-align: middle;
      }
      .status { color: var(--muted); margin: 0; }
      .status.success { color: var(--success); }
      .status.warning { color: var(--warning); }
      @media (max-width: 760px) {
        .shell { padding: 12px; }
        .topbar, .question-header { display: grid; }
        .stats { grid-template-columns: 1fr; }
        .nav-row { display: grid; }
      }
    </style>
  </head>

orter sides.\u003cbr\u003e\nAssume that the refractive index is 1.5 and the critical angle is 41.5°.\u003cbr\u003e\nShow that \u003cem\u003eθ\u003c/em\u003e is about 5°.\u003cbr\u003e\nYou can use \u003cstrong\u003eFigure 2\u003c/strong\u003e in your answer.\u003cbr\u003e\n\u003cstrong\u003e(4)\u003cbr\u003e\n\u003c/strong\u003e(e)  A manufacturer wants to make a prism with a larger value of \u003cem\u003eθ\u003c/em\u003e.\u003cbr\u003e\nTwo alternative changes to the original design of the prism are suggested:\u003cbr\u003e\n1.   use a prism of the original glass in the shape of an equilateral triangle, as shown in \u003cstrong\u003eFigure 3\u003cbr\u003e\n\u003c/strong\u003e2.   use a prism of the original shape made from glass with a smaller refractive index, as shown in \u003cstrong\u003eFigure 4\u003c/strong\u003e.\u003cbr\u003e\n \u003cbr\u003e\n\n\u003cdiv class=\"rtf-table-wrap\"\u003e\u003ctable class=\"rtf-table\"\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eFigure 3\n\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003eFigure 4\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cimg class=\"rtf-image rtf-image-block\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAYABgAAD/7gAOQWRvYmUAZAAAAAAB/+ENAEV4aWYAAE1NACoAAAAIAAcBEgADAAAAAQABAAABGgAFAAAAAQAAAGIBGwAFAAAAAQAAAGoBKAADAAAAAQACAAABMQACAAAAHAAAAHIBMgACAAAAFAAAAI6HaQAEAAAAAQAAAKIAAADCAGAAAAABAAAAYAAAAAEAAEFkb2JlIFBob3Rvc2hvcCBDUzUgV2luZG93cwAyMDIzOjEyOjE4IDE3OjAxOjU3AAACoAIABAAAAAEAAAChoAMABAAAAAEAAACOAAAAAAAAAAYBAwADAAAAAQAGAAABGgAFAAAAAQAAARABGwAFAAAAAQAAARgBKAADAAAAAQACAAACAQAEAAAAAQAAASACAgAEAAAAAQAAC9gAAAAAAAAASAAAAAEAAABIAAAAAf/Y/+0ADEFkb2JlX0NNAAH/7gAOQWRvYmUAZIAAAAAB/9sAhAAMCAgICQgMCQkMEQsKCxEVDwwMDxUYExMVExMYEQwMDAwMDBEMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMAQ0LCw0ODRAODhAUDg4OFBQODg4OFBEMDAwMDBERDAwMDAwMEQwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAz/wAARCACNAKADASIAAhEBAxEB/90ABAAK/8QBPwAAAQUBAQEBAQEAAAAAAAAAAwABAgQFBgcICQoLAQABBQEBAQEBAQAAAAAAAAABAAIDBAUGBwgJCgsQAAEEAQMCBAI ll’s law to give 5.3° to at least 2 sf ✔\u003cbr\u003e\n\u003cem\u003eAccept answer that rounds to 5.3°\u003cbr\u003e\nThe identification of their angles can be inferred from their working or diagram. Simply writing 90° - 41.5° = 48.5° does not get a mark on its own.\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e4\u003cbr\u003e\n\u003c/strong\u003e(e)     Using 60° prism (Fig 3) does not work because:\u003cbr\u003e\n•   light would not leave the prism at the original angle ✔\u003cbr\u003e\n•   idea that light will escape from second reflection ✔\u003cbr\u003e\nA smaller \u003cem\u003en\u003c/em\u003e (Fig 4) does not work because:\u003cbr\u003e\n•   larger critical angle ✔\u003cbr\u003e\n•   which would reduce the value of \u003cem\u003eθ\u003c/em\u003e ✔\u003cbr\u003e\n\u003cem\u003eSuggestion that the design would work limits the mark to Max 1 for that design.\u003cbr\u003e\nAlternative for MP2\u003cbr\u003e\nLight would no longer be totally internally reflected at second reflection\u003cbr\u003e\nOR\u003cbr\u003e\nangle of incidence at second reflection is now less than the critical angle\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e4\u003cbr\u003e\n[14]\u003cbr\u003e\u003c/strong\u003e","answerMode":"structured","options":[],"correctOption":"","introHtml":"Porro prisms are used in binoculars to reverse the path of the light. The prism is in the shape of a right-angled isosceles triangle.\u003cbr\u003e\n\u003cstrong\u003eFigure 1\u003c/strong\u003e shows a ray of light, at normal incidence on the longest side, passing through a glass Porro prism.\u003cbr\u003e\n\u003cstrong\u003eFigure 1\u003cbr\u003e\n\u003cimg class=\"rtf-image rtf-image-block\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAYABgAAD/7gAOQWRvYmUAZAAAAAAB/+EMCkV4aWYAAE1NACoAAAAIAAcBEgADAAAAAQABAAABGgAFAAAAAQAAAGIBGwAFAAAAAQAAAGoBKAADAAAAAQACAAABMQACAAAAHAAAAHIBMgACAAAAFAAAAI6HaQAEAAAAAQAAAKIAAADCAGAAAAABAAAAYAAAAAEAA angle at 2\u003csup\u003end\u003c/sup\u003e reflecting boundary)\u003cbr\u003e\n\u003c/em\u003eUse of \u003cem\u003en\u003c/em\u003e = 1.5 and Snell’s law to give 5.3° to at least 2 sf ✔\u003cbr\u003e\n\u003cem\u003eAccept answer that rounds to 5.3°\u003cbr\u003e\nThe identification of their angles can be inferred from their working or diagram. Simply writing 90° - 41.5° = 48.5° does not get a mark on its own.\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e4\u003cbr\u003e\n\u003c/strong\u003e","selfAssessItems":[{"id":"p-d-sa-1","part":"(d)","label":"Angle of incidence at 2nd reflecting boundary = 41.5°","value":1},{"id":"p-d-sa-2","part":"(d)","label":"Angle of reflection at 1st reflecting boundary = 48.5°","value":1},{"id":"p-d-sa-3","part":"(d)","label":"Angle of refraction at entry = (90° - 45° - 41.5°) = 3.5°","value":1}]},{"id":"p-e","label":"(e)","marks":4,"questionHtml":"(e)  A manufacturer wants to make a prism with a larger value of \u003cem\u003eθ\u003c/em\u003e.\u003cbr\u003e\nTwo alternative changes to the original design of the prism are suggested:\u003cbr\u003e\n1.   use a prism of the original glass in the shape of an equilateral triangle, as shown in \u003cstrong\u003eFigure 3\u003cbr\u003e\n\u003c/strong\u003e2.   use a prism of the original shape made from glass with a smaller refractive index, as shown in \u003cstrong\u003eFigure 4\u003c/strong\u003e.\u003cbr\u003e\n \u003cbr\u003e\n\n\u003cdiv class=\"rtf-table-wrap\"\u003e\u003ctable class=\"rtf-table\"\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eFigure 3\n\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003eFigure 4\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cimg class=\"rtf-image rtf-image-block\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAYABgAAD/7gAOQWRvYmUAZAAAAAAB/+ENAEV4aWYAAE1NACoAAAAIAAcBEgADAAAAAQABAAABGgAFAAAAAQAAAGIBGwAFAAAAAQAAAGoBKAADAAAAAQACAAABMQACAAAAHAAAAHIBMgACAAAAFAAAAI6HaQAEAAAAAQAAAKIAAADCAGA e=\"width:430px;height:auto\" alt=\"\"\u003e\u003cbr\u003e\n\u003c/strong\u003eThe wavelength of the red light is 650 nm.\u003cbr\u003e\nCalculate the angle \u003cem\u003eθ\u003c/em\u003e between a first-order maximum and the central maximum.\u003cbr\u003e\n\u003cem\u003eθ\u003c/em\u003e ____________________ degrees\u003cbr\u003e\n\u003cstrong\u003e(2)\u003cbr\u003e\n\u003c/strong\u003e(d)  In practice, the filter transmits red light with wavelengths in the range 600 nm to 700 nm.\u003cbr\u003e\nSuggest how this affects the appearance of the maxima.\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n\u003cstrong\u003e(2)\u003cbr\u003e\n(Total 8 marks)\u003cbr\u003e\u003c/strong\u003e","markSchemeHtml":"(a)  Central maximum with lower intensity maxima (either side) ✔\u003cbr\u003e\n\u003cem\u003eMP1 is for comparison of intensity. Condone references to brightness/dimness.\u003cbr\u003e\n\u003c/em\u003eCentral maximum is twice as wide/wider than other maxima ✔\u003cbr\u003e\n\u003cem\u003eMP2 is for comparison of width\u003cbr\u003e\nAward credit for a drawn answer eg on Fig 1.\u003cbr\u003e\nSuggestion that pattern due to white light = max 1\u003cbr\u003e\nReference to Young’s slit or equation = max 1\u003cbr\u003e\nIf only a single maximum is referred to MP2=0 but MP1 can score for description of intensity variation.\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e2\u003cbr\u003e\n\u003c/strong\u003e(b)  Wider (central) maxima (maximum) ✔\u003cbr\u003e\n\u003cem\u003e‘The pattern is wider/more spread out’ gets 1 mark if no other marks given.\u003cbr\u003e\nNot “larger pattern”.\u003cbr\u003e\n\u003c/em\u003e(Subsequent) maxima further apart ✔\u003cbr\u003e\n\u003cem\u003eCondone “larger” distances between maxima.\u003cbr\u003e\nCondone ‘maxima more spaced out’\u003cbr\u003e\nReference to Young’s slit or equation = max 1\u003cbr\u003e\nIgnore comments related to change in wavelength\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e2\u003cbr\u003e\n\u003c/strong\u003e(c)  \u003cem\u003ed\u003c/em\u003e = 1 × 10\u003csup\u003e–3\u003c/sup\u003e/500 (= 2 × 10\u003csup\u003e–6\u003c/sup\u003e) ✔\u003cbr\u003e\n\u003cem\u003eAllow POT error for d for MP1\u003cbr\u003e\n\u003c/em\u003e(sin \u003cem\u003eθ = nλ/d\u003c/em\u003e = 6.5 × 10\u003csup\u003e–7\u003c/sup\u003e / 2 × 10\u003csup\u003e–6\u003c/sup\u003e = 0.33)\u003cbr\u003e\nθ = 19° ✔\u003cbr\u003e\n\u003cem\u003eMay be seen in diffraction grating equation.\u003cbr\u003e\nAllow max 1 for use of grating constant rather than d to give 7.45 × 10\u003csup\u003e–11\u003c/sup\u003e° if no other credit available.\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e2\u003cbr\u003e\n\u003c/strong\u003e(d)  Any two from: ✔ ✔\u003cbr\u003e\n(Range of wavelengths results in):\u003cbr\u003e\nCentral maximum unchanged in width\u003cbr\u003e\nBroader maxima/range of angles for each maximum/order\u003cbr\u003e\nGradually getting broader/more spread out for greater order maxima\u003cbr\u003e\nPart of third order maximum suppressed at long wavelengths (for θ \u0026gt; 90°)\u003cbr\u003e\n\u003cem\u003eGive credit for answer shown in diagram\u003cbr\u003e\nEvidence for these marks may be seen in calculations\u003cbr\u003e\nTreat intensity variation as neutral.\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e2\u003cbr\u003e\n[8]\u003cbr\u003e\u003c/strong\u003e","answerMode":"structured","options":[], s consistent with the data.\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\nresistive force ______________________ N\u003cbr\u003e\n\u003cstrong\u003e(4)\u003cbr\u003e\n\u003c/strong\u003e(c)     Explain why the resistive force is unlikely to remain constant as the car descends \u003cbr\u003e\nfrom \u003cstrong\u003eB \u003c/strong\u003eto \u003cstrong\u003eC\u003c/strong\u003e.\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n\u003cstrong\u003e(3)\u003cbr\u003e\n\u003c/strong\u003e(d)     At \u003cstrong\u003eC\u003c/strong\u003e, a passenger of mass 55 kg experiences an upward reaction force of 2160 N when the speed is 22 ms\u003csup\u003e–1\u003c/sup\u003e.\u003cbr\u003e\nCalculate the radius of curvature of the track at \u003cstrong\u003eC\u003c/strong\u003e. Assume that the track is a circular arc at this point.\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n_____________________________________________________________  has a total mass of 550 kg. It takes 25 s to lift the car from \u003cstrong\u003eA \u003c/strong\u003eto \u003cstrong\u003eB\u003c/strong\u003e. It then starts off with negligible velocity and moves unpowered along the track.\u003cbr\u003e","parts":[{"id":"p-a","label":"(a)","marks":3,"questionHtml":"(a)     Calculate the power used in lifting the car and its passengers from \u003cstrong\u003eA \u003c/strong\u003eto \u003cstrong\u003eB\u003c/strong\u003e.\u003cbr\u003e\nInclude an appropriate unit in your answer.\u003cbr\u003e\n\u003cspan class=\"answer-slot\" data-answer-index=\"0\" data-kind=\"long\" data-width=\"72\"\u003e\u003c/span\u003epower\u003cspan class=\"answer-slot\" data-answer-index=\"1\" data-kind=\"long\" data-width=\"24\"\u003e\u003c/span\u003eunit\u003cspan class=\"answer-slot\" data-answer-index=\"2\" data-kind=\"long\" data-width=\"24\"\u003e\u003c/span\u003e\u003cstrong\u003e(3)\u003cbr\u003e\n\u003c/strong\u003e","markSchemeHtml":"(a)     attempt to use power = \u003cem\u003emgh/t \u003c/em\u003eor \u003cem\u003eP\u003c/em\u003e = \u003cem\u003eFv\u003c/em\u003e and \u003cem\u003ev\u003c/em\u003e = \u003cem\u003es/t\u003cbr\u003e\n\u003c/em\u003eC1\u003cbr\u003e\n7546/7550/7600\u003cbr\u003e\nA1\u003cbr\u003e\nW (allow J s\u003csup\u003e–1\u003c/sup\u003e and condone N ms\u003csup\u003e–1\u003c/sup\u003e)\u003cbr\u003e\nB1\u003cbr\u003e\n\u003cstrong\u003e3\u003cbr\u003e\n\u003c/strong\u003e","selfAssessItems":[{"id":"p-a-sa-1","part":"(a)","label":"attempt to use power = mgh/t or P = Fv and v = s/t","value":1},{"id":"p-a-sa-2","part":"(a)","label":"C1","value":1},{"id":"p-a-sa-3","part":"(a)","label":"7546/7550/7600","value":1}]},{"id":"p-b","label":"(b)","marks":4,"questionHtml":"(b)     The speed reached by the car at \u003cstrong\u003eC\u003c/strong\u003e, the bottom of the first dip, is 22 ms\u003csup\u003e–1\u003c/sup\u003e. The length of the track from \u003cstrong\u003eB \u003c/strong\u003eto the bottom of the first dip \u003cstrong\u003eC \u003c/strong\u003eis 63 m.\u003cbr\u003e\nCalculate the average resistive force acting on the car during the descent.\u003cbr\u003e\nGive your answer to a number of significant figures consistent with the data.\u003cbr\u003e\n\u003cspan class=\"answer-slot\" data-answer-index=\"0\" data-kind=\"long\" data-width=\"72\"\u003e\u003c/span\u003eresistive force \u003cspan class=\"answer-slot\" data-answer-index=\"1\" data-kind=\"long\" data-width=\"24\"\u003e\u003c/span\u003e N\u003cbr\u003e\n\u003cstrong\u003e(4)\u003cbr\u003e\n\u003c/strong\u003e","markSchemeHtml":"(b)     loss of GPE = 550 × 9.81 × 35 = 189 kJ\u003cbr\u003e\nC1\u003cbr\u003e\ngain in KE = 0.5 × 550 × 22\u003csup\u003e2\u003c/sup\u003e = 133 kJ\u003cbr\u003e\nC1\u003cbr\u003e\nresistance force = their difference/63 (890 N if correct)\u003cbr\u003e\nA1\u003cbr\u003e\nanswer to 2 sf (allow if answer is from working even\u003cbr\u003e\nif incorrect)\u003cbr\u003e\nB1\u003cbr\u003e\n\u003cstrong\u003e4\u003cbr\u003e\n\u003c/strong\u003e","selfAssessItems":[{"id":"p-b-sa-1","part":"(b)","label":"loss of GPE = 550 × 9.81 × 35 = 189 kJ","value":1},{"id":"p-b-sa-2","part":"(b)","label":"C1","value":1},{"id":"p-b-sa-3","part":"(b)","label":"gain in KE = 0.5 × 550 × 222 = 133 kJ","value":1},{"id":"p-b-sa-4","part":"(b)","label":"C1","value":1}]},{"id":"p-c","label":"(c)","marks":3,"questionHtml":"(c)     Explain why the resistive force is unlikely to remain constant as the car descends \u003cbr\u003e\nfrom \u003cstrong\u003eB \u003c/strong\u003eto \u003cstrong\u003eC\u003c/strong\u003e.\u003cbr\u003e\n\u003cspan class=\"answer-slot\" data-answer-index=\"0\" data-kind=\"long\" data-width=\"72\"\u003e\u003c/span\u003e\u003cstrong\u003e(3)\u003cbr\u003e\n\u003c/strong\u003e","markSchemeHtml":"(c)     air resistance varies/increases\u003cbr\u003e\nB1\u003cbr\u003e\nfrictional force varies/increases\u003cbr\u003e\nB1\u003cbr\u003e\nfurther detail: air resistance increases with speed/v\u003cbr\u003e\nor normal re ay bends towards the normal'.\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e2\u003cbr\u003e\n\u003c/strong\u003e","selfAssessItems":[{"id":"p-b-sa-1","part":"(b)","label":"Conclusion consistent with their Figure 1","value":1},{"id":"p-b-sa-2","part":"(b)","label":"Supported by consideration of their angles of incidence and refraction at AB boundary","value":1}]},{"id":"p-c","label":"(c)","marks":1,"questionHtml":"The block is used with a telescope to investigate stars.\u003cbr\u003e\nThe block can be replaced with a diffraction grating.\u003cbr\u003e\u003cbr\u003e(c)  Describe \u003cstrong\u003eone\u003c/strong\u003e non-astronomical application of a diffraction grating.\u003cbr\u003e\n\u003cspan class=\"answer-slot\" data-answer-index=\"0\" data-kind=\"long\" data-width=\"72\"\u003e\u003c/span\u003e\u003cstrong\u003e(1)\u003cbr\u003e\n\u003c/strong\u003e","markSchemeHtml":"(c)     appropriate application described ✔\u003cbr\u003e\n\u003cem\u003ehow the grating is used must be described e.g 'used to determine λ of named light source' or 'used to identify elements in a sample'\u003cbr\u003e\nExamples:\u003cbr\u003e\nTo analyse chemical composition (of a sample)\u003cbr\u003e\nTo stabilise/filter laser light\u003cbr\u003e\nTo provide a monochromatic source/select a particular wavelength of light\u003cbr\u003e\nIn optical encoders for high-precision motor control\u003cbr\u003e\nSpread evenly the light from e-readers\u003cbr\u003e\nCondone:\u003cbr\u003e\nto identify (some) authentic bank notes\u003cbr\u003e\napplications associated with entertainment eg light shows/diffraction glasses.\u003cbr\u003e\napplication associated with analysis of the light from the Sun\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e1\u003cbr\u003e\n\u003c/strong\u003e","selfAssessItems":[{"id":"p-c-sa-1","part":"(c)","label":"appropriate application described","value":1}]},{"id":"p-d","label":"(d)","marks":3,"questio e\n\u003cem\u003eMP2 and MP3 may be seen together\u003cbr\u003e\nCalculator value range: 1.251790×10\u003csup\u003e6\u003c/sup\u003e m\u003csup\u003e-1\u003c/sup\u003e to 1.2435547×10\u003csup\u003e6\u003c/sup\u003e m\u003csup\u003e-1\u003c/sup\u003e to 1.235427×10\u003csup\u003e6\u003c/sup\u003e m\u003csup\u003e-1\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/sup\u003e\u003c/em\u003e\u003cstrong\u003e3\u003cbr\u003e\n\u003c/strong\u003e","selfAssessItems":[{"id":"p-d-sa-1","part":"(d)","label":"λ read from spectrum = 380 nm","value":1},{"id":"p-d-sa-2","part":"(d)","label":"to give 1.2 × 106 (m-1)","value":1}]},{"id":"p-e","label":"(e)","marks":3,"questionHtml":"(e)  A scientist wants to obtain an accurate value for the difference in wavelength between line \u003cstrong\u003eX\u003c/strong\u003e and line \u003cstrong\u003eY\u003c/strong\u003e.\u003cbr\u003e\nShe has two options:\u003cbr\u003e\n•   option 1: to analyse the second-order spectrum from the original grating\u003cbr\u003e\n•   option 2: to analyse the first-order spectrum from a grating with 2\u003cem\u003eG\u003c/em\u003e lines per metre.\u003cbr\u003e\nDiscuss which option she should choose.\u003cbr\u003e\n\u003cspan class=\"answer-slot\" data-answer-index=\"0\" data-kind=\"long\" data-width=\"72\"\u003e\u003c/span\u003e\u003cstrong\u003e(3)\u003cbr\u003e\u003c/strong\u003e","markSchemeHtml":"(e)     Argument involving sin\u003cem\u003eθ\u003c/em\u003e = \u003cem\u003enG\u003c/em\u003eλ or equivalent comparing effect of \u003cem\u003en\u003c/em\u003e = 2 and \u003cem\u003eG'\u003c/em\u003e = 2\u003cem\u003eG\u003c/em\u003e ✔\u003cbr\u003e\nAppreciation that angular separations would be the same for both options ✔\u003cbr\u003e\n\u003cem\u003eFor MP3, allow maxima are better defined in option 2\u003cbr\u003e\n\u003c/em\u003eDiscussion suggesting option 2 / 2\u003cem\u003eG\u003c/em\u003e should be used, as \u003cem\u003en\u003c/em\u003e = 2 spectrum could overlap with other orders obscuring absorption lines ✔\u003cbr\u003e\n\u003cem\u003eAlternative for MP3: idea that 2G should be used as the second-order spectrum would be dimmer - allow reverse argument that 2G first order would be brighter.\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e3\u003cbr\u003e\n[10]\u003cbr\u003e\u003c/strong\u003e","selfAssessItems":[{"id":"p-e-sa-1","part":"(e)","label":"Argument involving sinθ = nGλ or equivalent comparing effect of n = 2 and G' = 2G","value":1},{"id":"p-e-sa-2","part":"(e)","label":"Appreciation that angular separations would be the same for both options","value":1},{"id":"p-e-sa-3","part":"(e)","label":"Discussion suggesting option 2 / 2G should be used, as n = 2 spectrum could overlap with other orders obscuring absorption lines","value":1}]}],"selfAssessItems":[{"id":"sa-1","part":"(a)","label":"ray in B horizontal by eye","value":1},{"id":"sa-2","part":"(b)","label":"Conclusion consistent with their Figure 1","value":1},{"id":"sa-3","part":"(b)","label":"Supported by consideration of their angles of incidence and refraction at AB boundary","value":1},{"id":"sa-4","part":"(c)","label":"appropriate application described","value":1},{"id":"sa-5","part":"(d)","label":"λ read from spectrum = 380 nm","value":1},{"id":"sa-6","part":"(d)","label":"to give 1.2 × 106 (m-1)","value":1},{"id":"sa-7","part":"(e)","label":"Argument involving sinθ = nGλ or equivalent comparing effect of n = 2 and G' = 2G","value":1},{"id":"sa-8","part":"(e)","label":"Appreciation that angular separations would be the same for both options","value":1},{"id":"sa-9","part":"(e)","label":"Discussion suggesting option 2 / 2G should be used, as n = 2 spectrum could overlap with other orders obscuring absorption lines","value":1}]},{"datasetKey":"alevel","datasetLabel":"A-level Physics","questionId":"QS19.S1.06","summary":"Structure of anti-hydrogen; line spectra","marks":10,"timeMinutes":13,"questionType":"State/explain/numerical","series":"2019 Summer AS Paper 1","topics":["Particles"],"questionHtml":"Scientists at CERN have produced atoms of antihydrogen.\u003cbr\u003e\nAn atom of antihydrogen contains the antiparticle of the proton and the antiparticle of the electron.\u003cbr\u003e\n(a)  State what is meant by an antiparticle.\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n\u003cstrong\u003e(2)\u003cbr\u003e\n\u003c/strong\u003e(b)  Complete the table with the names of the antiparticles in an atom of antihydrogen.\u003cbr\u003e\n \u003cbr\u003e\n\n\u003cdiv class=\"rtf-table-wrap\"\u003e\u003ctable class=\"rtf-table\"\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eName of particle\n\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003eName of antiparticle\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eproton\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eelectron\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\n\u003cstrong\u003e(2)\u003cbr\u003e\n\u003c/strong\u003e(c)  The particles in antihydrogen can be made by pair production.\u003cbr\u003e\nCalculate the total minimum energy, in J, needed to produce the particles in one atom of antihydrogen.\u003cbr\u003e\nenergy = ____________________ J\u003cbr\u003e\n\u003cstrong\u003e(3)\u003cbr\u003e\n\u003c/strong\u003e(d)  Line emission spectra of hydrogen and antihydrogen have been compared.\u003cbr\u003e\nExplain in terms of energy changes how line emission spectra are produced.\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n___________________________________________________________________\u003cbr\u003e\n\u003cstrong\u003e(3)\u003cbr\u003e\n(Total 10 marks)\u003cbr\u003e\u003c/strong\u003e","markSchemeHtml":"(a)  Particle with equal (rest) mass/energy ✔\u003cbr\u003e\nbut opposite charge/baryon number/lepton number ✔\u003cbr\u003e\n\u003cstrong\u003e2\u003cbr\u003e\n\u003c/strong\u003e(b)  Antiproton ✔\u003cbr\u003e\nPositron ✔\u003cbr\u003e\n\u003cem\u003eDo not accept antielectron for positron\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e2\u003cbr\u003e\n\u003c/strong\u003e(c)  Rest energy of positron (0.510999) and antiproton (938.257) quoted, or 938.768 (MeV) seen ✔\u003cbr\u003e\nMultiplies by 1.6 ✔\u003cbr\u003e\n1.5 × 10\u003csup\u003e–10\u003c/sup\u003e (J) ✔\u003cbr\u003e\n\u003cem\u003eAllow valid use of E=mc\u003csup\u003e2\u003c/sup\u003e.\u003cbr\u003e\nAllow any power of ten\u003cbr\u003e\nAllow credit for 3.0 × 10\u003csup\u003e–10\u003c/sup\u003e (J) for proton–antiproton and electron–positron production\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003c/em\u003e\u003cstrong\u003e3\u003cbr\u003e\n\u003c/strong\u003e(d)  Max 3 ✔ ✔ ✔\u003cbr\u003e\nIdea that (atomic) energy levels/states are discrete, or (emitted) photon energy is discrete\u003cbr\u003e\nIdea that a photon is produced by electrons/atoms moving to lower energy levels/states\u003cbr\u003e\n\u003cem\u003eAllow light/radiation for “photon”\u003cbr\u003e\n\u003c/em\u003eIdea that wavelength/frequency relates to photon energy/\u003cem\u0 ,{"id":"sa-5","part":"(c)","label":"Idea of atomic electron moves from B to A and (visible) photon is emitted","value":1},{"id":"sa-6","part":"(c)","label":"Reason for ground state to B, 1 from","value":1},{"id":"sa-7","part":"(c)","label":"18.4 eV is equal to energy difference between the levels.","value":1},{"id":"sa-8","part":"(c)","label":"-21.56 + 18.4(0) = -3.16 seen","value":1},{"id":"sa-9","part":"(c)","label":"21.56 - 3.16 = 18.4(0) seen.","value":1},{"id":"sa-10","part":"(c)","label":"-3.16 - -21.56 = 18.4(0) seen","value":1},{"id":"sa-11","part":"(c)","label":"21.56 - 18.4(0) =3.16 seen","value":1},{"id":"sa-12","part":"(c)","label":"Reason for B to A, 1 from","value":1},{"id":"sa-13","part":"(c)","label":"energy difference (between B and A) is 1.8 eV and this is less than 6.7 eV (and therefore will emit a longer wavelength photon)","value":1},{"id":"sa-14","part":"(c)","label":"other transitions (B to ground or A to ground) are too big, and wavelength is too small for visible light.","value":1},{"id":"sa-15","part":"(c)","label":"calculates wavelength for 1.8 eV and states this is in visible range","value":1},{"id":"sa-16","part":"(c)","label":"leads to 67.5 nm (not visible)","value":1},{"id":"sa-17","part":"(c)","label":"more energy than 6.7 eV ( uv)","value":1},{"id":"sa-18","part":"(c)","label":"Atom de-excites and electron moves down energy level an emits a photon","value":1}]}]};
      const state = {
        studentName: "",
        startedAt: "",
        currentIndex: 0,
        answers: {}
      };
      const app = document.getElementById("app");
      const studentLine = document.getElementById("studentLine");
      const globalScore = document.getElementById("globalScore");

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function currentQuestion() {
        return ASSIGNMENT.questions[state.currentIndex];
      }

      function currentAwardedMarks() {
        return ASSIGNMENT.questions.reduce((sum, question) => {
          return sum + Number(state.answers[question.questionId]?.awardedMarks || 0);
        }, 0);
      }

      function refreshGlobalScore() {
        if (globalScore) globalScore.textContent = `${currentAwardedMarks()}/${ASSIGNMENT.totalMarks}`;
        const questionTotalScore = document.getElementById("questionTotalScore");
        if (questionTotalScore) questionTotalScore.textContent = `${currentAwardedMarks()}/${ASSIGNMENT.totalMarks}`;
      }

      function ensureAnswer(question) {
        if (!state.answers[question.questionId]) {
          state.answers[question.questionId] = {
            studentAnswer: "",
            submitted: false,
            partAnswers: {},
            partSubmitted: {},
            partScores: {},
            checkedItems: {},
            awardedMarks: 0
          };
        }
        return state.answers[question.questionId];
      }

      function countAnswerSlots(part) {
        const indexes = [...String(part.questionHtml || "").matchAll(/data-answer-index="(\d+)"/g)].map((match) => Number(match[1]));
        return indexes.length ? Math.max(...indexes) + 1 : 1;
      }

      function ensurePartAnswer(answer, part) {
        if (!answer.partAnswers[part.id]) {
          answer.partAnswers[part.id] = Array.from({ length: countAnswerSlots(part) }, () => "");
        }
        return answer.partAnswers[part.id];
      }

      function questionComplete(question, answer) {
        if (question.answerMode === "multiple-choice") return answer.submitted;
        return (question.parts || []).every((part) => answer.partSubmitted[part.id]);
      }

      function hydratePartHtml(part, values, disabled) {
        const source = String(part.questionHtml || "");
        const disabledAttr = disabled ? "disabled" : "";
        if (!source.includes('class="answer-slot"')) {
          return `${source}<textarea class="inline-answer" data-answer-input-part="${escapeHtml(part.id)}" data-answer-input-index="0" ${disabledAttr}>${escapeHtml(values[0] || "")}</textarea>`;
        }
        return source.replace(
          /<span class="answer-slot" data-answer-index="(\d+)" data-kind="([^"]+)" data-width="([^"]+)"><\/span>/g,
          (_match, index, kind, width) => {
            const value = escapeHtml(values[Number(index)] || "");
            if (kind === "choice") {
              const checked = values[Number(index)] === String(width) ? "checked" : "";
              return `<input type="radio" class="tick-choice-input" name="answer-${escapeHtml(part.id)}-${index}" data-answer-input-part="${escapeHtml(part.id)}" data-answer-input-index="${index}" value="${escapeHtml(width)}" ${checked} ${disabledAttr}>`;
            }
            if (kind === "short") {
              return `<input class="short-answer" data-answer-input-part="${escapeHtml(part.id)}" data-answer-input-index="${index}" style="width:${Number(width) + 5}ch" value="${value}" ${disabledAttr}>`;
            }
            return `<textarea class="inline-answer" data-answer-input-part="${escapeHtml(part.id)}" data-answer-input-index="${index}" ${disabledAttr}>${value}</textarea>`;
          }
        );
      }

      function renderStart() {
        app.innerHTML = `
          <section class="card start-card">
            <h2>Start assignment</h2>
            <label>
              <span>Student name</span>
              <select id="studentName">
                <option value="">Choose your name</option>
                ${ASSIGNMENT.studentNames.map((name) => `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`).join("")}
              </select>
            </label>
            <button id="startButton" type="button">Start answering</button>
          </section>
        `;
        document.getElementById("startButton").addEventListener("click", () => {
          const name = document.getElementById("studentName").value;
          if (!name) return;
          state.studentName = name;
          state.startedAt = new Date().toISOString();
          studentLine.textContent = `${name} · started ${new Date(state.startedAt).toLocaleString()}`;
          renderQuestion();
        });
      }

      function answerInput(question, answer) {
        if (question.answerMode === "multiple-choice" && question.options.length) {
          return `
            <div class="choice-list compact">
              ${question.options.map((option) => `
                <label class="choice choice-letter">
                  <input type="radio" name="studentAnswer" value="${escapeHtml(option.label)}" ${answer.studentAnswer === option.label ? "checked" : ""} ${answer.submitted ? "disabled" : ""}>
                  <span>${escapeHtml(option.label)}</span>
                </label>
              `).join("")}
            </div>
          `;
        }
        return "";
      }

      function assessmentMarkup(question, answer) {
        if (!answer.submitted) return "";
        if (question.answerMode === "multiple-choice") {
          const isCorrect = answer.studentAnswer && answer.studentAnswer === question.correctOption;
          return `
            <section class="answer-collapse">
              <button class="answer-collapse-toggle" type="button" data-collapse-toggle data-label="answer">Answer</button>
              <div class="answer-collapse-body">
                <section class="mark-scheme">
                  <h3>Answer</h3>
                  <p class="assessment-score">${isCorrect ? "Correct" : "Not correct"}: ${escapeHtml(answer.studentAnswer || "No answer")} · Correct answer: ${escapeHtml(question.correctOption || "See mark scheme")} · Score: ${answer.awardedMarks} / ${question.marks}</p>
                  <div class="question-body">${question.markSchemeHtml}</div>
                </section>
              </div>
            </section>
          `;
        }
        return "";
      }

      function partAssessmentMarkup(part, answer) {
        if (!answer.partSubmitted[part.id]) return "";
        return `
          <section class="answer-collapse">
            <button class="answer-collapse-toggle" type="button" data-collapse-toggle data-label="answer ${escapeHtml(part.label)}">Answer ${escapeHtml(part.label)}</button>
            <div class="answer-collapse-body">
              <section class="mark-scheme">
                <h3>Mark scheme ${escapeHtml(part.label)}</h3>
                <p class="muted">Tick the boxes in the mark scheme. The score is capped at this part's marks.</p>
                <div class="question-body">${markSchemeWithInlineAssess(part, answer)}</div>
                <p class="assessment-score" id="assessmentScore-${escapeHtml(part.id)}">Score: ${answer.partScores[part.id] || 0} / ${part.marks || "?"}</p>
              </section>
            </div>
          </section>
        `;
      }

      function markSchemeWithInlineAssess(part, answer) {
        const items = part.selfAssessItems || [];
        let itemIndex = 0;
        const makeCheckbox = (item) => `
          <label class="inline-mark-point">
            <input type="checkbox" data-assess-part="${escapeHtml(part.id)}" data-assess-id="${escapeHtml(item.id)}" ${answer.checkedItems[item.id] ? "checked" : ""}>
          </label>`;
        const html = String(part.markSchemeHtml || "");
        const withTicks = html.replace(/(✓|✔|&#10003;|&#x2713;|&#10004;|&#x2714;)/g, (tick) => {
          const item = items[itemIndex] || {
            id: `${part.id}-inline-${itemIndex + 1}`,
            label: "Marking point",
            value: 1
          };
          itemIndex += 1;
          return tick + makeCheckbox(item);
        });
        if (itemIndex > 0) return withTicks;

        return `
          ${html}
          <div class="inline-mark-point-fallback">
            ${items.map((item) => `
              <label>
                <input type="checkbox" data-assess-part="${escapeHtml(part.id)}" data-assess-id="${escapeHtml(item.id)}" ${answer.checkedItems[item.id] ? "checked" : ""}>
                ${escapeHtml(item.label)} <em>(+${Number(item.value || 1)})</em>
              </label>
            `).join("")}
          </div>
        `;
      }

      function structuredQuestionMarkup(question, answer) {
        return `
          ${question.introHtml ? `<div class="question-body">${question.introHtml}</div>` : ""}
          ${(question.parts || []).map((part) => {
            const values = ensurePartAnswer(answer, part);
            const submitted = Boolean(answer.partSubmitted[part.id]);
            return `
              <section class="part-card">
                <div class="part-header">
                  <strong>${escapeHtml(part.label)}</strong>
                  <span class="muted">${part.marks || "?"} mark${Number(part.marks) === 1 ? "" : "s"}</span>
                </div>
                <div class="part-body">
                  <div class="question-body">${hydratePartHtml(part, values, submitted)}</div>
                  <button type="button" data-submit-part="${escapeHtml(part.id)}" ${submitted ? "hidden" : ""}>Submit ${escapeHtml(part.label)}</button>
                  ${partAssessmentMarkup(part, answer)}
                </div>
              </section>
            `;
          }).join("")}
        `;
      }

      function collectPartAnswer(part, answer) {
        const inputs = [...document.querySelectorAll(`[data-answer-input-part="${part.id}"]`)];
        const values = [];
        inputs
          .sort((a, b) => Number(a.dataset.answerInputIndex) - Number(b.dataset.answerInputIndex))
          .forEach((input) => {
            const index = Number(input.dataset.answerInputIndex);
            if (input.type === "radio") {
              if (input.checked) values[index] = input.value.trim();
              else if (values[index] === undefined) values[index] = "";
              return;
            }
            values[index] = input.value.trim();
          });
        answer.partAnswers[part.id] = values;
      }

      function updateQuestionAwardedMarks(question, answer) {
        if (question.answerMode === "multiple-choice") {
          answer.awardedMarks = answer.studentAnswer === question.correctOption ? Number(question.marks || 0) : 0;
          refreshGlobalScore();
          return;
        }
        answer.awardedMarks = (question.parts || []).reduce((sum, part) => sum + Number(answer.partScores[part.id] || 0), 0);
        refreshGlobalScore();
      }

      function renderQuestion() {
        const question = currentQuestion();
        const answer = ensureAnswer(question);
        app.innerHTML = `
          <article class="card">
            <div class="question-header">
              <div>
                <h2>${state.currentIndex + 1}. ${escapeHtml(question.questionId)}</h2>
                <div class="question-meta">${escapeHtml(question.datasetLabel)} · ${escapeHtml(question.series)} · ${escapeHtml(question.questionType)}</div>
              </div>
              <div class="stats question-stats">
                <div><strong>${question.marks}</strong><span>Marks</span></div>
                <div><strong>${question.timeMinutes}</strong><span>Minutes</span></div>
                <div><strong id="questionTotalScore">${currentAwardedMarks()}/${ASSIGNMENT.totalMarks}</strong><span>Total marks</span></div>
              </div>
            </div>
            ${question.answerMode === "structured" ? structuredQuestionMarkup(question, answer) : `<div class="question-body">${question.questionHtml}</div>`}
          </article>
          <section class="answer-panel">
            ${question.answerMode === "multiple-choice" ? `<h3>Your answer</h3>${answerInput(question, answer)}<button id="submitQuestion" type="button" ${answer.submitted ? "hidden" : ""}>Submit</button>` : `<h3>Your progress</h3><p class="muted">Submit each part to reveal its mark scheme, then self assess that part.</p>`}
            ${assessmentMarkup(question, answer)}
            <div class="nav-row">
              <button class="secondary" id="previousQuestion" type="button" ${state.currentIndex === 0 ? "disabled" : ""}>Previous</button>
              <button id="nextQuestion" type="button" ${questionComplete(question, answer) ? "" : "disabled"}>${state.currentIndex === ASSIGNMENT.questions.length - 1 ? "Finish assignment" : "Next question"}</button>
            </div>
          </section>
        `;

        const submitButton = document.getElementById("submitQuestion");
        if (submitButton) {
          submitButton.addEventListener("click", () => {
            if (question.answerMode === "multiple-choice") {
              const checked = document.querySelector("input[name='studentAnswer']:checked");
              answer.studentAnswer = checked ? checked.value : "";
              updateQuestionAwardedMarks(question, answer);
            }
            answer.submitted = true;
            renderQuestion();
          });
        }

        document.querySelectorAll("[data-submit-part]").forEach((button) => {
          button.addEventListener("click", () => {
            const part = (question.parts || []).find((item) => item.id === button.dataset.submitPart);
            if (!part) return;
            collectPartAnswer(part, answer);
            answer.partSubmitted[part.id] = true;
            updateQuestionAwardedMarks(question, answer);
            renderQuestion();
          });
        });

        document.querySelectorAll("[data-assess-id]").forEach((checkbox) => {
          checkbox.addEventListener("change", () => {
            answer.checkedItems[checkbox.dataset.assessId] = checkbox.checked;
            updateScore(question, answer, checkbox.dataset.assessPart);
          });
        });

        document.querySelectorAll("[data-collapse-toggle]").forEach((button) => {
          button.addEventListener("click", () => {
            const body = button.nextElementSibling;
            if (!body) return;
            body.hidden = !body.hidden;
            button.dataset.collapsed = body.hidden ? "true" : "false";
            const label = button.dataset.label || "answer";
            button.textContent = label.charAt(0).toUpperCase() + label.slice(1);
          });
        });

        document.getElementById("previousQuestion").addEventListener("click", () => {
          if (state.currentIndex > 0) {
            state.currentIndex -= 1;
            renderQuestion();
          }
        });

        document.getElementById("nextQuestion").addEventListener("click", () => {
          if (!questionComplete(question, answer)) return;
          if (state.currentIndex === ASSIGNMENT.questions.length - 1) renderFinal();
          else {
            state.currentIndex += 1;
            renderQuestion();
          }
        });
      }

      function updateScore(question, answer, partId) {
        const part = (question.parts || []).find((item) => item.id === partId);
        if (!part) return;
        const score = part.selfAssessItems.reduce((sum, item) => {
          return sum + (answer.checkedItems[item.id] ? Number(item.value || 1) : 0);
        }, 0);
        answer.partScores[part.id] = Math.min(Number(part.marks || question.marks || 0), score);
        updateQuestionAwardedMarks(question, answer);
        const scoreElement = document.getElementById(`assessmentScore-${part.id}`);
        if (scoreElement) scoreElement.textContent = `Score: ${answer.partScores[part.id]} / ${part.marks || "?"}`;
      }

      function buildPayload() {
        const questions = ASSIGNMENT.questions.map((question) => {
          const answer = ensureAnswer(question);
          const parts = (question.parts || []).map((part) => ({
            id: part.id,
            label: part.label,
            marks: part.marks,
            studentAnswer: answer.partAnswers[part.id] || [],
            submitted: Boolean(answer.partSubmitted[part.id]),
            selfAssessItems: part.selfAssessItems.map((item) => ({
              id: item.id,
              label: item.label,
              value: item.value,
              checked: Boolean(answer.checkedItems[item.id])
            })),
            awardedMarks: Number(answer.partScores[part.id] || 0)
          }));
          return {
            questionId: question.questionId,
            marks: question.marks,
            timeMinutes: question.timeMinutes,
            answerMode: question.answerMode,
            studentAnswer: answer.studentAnswer,
            correctOption: question.correctOption || "",
            parts,
            awardedMarks: Number(answer.awardedMarks || 0)
          };
        });
        const awardedMarks = questions.reduce((sum, question) => sum + Number(question.awardedMarks || 0), 0);
        const submittedAt = new Date().toISOString();
        return {
          submissionId: `${ASSIGNMENT.assignmentId}-${state.studentName}-${Date.now().toString(36)}`,
          assignmentId: ASSIGNMENT.assignmentId,
          assignmentTitle: ASSIGNMENT.assignmentTitle,
          studentName: state.studentName,
          startedAt: state.startedAt,
          submittedAt,
          durationSeconds: Math.round((new Date(submittedAt).getTime() - new Date(state.startedAt).getTime()) / 1000),
          totalMarks: ASSIGNMENT.totalMarks,
          awardedMarks,
          questions
        };
      }

      function renderFinal() {
        const payload = buildPayload();
        app.innerHTML = `
          <section class="final-panel">
            <h2>Assignment complete</h2>
            <p>Your recorded score is <strong>${payload.awardedMarks} / ${payload.totalMarks}</strong>.</p>
            <button class="big-submit" id="submitToTeacher" type="button">Submit to teacher</button>
            <p class="status" id="submitStatus"></p>
          </section>
        `;
        document.getElementById("submitToTeacher").addEventListener("click", () => submitToTeacher(buildPayload()));
      }

      function submitToTeacher(payload) {
        const status = document.getElementById("submitStatus");
        if (!ASSIGNMENT.appsScriptUrl) {
          downloadJson(payload);
          status.textContent = "No Apps Script URL was configured. Submission JSON downloaded instead.";
          status.className = "status warning";
          return;
        }

        const form = document.createElement("form");
        form.method = "POST";
        form.action = ASSIGNMENT.appsScriptUrl;
        form.target = "submitFrame";
        form.hidden = true;

        const input = document.createElement("textarea");
        input.name = "payload";
        input.value = JSON.stringify(payload);
        form.append(input);
        document.body.append(form);

        const frame = document.getElementById("submitFrame");
        frame.addEventListener("load", () => {
          status.textContent = "Submitted. Your teacher will see the JSON file in Drive and the score row in Google Sheets.";
          status.className = "status success";
          form.remove();
        }, { once: true });

        status.textContent = "Submitting...";
        form.submit();
      }

      function downloadJson(payload) {
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `${ASSIGNMENT.assignmentId}-${state.studentName || "student"}-submission.json`;
        document.body.append(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      }

      renderStart();
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Physics Homework</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #0b1f35;
      --muted: #5d6f86;
      --line: #d7e1ec;
      --paper: #f6f8fb;
      --card: #ffffff;
      --blue: #2f6fa7;
      --blue-strong: #174a78;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(47, 111, 167, 0.12), transparent 38%),
        linear-gradient(315deg, rgba(23, 74, 120, 0.10), transparent 34%),
        var(--paper);
      display: grid;
      place-items: center;
      padding: 28px;
    }
    main {
      width: min(760px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 20px 55px rgba(11, 31, 53, 0.12);
      padding: 32px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(32px, 6vw, 54px);
      line-height: 1;
      letter-spacing: 0;
    }
    p {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 18px;
    }
    .homework-list {
      display: grid;
      gap: 12px;
    }
    a {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-radius: 8px;
      text-decoration: none;
      color: var(--ink);
      background: #fbfdff;
      font-size: 20px;
      font-weight: 700;
    }
    a:hover {
      border-color: var(--blue);
      color: var(--blue-strong);
      background: #f3f8fd;
    }
    span {
      color: var(--muted);
      font-size: 14px;
      font-weight: 400;
      white-space: nowrap;
    }
    @media (max-width: 560px) {
      body {
        padding: 14px;
      }
      main {
        padding: 22px;
      }
      a {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Physics Homework</h1>
    <p>Choose the assignment page to open.</p>
    <section class="homework-list" aria-label="Homework pages">
      <a href="2025-AS-AND-AL-paper-continuous-no-submit.html">2025 AS and AL Paper (No submit) <span>Open assignment</span></a>
      <a href="Thursday-Homework.html">Thursday Homework <span>Open assignment</span></a>
      <a href="Friday-Homework.html">Friday Homework <span>Open assignment</span></a>
      <a href="Monday-Homework.html">Monday Homework <span>Open assignment</span></a>
      <a href="Tuesday-Homework.html">Tuesday Homework <span>Open assignment</span></a>
      <a href="Wednesday-Homework.html">Wednesday Homework <span>Open assignment</span></a>
    </section>
  </main>
</body>
</html>
